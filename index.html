      { h: 'F\nClicks', w: 13, a: 'right', f: N0 },
      { h: 'G\nApply rate\nE / F', w: 12, a: 'right', f: PCT2 },
      { h: 'H\nCost per application, measured\nD / E', w: 20, a: 'right', f: GBP2 },
      { h: 'I\nCost per application, used\nsee column Q', w: 22, a: 'right', f: GBP2 },
      { h: 'J\nBudget this month', w: 16, a: 'right', f: GBP },
      { h: 'K\nPredicted applications\nJ / I', w: 17, a: 'right', f: N1 },
      { h: 'L\nBiggest month already run', w: 17, a: 'right', f: GBP },
      { h: 'M\nAbove proven spend\nJ - L', w: 15, a: 'right', f: GBP },
      { h: 'N\nHire rate', w: 11, a: 'right', f: PCT2 },
      { h: 'O\nPredicted hires\nK x N', w: 14, a: 'right', f: N1 },
      { h: 'P\nCost per hire\nJ / O', w: 14, a: 'right', f: GBP },
      { h: 'Q\nHow column I is arrived at', w: 64 },
    ];
    const hr = xlHeader(wsW, cols);
    wsW.getRow(hr).height = 48;
    let n = hr;
    const locRows = [];
    plan.locations.forEach(l => {
      const start = n + 1;
      PLATFORMS.forEach(p => {
        const sp = l.platSpend[p] || 0;
        if (!sp) return;
        n += 1;
        const w = weightedStats(p, l.region, role);
        const dR = sumRef(l.region, p, 'D'), eR = sumRef(l.region, p, 'E'), fR = sumRef(l.region, p, 'F');
        // Column I is the figure the plan used, written straight from the plan
        // rather than rebuilt here. It was an Excel formula, and the formula
        // could not match the plan: it pulled toward platformAvgCPA, a plain
        // spend over applications figure, where the engine pulls toward
        // rolePlatformCPA, which is itself already pulled toward the role
        // benchmark. It also used column E, where the engine uses an
        // application count levelled to the length of the period. The gap was
        // small on cells with hundreds of applications behind them and up to
        // 3% on thin ones, which is enough for a client checking the
        // arithmetic to find. The working is now in column Q, as the
        // explanation of the number rather than the source of it.
        const cpaUsed = l.platCpa ? l.platCpa[p] : null;
        const cpaWorking = cpaWorkingText(l, p, role, sumVal(l.region, p, 'completes'));
        style(wsW.addRow([l.region, PLATFORM_LABELS[p], l.vacancies,
          dR ? FX(dR) : w.spend,
          eR ? FX(eR) : w.completes,
          fR ? FX(fR) : 'not recorded',
          fR ? FX('IFERROR(E' + n + '/F' + n + ',"")') : '',
          FX('IFERROR(D' + n + '/E' + n + ',"")'),
          cpaUsed > 0 ? cpaUsed : '',
          sp,
          FX('IFERROR(J' + n + '/I' + n + ',0)'),
          l.peaks ? l.peaks[p] : null,
          FX('MAX(0,J' + n + '-L' + n + ')'),
          regionPlatformHireCVR(p, l.region, role),
          FX('K' + n + '*N' + n),
          FX('IFERROR(J' + n + '/O' + n + ',"")'),
          cpaWorking]), cols);
      });
      // A location funded at nothing has no platform rows, so a total row for
      // it would read SUM(D5:D4): a range that includes the cell it sits in.
      // Excel calls that circular, returns zero, and the plan total that adds
      // it up dies with it, which took the Summary tab down too.
      if (n < start) return;
      n += 1;
      locRows.push(n);
      const S = (c) => 'SUM(' + c + start + ':' + c + (n - 1) + ')';
      style(wsW.addRow([l.region + ' total', '', l.vacancies,
        FX(S('D')), FX(S('E')), FX('IFERROR(' + S('F') + ',"")'),
        FX('IFERROR(E' + n + '/F' + n + ',"")'), FX('IFERROR(D' + n + '/E' + n + ',"")'), '',
        FX(S('J')), FX(S('K')), '', FX(S('M')), '',
        FX(S('O')), FX('IFERROR(J' + n + '/O' + n + ',"")')]),
        cols, { bold: true, fill: XL_HEAD, strong: true });
    });
    n += 1;
    totalRow = n;
    const T = (c) => locRows.map(r => c + r).join('+');
    style(wsW.addRow(['Plan total', '', plan.locations.reduce((a, l) => a + l.vacancies, 0),
      FX(T('D')), FX(T('E')), FX('IFERROR(' + T('F') + ',"")'),
      FX('IFERROR(E' + n + '/F' + n + ',"")'), FX('IFERROR(D' + n + '/E' + n + ',"")'), '',
      FX(T('J')), FX(T('K')), '', FX(T('M')), '',
      FX(T('O')), FX('IFERROR(J' + n + '/O' + n + ',"")')]),
      cols, { bold: true, white: true, fill: XL_NAVY, strong: true, h: 20 });
  }

  // Summary, built last so it can point at the Workings total, moved to the front.
  {
    const ws = wb.addWorksheet('Summary', { views: [{ state: 'frozen', ySplit: 1 }] });
    xlTitle(ws, 'RAC ' + monthLabel + ', ' + role,
      'Prepared by Enhance Media. Performance data: ' + winLabel + '.');
    const cols = [{ h: 'Figure', w: 42 }, { h: 'Value', w: 18, a: 'right' }, { h: 'How it is arrived at', w: 80 }];
    const hr = xlHeader(ws, cols);
    const B = k => 'B' + (hr + k);
    const rows = [
      ['Monthly budget', plan.budget, 'The budget this plan is built on'],
      ['Indeed Premium hold-back', plan.premiumHoldback,
        params.premiumCampaigns + ' campaigns x ' + params.daysInMonth + ' days x \u00A3' + INDEED_PREMIUM_RATE + ' a day'],
      ['Combined Activity hold-back', plan.acHoldback, 'Flat amount for brand-level activity not tied to a location'],
      ['Deployable budget', FX(B(1) + '-' + B(2) + '-' + B(3)), 'Monthly budget less the two hold-backs'],
      ['Of which above spend already run', FX('Workings!M' + totalRow), 'Workings, column M, plan total'],
      ['', '', ''],
      ['Application target', plan.appTarget, 'Hire target worked back through the blended hire rate for the live locations'],
      ['Predicted applications', FX('Workings!K' + totalRow), 'Workings, column K, plan total'],
      ['Predicted applications, low', FX('ROUND(' + B(8) + '*(1-' + B(18) + '),0)'), 'Central figure less the range'],
      ['Predicted applications, high', FX('ROUND(' + B(8) + '*(1+' + B(18) + '),0)'), 'Central figure plus the range'],
      ['', '', ''],
      ['Predicted hires', FX('Workings!O' + totalRow), 'Workings, column O, plan total'],
      ['Predicted hires, low', FX(B(12) + '*(1-' + B(18) + ')'), 'Same range as applications'],
      ['Predicted hires, high', FX(B(12) + '*(1+' + B(18) + ')'), 'Same range as applications'],
      ['Cost per application', FX('IFERROR(' + B(4) + '/' + B(8) + ',"")'), 'Deployable budget divided by predicted applications'],
      ['Cost per hire', FX('IFERROR(' + B(4) + '/' + B(12) + ',"")'), 'Deployable budget divided by predicted hires'],
      ['', '', ''],
      ['Range used', plan.aggBandPct / 100,
        'How much ' + role + ' cost per application moved across ' + plan.aggBandMonths + ' months. See How the range works.'],
      ['Budget to hit the application target', plan.budgetForTarget,
        'Found by running the whole plan at trial budgets until the prediction lands on the target'],
    ];
    xlBody(ws, cols, rows);
    ws.eachRow((row, k) => {
      if (k <= hr) return;
      const c = row.getCell(2), label = String(row.getCell(1).value || '');
      if (/budget|hold-back|already run|Cost per/i.test(label)) c.numFmt = GBP;
      else if (/Range used/i.test(label)) c.numFmt = '0.0%';
      else if (/hires/i.test(label)) c.numFmt = N1;
      else if (/applications|target/i.test(label)) c.numFmt = N0;
    });
    const idx = wb.worksheets.indexOf(ws);
    wb.worksheets.splice(idx, 1);
    wb.worksheets.unshift(ws);
    wb.worksheets.forEach((w, i) => { w.orderNo = i; });
  }

  // How the range works.
  {
    const ws = xlSheet(wb, 'How the range works');
    xlTitle(ws, 'How the range works',
      'The range is ' + Math.round(plan.aggBandPct) + '%, measured on how much ' + role +
      ' cost per application moved across the months marked Yes.');
    const cols = [{ h: 'Month', w: 14 }, { h: 'Spend', w: 16, a: 'right', f: GBP2 },
      { h: 'Applications', w: 14, a: 'right', f: N1 }, { h: 'Cost per application', w: 20, a: 'right', f: GBP2 },
      { h: 'In the period used', w: 18 }];
    const hr = xlHeader(ws, cols);
    const byMonth = {};
    PLATFORMS.forEach(p => DATA.regions_ordered.forEach(r => {
      const m = getMonthly(p, r, role);
      Object.keys(m).forEach(mo => {
        const x = m[mo]; if (!x || !(x.spend > 0)) return;
        const o = byMonth[mo] = byMonth[mo] || { s: 0, a: 0 };
        o.s += x.spend; o.a += x.completes || 0;
      });
    }));
    let n = hr;
    Object.keys(byMonth).sort().forEach(mo => {
      n += 1;
      const o = byMonth[mo];
      const inWin = !win || (mo >= win.from && mo <= win.to);
      style(ws.addRow([mo, o.s, o.a, FX('IFERROR(B' + n + '/C' + n + ',"")'), inWin ? 'Yes' : 'No']),
        cols, { muted: !inWin });
    });
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'RAC_' + monthLabel.replace(/\s+/g, '_') + '_' + role + '_workings.xlsx';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ====================================================================
// PDF EXPORT
// ====================================================================
// The plan's blended apply CVR, weighted by spend across every location and
// platform cell at once.
//
// This has to be measured at the cell, not by blending platforms and then
// blending those, or by blending locations and then blending those. Nesting it
// either way drops cells with no CVR out of the inner average but leaves their
// spend in the outer weight, and the two orders then disagree. On a test plan
// they came out 3.3% and 3.2% for the same money.
function planBlendedCVR(plan, role) {
  let w = 0, wSum = 0;
  (plan.locations || []).forEach(l => {
    PLATFORMS.forEach(plat => {
      const sp = (l.platSpend && l.platSpend[plat]) || 0;
      const cv = regionPlatformCVR(plat, l.region, role);
      if (sp > 0 && cv > 0) { wSum += cv * sp; w += sp; }
    });
  });
  return w > 0 ? wSum / w : 0;
}

function exportPDF(state, role, opts) {
  // One role at a time. RAC want them as separate documents anyway, and
  // exporting both when you only wanted one meant deleting a file every time.
  exportPlanPDF(state, [role], opts);
}

// opts.notes false leaves both commentary sections out. Everything else about
// the document is identical, including the page count and the numbering, so
// the two versions can be put side by side.
function exportPlanPDF(state, roleFilter, opts) {
  const withNotes = !(opts && opts.notes === false);
  const ROLES_ALL = ['SMR', 'Patrol'];
  const roles = (roleFilter && roleFilter.length ? roleFilter : ROLES_ALL)
    .filter(r => ROLES_ALL.includes(r));
  const ROLES = roles; // shadow the global so the body loops over just these
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('l', 'mm', 'a4'); // landscape
    const pageW = pdf.internal.pageSize.getWidth();  // 297
    const pageH = pdf.internal.pageSize.getHeight(); // 210
    const margin = 14;
    const NAVY = [21, 35, 59], ORANGE = [255, 102, 0], BLUE = [37, 99, 235],
          INK = [50, 60, 78], MID = [110, 122, 140], MUTED = [154, 163, 178],
          LIGHT = [245, 247, 250], LINE = [220, 226, 234],
          GREEN = [22, 134, 78];
    const days = (DATA.days_in_month && DATA.days_in_month[state.planMonth]) || 30;
    const monthLabel = (DATA.month_labels && DATA.month_labels[state.planMonth]) || state.planMonth;
    const cov = state.coveragePct;
    const PLATLABEL = { indeed: 'Indeed', meta: 'Meta', google: 'Google', appcast: 'Appcast' };

    // ---- helpers ----------------------------------------------------------
    function setColor(c) { pdf.setTextColor(c[0], c[1], c[2]); }
    function setFill(c) { pdf.setFillColor(c[0], c[1], c[2]); }

    function header(title, subtitle) {
      setFill(NAVY); pdf.rect(0, 0, pageW, 22, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14);
      pdf.text(title, margin, 11);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
      pdf.setTextColor(180, 195, 220);
      if (subtitle) pdf.text(subtitle, margin, 17);
      pdf.text('Prepared by Enhance Media  \u00B7  ' + monthLabel, pageW - margin, 13, { align: 'right' });
      pdf.setFontSize(7.5); setColor(MUTED);
      pdf.text('Based on performance data: ' + benchLabel(benchFor(state, roles[0])), pageW - margin, 18.5, { align: 'right' });
    }

    function footer(pageNum, pageTotal) {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5);
      setColor(MUTED);
      pdf.text('RAC ' + monthLabel + ' Plan  \u00B7  Enhance Media  \u00B7  Page ' + pageNum + ' of ' + pageTotal,
        margin, pageH - 6);
    }

    // ---- build plans for both roles up front -----------------------------
    const plans = {};
    ROLES.forEach(role => {
      // The one builder, so the period and the ceiling cannot be left off and
      // the document cannot disagree with the screen.
      plans[role] = buildFundingPlan(role, {
        ...planParams(role, state),
        appTarget: state.appTarget[role] || 0,
      });
    });
    // Pages: SMR, Patrol, By channel, then region x channel pages
    // (one table per page, 2 roles x 4 platforms = 8 pages), then Glossary
    // (1 or 2 pages depending on how the terms flow).
    const REGION_CHANNEL_PAGES = roles.length * 4; // roles x 4 platforms, one table per page

    // Glossary terms (defined here so we can pre-measure how many pages they need)
    const terms = [
      ['Indeed Premium', 'A fixed daily cost for Indeed\u2019s premium campaigns, held back off the top. Calculated as campaigns \u00D7 days in the month \u00D7 \u00A344 per day per campaign.'],
      ['Combined Activity', 'A flat amount held back for brand-level activity not tied to a specific location.'],
      ['Predicted hires', 'Predicted applications multiplied by the location\u2019s historic hire rate. It carries the same range as applications: fewer applications means fewer hires at the same rate.'],
      ['The range', 'How much the whole plan can move, from how much the cost per application has moved month to month across the benchmark period. It is narrower than any single location, because they do not all miss in the same direction to the same degree.'],
      ['Spend ceiling', 'The most a location and platform can be given: the biggest month it has already spent. Nothing in the plan rests on a spend level that has never been run.'],
      ['Split by open roles', 'The deployable budget divided between locations by their share of open roles: more roles means a bigger share.'],
      ['App target', 'RAC\u2019s application goal for the role; the number the plan is judged against. In the table, each row\u2019s App target is that location\u2019s share, allocated by demand: a location with 22 of 79 open roles is responsible for 22/79 of the total.'],
      ['Predicted applications', 'The applications each location\u2019s budget should produce. Calculated as the location\u2019s budget divided by its blended cost-per-application from history.'],
      ['Cost per application', 'What one application has cost in that location, blended across the four platforms. Where a location has thin data the figure is pulled toward the role-wide average.'],
      ['Hire CVR', 'The share of applications that go on to be hired, from RAC\u2019s own historic data. It is fixed per location and platform rather than recalculated from the plan, because hires lag by several weeks. Locations with no hire data show as such.'],
      ['Cost per hire', 'Spend divided by predicted hires. Hire rates are taken from RAC\u2019s own historic data and are not windowed, because hires lag by several weeks. Shown as n/a where a location has no hire data.'],
      ['Budget to hit target', 'The total spend it would take for the central prediction to land on the application target. Includes the two hold-backs. Where every location has been set to a minimum, there is nothing left to solve for, so this reads Budget your caps require and shows the sum of those minimums plus the hold-backs.'],
      ['Platforms', 'Indeed, Meta, Google Search and Appcast. Each location\u2019s budget goes to whichever of them produces hires most cheaply at the level it can absorb.'],
    ];
    const gColW = (pageW - margin * 2 - 6) / 2;
    // Pre-measure glossary: walk the same column/page flow used to render it,
    // counting how many pages the terms occupy.
    function countGlossaryPages() {
      let pages = 1, col = 0, y = 30;
      terms.forEach(t => {
        const split = pdf.splitTextToSize(t[1], gColW - 4);
        const blockH = 5 + split.length * 3.6 + 4;
        if (y + blockH > pageH - 14) {
          if (col === 0) { col = 1; y = 30; }
          else { pages++; col = 0; y = 30; }
        }
        y += blockH + 1;
      });
      return pages;
    }
    const GLOSSARY_PAGES = countGlossaryPages();
    // At most six points to a page. More than that and the type has to shrink
    // below the point of being read. Where a section spills over, the points
    // are shared evenly rather than filling the first page and leaving one
    // orphan on the second. Each kind of note paginates on its own, so the
    // legacy notes always start on a fresh page.
    const COMMENTARY_PER_PAGE = 6;
    function commentaryChunks(role, kind) {
      const pts = commentaryPoints(state, role, kind);
      if (!pts.length) return [];
      const pages = Math.ceil(pts.length / COMMENTARY_PER_PAGE);
      const per = Math.ceil(pts.length / pages);
      const out = [];
      for (let i = 0; i < pts.length; i += per) out.push(pts.slice(i, i + per));
      return out;
    }
    // Every section that has something written in it, in the order they print:
    // each role's plan notes, then each role's legacy notes.
    const COMMENTARY_SECTIONS = [];
    if (withNotes) COMMENTARY_KINDS.forEach(k => {
      roles.forEach(r => {
        const chunks = commentaryChunks(r, k.key);
        if (chunks.length) COMMENTARY_SECTIONS.push({ role: r, kind: k, chunks });
      });
    });
    const COMMENTARY_PAGES = COMMENTARY_SECTIONS.reduce((s, x) => s + x.chunks.length, 0);
    // By channel is one page for the whole export. By region is a page per
    // role, because twelve locations at a row each will not share.
    const SUMMARY_PAGES = 1 + roles.length;
    const TOTAL_PAGES = roles.length + COMMENTARY_PAGES + SUMMARY_PAGES + REGION_CHANNEL_PAGES + GLOSSARY_PAGES;
    // jsPDF opens with a page already, so the first thing drawn must not add
    // one. Everything after does.
    let pageStarted = false;

    // ---- one page per role -----------------------------------------------
    // Commentary first: it frames everything that follows.
    let commentaryPageNum = 1;
    COMMENTARY_SECTIONS.forEach(sec => {
      commentaryPageNum += commentaryPage(sec, commentaryPageNum);
    });

    ROLES.forEach((role, roleIdx) => {
      if (pageStarted) pdf.addPage();
      pageStarted = true;
      header('RAC ' + monthLabel + ' Plan, ' + role + ': ' + ROLE_FULL[role],
        'Your budget, where it goes, and how many applications it is predicted to deliver');

      const plan = plans[role];
      const premiumCamp = (state.premiumCampaigns && state.premiumCampaigns[role]) || 0;

      // The verdict banner that used to sit here (green on track, amber close,
      // red short) has gone. Every figure it carried is in the tiles below it.
      let y = 28;

      // === Two columns: budget flow + KPI tiles ===
      const colGap = 6;
      const colW = (pageW - margin * 2 - colGap) / 2;
      const leftX = margin;
      const rightX = margin + colW + colGap;
      const blockTop = y;
      const blockH = 64;

      // -- Budget flow card (left) --
      pdf.setDrawColor(LINE[0], LINE[1], LINE[2]); pdf.setLineWidth(0.3);
      setFill(LIGHT); pdf.rect(leftX, y, colW, blockH, 'FD');
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
      pdf.text('How your budget breaks down', leftX + 5, y + 6.5);
      setColor(MID); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
      pdf.text('Hold-backs come off the top, then the rest is split by open roles', leftX + 5, y + 10.5);

      function row(label, math, value, opts) {
        opts = opts || {};
        const rx = leftX + 5;
        const vx = leftX + colW - 5;
        pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal'); pdf.setFontSize(9);
        setColor(opts.bold ? NAVY : INK);
        pdf.text(label, rx, by);
        if (math) {
          pdf.setFont('helvetica', 'italic'); pdf.setFontSize(7.3);
          setColor(MID);
          pdf.text(math, rx, by + 3.4);
        }
        pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal'); pdf.setFontSize(opts.bold ? 10 : 9);
        setColor(opts.bold ? NAVY : INK);
        pdf.text(value, vx, by, { align: 'right' });
      }

      let by = y + 16;
      const lineGap = 8;
      row('Monthly budget', null, fmtGBP(plan.budget), { bold: true }); by += 6;
      row('Indeed Premium', premiumCamp + ' campaigns \u00D7 ' + days + ' days \u00D7 \u00A344/day',
        fmtGBP(plan.premiumHoldback)); by += lineGap;
      row('Combined Activity', 'Held back for brand-level activity',
        fmtGBP(plan.acHoldback)); by += lineGap;
      pdf.setDrawColor(LINE[0], LINE[1], LINE[2]);
      // The rule sat on the cap height of the line below it. Drop it a little
      // and push the row down so the two are not touching.
      pdf.line(leftX + 5, by - 3.6, leftX + colW - 5, by - 3.6);
      by += 1.6;
      row('Deployable budget', 'What we actually distribute across locations',
        fmtGBP(plan.deployable), { bold: true }); by += lineGap;
      row('Split across ' + plan.totalCount + ' locations',
        'By each location\u2019s share of open roles',
        fmtGBP(plan.demandPool));
      if (plan.beyondProven > 1) {
        by += lineGap;
        row('Of which more than has been spent before',
          'These locations have never run a month this big, so we are less sure what this part will bring in',
          fmtGBP(plan.beyondProven));
      }

      // -- KPI tiles (right) --
      const tileW = (colW - colGap) / 2;
      const tileH = (blockH - colGap) / 2;
      function tile(x, y2, label, value, sub, accent) {
        setFill(accent); pdf.rect(x, y2, 2.5, tileH, 'F');
        setFill([255, 255, 255]); pdf.setDrawColor(LINE[0], LINE[1], LINE[2]);
        pdf.rect(x + 2.5, y2, tileW - 2.5, tileH, 'FD');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7);
        setColor(MID);
        pdf.text(label.toUpperCase(), x + 6, y2 + 6);
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16);
        setColor(NAVY);
        pdf.text(value, x + 6, y2 + 17);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
        setColor(INK);
        pdf.text(sub, x + 6, y2 + 25);
      }
      tile(rightX, blockTop, 'Predicted applications', fmtInt(plan.predictedApps),
        'likely ' + fmtInt(plan.predLow) + '\u2013' + fmtInt(plan.predHigh), ORANGE);
      tile(rightX + tileW + colGap, blockTop, 'Application target',
        plan.appTarget > 0 ? fmtInt(plan.appTarget) : 'Not set',
        plan.appTarget > 0 ? '' : 'not set', NAVY);
      tile(rightX, blockTop + tileH + colGap, 'Predicted hires', plan.predictedHires.toFixed(1),
        plan.predictedHires > 0
          ? 'likely ' + plan.predictedHiresLow.toFixed(1) + '\u2013' + plan.predictedHiresHigh.toFixed(1)
          : 'from RAC hire rates', BLUE);
      const gap = plan.budgetForTarget - plan.budget;
      tile(rightX + tileW + colGap, blockTop + tileH + colGap,
        plan.budgetPinned ? 'Budget your caps require' : 'Budget to hit target',
        plan.budgetForTarget > 0 ? fmtGBP(plan.budgetForTarget)
          : plan.targetUnreachable ? 'Capped' : '-',
        plan.budgetPinned ? 'set by the location minimums' :
        plan.targetUnreachable ? 'the caps stop this being reachable' :
        plan.budgetForTarget <= 0 ? '' :
          gap > 50 ? fmtGBP(gap) + ' more than now' :
          gap < -50 ? fmtGBP(-gap) + ' less than now' : 'matches your budget',
        GREEN);

      y = blockTop + blockH + 6;

      // === Per-location table with platform splits ===
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
      pdf.text('Where the budget goes: by location and platform', margin, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
      setColor(MID);
      pdf.text('Each location\u2019s budget goes to the platforms where hires cost the least, with a soft cap at the highest amount historically spent.',
        margin, y + 4);
      y += 7;

      // Eleven columns across 269mm. Everything shifted left to make room for
      // predicted hires on the end.
      // Ten columns. App target has gone: it split RAC's total by open roles,
      // which is not how this plan allocates, so it marked a capped location
      // down for being capped and a cheap one up for being funded. Since the
      // plan is solved on hires, a per-location application target measured
      // against demand says nothing useful.
      const cx = {
        loc:   margin + 2,
        roles: margin + 46,
        indeed: margin + 72,
        meta:   margin + 98,
        google: margin + 124,
        appcast: margin + 150,
        total: margin + 178,
        pred:  margin + 206,
        range: margin + 227,
        hires: margin + 250,
      };
      // Header. The two predicted columns carry a second line so they can be
      // named in full, the same way they are on By channel and By region.
      const LHEAD = 9.5;
      setFill(NAVY); pdf.rect(margin, y, pageW - margin * 2, LHEAD, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
      pdf.text('Location', cx.loc, y + 6.2);
      pdf.text('Open roles', cx.roles, y + 6.2);
      pdf.text('Indeed', cx.indeed, y + 6.2);
      pdf.text('Meta', cx.meta, y + 6.2);
      pdf.text('Google', cx.google, y + 6.2);
      pdf.text('Appcast', cx.appcast, y + 6.2);
      pdf.text('Budget', cx.total, y + 6.2);
      pdf.text('Predicted', cx.pred, y + 3.9);
      pdf.text('apps', cx.pred, y + 7.7);
      pdf.text('Likely range', cx.range, y + 6.2);
      pdf.text('Predicted', cx.hires, y + 3.9);
      pdf.text('hires', cx.hires, y + 7.7);
      y += LHEAD;

      pdf.setFont('helvetica', 'normal'); setColor(INK);
      const rows = plan.locations.slice().sort((a, b) => (b.vacancies - a.vacancies) || (b.predApps - a.predApps));
      const ROWH = 6;
      rows.forEach((r, i) => {
        if (i % 2 === 1) {
          setFill(LIGHT); pdf.rect(margin, y, pageW - margin * 2, ROWH, 'F');
        }
        pdf.setFontSize(8.5); setColor(INK);
        pdf.text(r.region, cx.loc, y + 4.1);
        pdf.text(String(r.vacancies), cx.roles, y + 4.1);
        pdf.text(fmtGBP(r.platSpend.indeed),  cx.indeed,  y + 4.1);
        pdf.text(fmtGBP(r.platSpend.meta),    cx.meta,    y + 4.1);
        pdf.text(fmtGBP(r.platSpend.google),  cx.google,  y + 4.1);
        pdf.text(fmtGBP(r.platSpend.appcast), cx.appcast, y + 4.1);
        pdf.setFont('helvetica', 'bold');
        pdf.text(fmtGBP(r.spend), cx.total, y + 4.1);
        pdf.setFont('helvetica', 'normal');
        pdf.text(fmtInt(r.predApps),     cx.pred, y + 4.1);
        pdf.text(fmtInt(r.predLow) + '\u2013' + fmtInt(r.predHigh), cx.range, y + 4.1);
        // A location RAC has no hire data for would otherwise read 0.0, which
        // looks like a prediction of no hires rather than no basis to predict.
        pdf.text(r.hireCvr > 0 ? r.predHires.toFixed(1) : 'no data', cx.hires, y + 4.1);
        y += ROWH;
      });
      // Total row
      setFill(NAVY); pdf.rect(margin, y, pageW - margin * 2, 7, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', cx.loc, y + 4.7);
      pdf.text(String(plan.totalVac), cx.roles, y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.indeed),  cx.indeed,  y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.meta),    cx.meta,    y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.google),  cx.google,  y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.appcast), cx.appcast, y + 4.7);
      pdf.text(fmtGBP(rows.reduce((s, r) => s + r.spend, 0)), cx.total, y + 4.7);
      pdf.text(fmtInt(plan.predictedApps), cx.pred, y + 4.7);
      pdf.text(fmtInt(plan.predLow) + '\u2013' + fmtInt(plan.predHigh), cx.range, y + 4.7);
      pdf.text(plan.predictedHires.toFixed(1), cx.hires, y + 4.7);
      y += 7;

      // Helpful note under the table. If it won't fit above the footer,
      // shrink it; if even that doesn't fit, drop it (the table itself is the
      // important content; the note is supporting prose).
      pdf.setFont('helvetica', 'italic'); pdf.setFontSize(7.8);
      setColor(MID);
      const note = 'Predicted applications = location budget \u00F7 the blended cost-per-application from '
        + 'that location\u2019s history. Predicted hires applies that location\u2019s own hire rate. '
        + 'The likely range reflects how that cost has moved month to month.';
      const noteLines = pdf.splitTextToSize(note, pageW - margin * 2);
      const noteH = noteLines.length * 3.2 + 4;
      if (y + noteH <= pageH - 12) {
        pdf.text(noteLines, margin, y + 4);
      }
      // If the note doesn't fit, it's dropped silently - the table is what
      // matters and the glossary on the final page explains the same logic.

      footer(COMMENTARY_PAGES + roleIdx + 1, TOTAL_PAGES);
    });

    // ---- commentary, one page per role that has any -----------------------
    // ---- commentary, the opening page --------------------------------------
    // Cards on a grid rather than a list, and the type is sized down until it
    // fits, because this has to be one page whatever gets written on it.
    function commentaryPage(sec, pageNum) {
      const { role, kind, chunks } = sec;
      if (!chunks.length) return 0;
      const roleSub = role === 'SMR' ? 'SMR: Mobile Vehicle Tech'
                                     : 'Patrol: Roadside Technician';
      let numberedFrom = 0;

      chunks.forEach((pts, chunkIdx) => {
        if (pageStarted) pdf.addPage();
        pageStarted = true;
        const first = chunkIdx === 0;
        header(first ? kind.title : kind.title + ' (continued)', roleSub);
        const plan = plans[role];
        const top = 30;

        // The figure strip belongs with the opening page of the plan's own
        // notes. It is left off the legacy section, because those four figures
        // describe this plan and putting them above notes about a different
        // one would say something untrue.
        let stripH = 0;
        if (first && kind.key === 'plan') {
          stripH = 24;
          const gap = 5;
          const tiles = [
            ['Monthly budget', fmtGBP(plan.budget)],
            ['Predicted hires', plan.predictedHires.toFixed(1) + '  (' +
              plan.predictedHiresLow.toFixed(1) + '\u2013' + plan.predictedHiresHigh.toFixed(1) + ')'],
            ['Cost per application', plan.predictedApps > 0 ? fmtGBP(plan.deployable / plan.predictedApps) : '-'],
            ['Cost per hire', plan.predictedHires > 0 ? fmtGBP(plan.deployable / plan.predictedHires) : '-'],
          ];
          const tw = (pageW - margin * 2 - gap * (tiles.length - 1)) / tiles.length;
          tiles.forEach(([k, v], i) => {
            const x = margin + i * (tw + gap);
            setFill(LIGHT); pdf.rect(x, top, tw, stripH, 'F');
            setFill(i === 0 ? ORANGE : (i === 1 ? BLUE : NAVY)); pdf.rect(x, top, 1.6, stripH, 'F');
            setColor(MID); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(6.4);
            pdf.text(String(k).toUpperCase(), x + 5, top + 8);
            setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
            pdf.text(String(v), x + 5, top + 17.5);
          });
        }

        // One column. Two columns forces the type down to fit and the point of
        // the page is that it reads easily, not that it looks designed.
        const gridTop = top + stripH + (stripH > 0 ? 12 : 2);
        const gridBottom = pageH - 18;
        const avail = gridBottom - gridTop;
        const numW = 12;                       // room for the number, left of the rule
        const textX = margin + numW + 6;
        const textW = pageW - margin - textX - 4;

        // Largest readable type where this page's points still fit.
        let size = 14, lead = 0, rowH = [], padY = 0;
        for (; size >= 8; size -= 0.25) {
          // The page is in millimetres and the size is in points, so a line of
          // 13pt text is about 5.5mm, not 16mm.
          lead = size * 0.42;
          padY = Math.max(4, size * 0.3);
          rowH = pts.map(pt => {
            pdf.setFontSize(size);
            return pdf.splitTextToSize(pt, textW).length * lead + padY * 2;
          });
          if (rowH.reduce((a, h) => a + h, 0) + (pts.length - 1) * 4 <= avail) break;
        }
        if (rowH.reduce((a, h) => a + h, 0) + (pts.length - 1) * 4 > avail) {
          // Even at the floor it does not fit, so squeeze the padding instead.
          // With six points to a page this should now be unreachable unless a
          // single point runs to a paragraph on its own.
          padY = 3; lead = size * 0.38;
          rowH = pts.map(pt => {
            pdf.setFontSize(size);
            return pdf.splitTextToSize(pt, textW).length * lead + padY * 2;
          });
        }
        // Share out only what is genuinely spare, so the list cannot run off
        // the bottom of the page.
        // Spread the spare height across the rows, but only so far. A short
        // list should breathe, not become two enormous boxes.
        const rowGap = 4;
        const used = rowH.reduce((a, h) => a + h, 0) + (pts.length - 1) * rowGap;
        const extra = Math.min(Math.max(0, avail - used) / pts.length, 10);
        const blockTotal = used + extra * pts.length;

        // A short list sits just below the figures rather than adrift in the
        // middle of the page.
        let y = gridTop + Math.min(Math.max(0, (avail - blockTotal) / 2), 8);
        pts.forEach((pt, i) => {
          // Numbering runs on across the pages, so a point is point 7 wherever
          // it lands.
          const n = numberedFrom + i;
          const h = rowH[i] + extra;
          setFill(LIGHT); pdf.rect(margin, y, pageW - margin * 2, h, 'F');
          setFill(n % 2 === 0 ? ORANGE : BLUE); pdf.rect(margin, y, 2.2, h, 'F');
          pdf.setFontSize(size);
          const lines = pdf.splitTextToSize(pt, textW);
          // First line of text and the number share a baseline, so they line up
          // however many lines follow.
          // The text block sits in the middle of the row. The first baseline is
          // the top of that block plus one ascender, in millimetres like
          // everything else on the page.
          const blockH = lines.length * lead;
          const firstBaseline = y + (h - blockH) / 2 + lead * 0.76;
          setColor(n % 2 === 0 ? ORANGE : BLUE);
          pdf.setFont('helvetica', 'bold'); pdf.setFontSize(size);
          pdf.text(String(n + 1) + '.', margin + numW, firstBaseline, { align: 'right' });
          setColor(INK); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(size);
          lines.forEach((l, k) => pdf.text(l, textX, firstBaseline + k * lead));
          y += h + rowGap;
        });

        footer(pageNum + chunkIdx, TOTAL_PAGES);
        numberedFrom += pts.length;
      });

      return chunks.length;
    }

    // ---- By channel page -------------------------------------------------
    // Per-role channel summary the client can copy straight into their tracker.
    // Each role gets a small table: Platform, Spend, Share, Predicted apps, CPA, Range.
    pdf.addPage();
    header('By channel', null);
    let cy = 30;
    ROLES.forEach((role, idx) => {
      const plan = plans[role];
      // Role heading
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
      pdf.text(role + ': ' + ROLE_FULL[role], margin, cy);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); setColor(MID);
      pdf.text('Spend by platform, with predicted applications and cost per application at each platform\u2019s historic rate for this role.',
        margin, cy + 4.5);
      cy += 9;

      // Column positions (landscape page, eight columns including hire metrics)
      // Predicted apps sits before Apply CVR, which is also the order the
      // region and channel detail pages use.
      const cc = {
        plat:   margin + 2,
        spend:  margin + 42,
        apps:   margin + 78,
        share:  margin + 104,
        cpa:    margin + 134,
        hcvr:   margin + 170,
        hires:  margin + 200,
        cph:    margin + 226,
      };
      // Header row. Apps and hires carry a second line so they can be named in
      // full without running into the column beside them.
      const CHHEAD = 9.5;
      setFill(NAVY); pdf.rect(margin, cy, pageW - margin * 2, CHHEAD, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
      pdf.text('Platform',        cc.plat,  cy + 6.2);
      pdf.text('Spend',           cc.spend, cy + 6.2);
      pdf.text('Predicted',       cc.apps,  cy + 3.9);
      pdf.text('apps',            cc.apps,  cy + 7.7);
      pdf.text('Apply CVR',       cc.share, cy + 6.2);
      pdf.text('Cost / app',      cc.cpa,   cy + 6.2);
      pdf.text('Hire CVR',        cc.hcvr,  cy + 6.2);
      pdf.text('Predicted',       cc.hires, cy + 3.9);
      pdf.text('hires',           cc.hires, cy + 7.7);
      pdf.text('Cost / hire',     cc.cph,   cy + 6.2);
      cy += CHHEAD;

      // Rows
      pdf.setFont('helvetica', 'normal'); setColor(INK);
      let totalApps = 0, totalHires = 0;
      const CHROW = 10; // taller rows to fit the range sub-line
      (plan.channelSummary || []).forEach((ch, i) => {
        if (i % 2 === 1) {
          setFill(LIGHT); pdf.rect(margin, cy, pageW - margin * 2, CHROW, 'F');
        }
        setColor(INK); pdf.setFontSize(8.5);
        pdf.text(PLATFORM_LABELS[ch.platform], cc.plat, cy + 4.4);
        pdf.setFont('helvetica', 'bold');
        pdf.text(fmtGBP(ch.spend), cc.spend, cy + 4.4);
        pdf.setFont('helvetica', 'normal');
        pdf.text(ch.cvr > 0 ? (ch.cvr * 100).toFixed(1) + '%' : 'n/a', cc.share, cy + 4.4);
        pdf.text(fmtInt(ch.predApps), cc.apps, cy + 4.4);
        pdf.text(fmtGBP(ch.cpa), cc.cpa, cy + 4.4);
        pdf.text(ch.hireCvr > 0 ? (ch.hireCvr * 100).toFixed(2) + '%' : 'n/a', cc.hcvr, cy + 4.4);
        pdf.text(ch.predHires >= 0 ? ch.predHires.toFixed(1) : '0', cc.hires, cy + 4.4);
        pdf.text(ch.cph ? fmtGBP(ch.cph) : 'n/a', cc.cph, cy + 4.4);
        // Range sub-lines (apply CVR, apps, cost per app) in muted grey
        pdf.setFontSize(6.6); setColor(MUTED);
        if (ch.cvr > 0) pdf.text((ch.cvrLow * 100).toFixed(1) + '\u2013' + (ch.cvrHigh * 100).toFixed(1) + '%', cc.share, cy + 8.4);
        if (ch.predApps > 0) pdf.text(fmtInt(ch.predLow) + '\u2013' + fmtInt(ch.predHigh), cc.apps, cy + 8.4);
        if (ch.cpa > 0) pdf.text(fmtGBP(ch.cpaLow) + '\u2013' + fmtGBP(ch.cpaHigh), cc.cpa, cy + 8.4);
        if (ch.predHires > 0 && ch.predApps > 0) {
          const band = ch.predLow / ch.predApps;
          pdf.text((ch.predHires * band).toFixed(1) + '\u2013' + (ch.predHires * (2 - band)).toFixed(1),
            cc.hires, cy + 8.4);
        }
        setColor(INK); pdf.setFontSize(8.5);
        totalApps += ch.predApps; totalHires += ch.predHires;
        cy += CHROW;
      });
      // Total row
      setFill(NAVY); pdf.rect(margin, cy, pageW - margin * 2, 11, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', cc.plat, cy + 4.7);
      pdf.text(fmtGBP(plan.deployable), cc.spend, cy + 4.7);
      // Spend-weighted blended apply CVR, measured at the cell so this agrees
      // with the same figure on By region.
      const blendedCvr = planBlendedCVR(plan, role);
      pdf.text(blendedCvr > 0 ? (blendedCvr * 100).toFixed(1) + '%' : 'n/a', cc.share, cy + 4.7);
      pdf.text(fmtInt(totalApps), cc.apps, cy + 4.7);
      const blendedCpa = totalApps > 0 ? plan.deployable / totalApps : 0;
      pdf.text(fmtGBP(blendedCpa), cc.cpa, cy + 4.7);
      // Blended hire CVR and CPH from totals
      pdf.text(totalApps > 0 ? (totalHires / totalApps * 100).toFixed(2) + '%' : 'n/a', cc.hcvr, cy + 4.7);
      pdf.text(totalHires.toFixed(1), cc.hires, cy + 4.7);
      if (totalApps > 0 && totalHires > 0) {
        const b = plan.aggBandPct / 100;
        pdf.setFontSize(6.6);
        pdf.text((totalHires * (1 - b)).toFixed(1) + '\u2013' + (totalHires * (1 + b)).toFixed(1), cc.hires, cy + 8.4);
        pdf.setFontSize(8.5);
      }
      pdf.text(totalHires > 0 ? fmtGBP(plan.deployable / totalHires) : 'n/a', cc.cph, cy + 4.7);
      // Total range sub-lines
      const abp = plan.aggBandPct || 35;
      pdf.setFontSize(6.6); pdf.setTextColor(200, 208, 220);
      if (blendedCvr > 0) pdf.text((blendedCvr * (1 - abp / 100) * 100).toFixed(1) + '\u2013' + (blendedCvr * (1 + abp / 100) * 100).toFixed(1) + '%', cc.share, cy + 8.4);
      if (totalApps > 0) pdf.text(fmtInt(totalApps * (1 - abp / 100)) + '\u2013' + fmtInt(totalApps * (1 + abp / 100)), cc.apps, cy + 8.4);
      if (blendedCpa > 0) pdf.text(fmtGBP(blendedCpa * (1 - abp / 100)) + '\u2013' + fmtGBP(blendedCpa * (1 + abp / 100)), cc.cpa, cy + 8.4);
      cy += 14;
    });

    footer(roles.length + COMMENTARY_PAGES + 1, TOTAL_PAGES);

    // ---- By region pages -------------------------------------------------
    // The same columns as By channel, a row per live location instead of a row
    // per platform. Both are drawn from summaries built in the plan, so neither
    // table can drift away from the location page.
    ROLES.forEach((role, idx) => {
      pdf.addPage();
      header('By region', null);
      const plan = plans[role];
      let ry = 30;

      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
      pdf.text(role + ': ' + ROLE_FULL[role], margin, ry);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); setColor(MID);
      pdf.text('Spend by location, with predicted applications and cost per application at each location\u2019s historic rate for this role.',
        margin, ry + 4.5);
      ry += 9;

      // Same column positions as By channel, so the two tables read as a pair.
      const rc = {
        loc:    margin + 2,
        spend:  margin + 42,
        apps:   margin + 78,
        share:  margin + 104,
        cpa:    margin + 134,
        hcvr:   margin + 170,
        hires:  margin + 200,
        cph:    margin + 226,
      };
      const RHEAD = 9.5;
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, RHEAD, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
      pdf.text('Location',       rc.loc,   ry + 6.2);
      pdf.text('Spend',          rc.spend, ry + 6.2);
      pdf.text('Predicted',      rc.apps,  ry + 3.9);
      pdf.text('apps',           rc.apps,  ry + 7.7);
      pdf.text('Apply CVR',      rc.share, ry + 6.2);
      pdf.text('Cost / app',     rc.cpa,   ry + 6.2);
      pdf.text('Hire CVR',       rc.hcvr,  ry + 6.2);
      pdf.text('Predicted',      rc.hires, ry + 3.9);
      pdf.text('hires',          rc.hires, ry + 7.7);
      pdf.text('Cost / hire',    rc.cph,   ry + 6.2);
      ry += RHEAD;

      // Same order as the location table on the plan page, so a reader moving
      // between the two is not made to hunt.
      const regionRows = (plan.regionSummary || []).slice()
        .sort((a, b) => (b.vacancies - a.vacancies) || (b.predApps - a.predApps));

      pdf.setFont('helvetica', 'normal'); setColor(INK);
      const RROW = 10;
      let rTotApps = 0, rTotHires = 0;
      regionRows.forEach((rg, i) => {
        if (i % 2 === 1) { setFill(LIGHT); pdf.rect(margin, ry, pageW - margin * 2, RROW, 'F'); }
        setColor(INK); pdf.setFontSize(8.5);
        pdf.text(rg.region, rc.loc, ry + 4.4);
        pdf.setFont('helvetica', 'bold');
        pdf.text(fmtGBP(rg.spend), rc.spend, ry + 4.4);
        pdf.setFont('helvetica', 'normal');
        pdf.text(rg.cvr > 0 ? (rg.cvr * 100).toFixed(1) + '%' : 'n/a', rc.share, ry + 4.4);
        pdf.text(fmtInt(rg.predApps), rc.apps, ry + 4.4);
        pdf.text(rg.cpa > 0 ? fmtGBP(rg.cpa) : 'n/a', rc.cpa, ry + 4.4);
        pdf.text(rg.hireCvr > 0 ? (rg.hireCvr * 100).toFixed(2) + '%' : 'n/a', rc.hcvr, ry + 4.4);
        pdf.text(rg.predHires >= 0 ? rg.predHires.toFixed(1) : '0', rc.hires, ry + 4.4);
        pdf.text(rg.cph ? fmtGBP(rg.cph) : 'n/a', rc.cph, ry + 4.4);
        pdf.setFontSize(6.6); setColor(MUTED);
        if (rg.cvr > 0) pdf.text((rg.cvrLow * 100).toFixed(1) + '\u2013' + (rg.cvrHigh * 100).toFixed(1) + '%', rc.share, ry + 8.4);
        if (rg.predApps > 0) pdf.text(fmtInt(rg.predLow) + '\u2013' + fmtInt(rg.predHigh), rc.apps, ry + 8.4);
        if (rg.cpa > 0) pdf.text(fmtGBP(rg.cpaLow) + '\u2013' + fmtGBP(rg.cpaHigh), rc.cpa, ry + 8.4);
        if (rg.predHires > 0) pdf.text(rg.predHiresLow.toFixed(1) + '\u2013' + rg.predHiresHigh.toFixed(1), rc.hires, ry + 8.4);
        setColor(INK); pdf.setFontSize(8.5);
        rTotApps += rg.predApps; rTotHires += rg.predHires;
        ry += RROW;
      });

      // Total row. The same figures as the channel total, arrived at the other
      // way round, which is the point of showing both.
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, 11, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', rc.loc, ry + 4.7);
      pdf.text(fmtGBP(plan.deployable), rc.spend, ry + 4.7);
      const rBlendedCvr = planBlendedCVR(plan, role);
      pdf.text(rBlendedCvr > 0 ? (rBlendedCvr * 100).toFixed(1) + '%' : 'n/a', rc.share, ry + 4.7);
      pdf.text(fmtInt(rTotApps), rc.apps, ry + 4.7);
      const rBlendedCpa = rTotApps > 0 ? plan.deployable / rTotApps : 0;
      pdf.text(fmtGBP(rBlendedCpa), rc.cpa, ry + 4.7);
      pdf.text(rTotApps > 0 ? (rTotHires / rTotApps * 100).toFixed(2) + '%' : 'n/a', rc.hcvr, ry + 4.7);
      pdf.text(rTotHires.toFixed(1), rc.hires, ry + 4.7);
      pdf.text(rTotHires > 0 ? fmtGBP(plan.deployable / rTotHires) : 'n/a', rc.cph, ry + 4.7);
      const rabp = plan.aggBandPct || 35;
      pdf.setFontSize(6.6); pdf.setTextColor(200, 208, 220);
      if (rBlendedCvr > 0) pdf.text((rBlendedCvr * (1 - rabp / 100) * 100).toFixed(1) + '\u2013' + (rBlendedCvr * (1 + rabp / 100) * 100).toFixed(1) + '%', rc.share, ry + 8.4);
      if (rTotApps > 0) pdf.text(fmtInt(rTotApps * (1 - rabp / 100)) + '\u2013' + fmtInt(rTotApps * (1 + rabp / 100)), rc.apps, ry + 8.4);
      if (rBlendedCpa > 0) pdf.text(fmtGBP(rBlendedCpa * (1 - rabp / 100)) + '\u2013' + fmtGBP(rBlendedCpa * (1 + rabp / 100)), rc.cpa, ry + 8.4);
      if (rTotHires > 0) pdf.text((rTotHires * (1 - rabp / 100)).toFixed(1) + '\u2013' + (rTotHires * (1 + rabp / 100)).toFixed(1), rc.hires, ry + 8.4);

      footer(roles.length + COMMENTARY_PAGES + 2 + idx, TOTAL_PAGES);
    });

    // ---- Region x channel pages -----------------------------------------
    // For each role and platform, a table of all 12 regions with spend,
    // predicted apps, apply CVR, CPA, hire CVR, hires and cost per hire, with
    // the likely ranges under the figures they belong to. Regions with no live
    // vacancy show zeros; the three
    // regions RAC has no hire data for show "no data" in the hire columns.
    // The likely-apps range used to sit in a column of its own at the far
    // right, a long way from the number it belonged to. It now sits under the
    // predicted apps figure, the same way the apply CVR and cost per app
    // ranges already did. Predicted hires carries its range the same way. That
    // frees a column, so the rest are spread wider.
    const rcCols = {
      region: margin + 2,
      spend:  margin + 48,
      apps:   margin + 84,
      cvr:    margin + 114,
      cpa:    margin + 144,
      hcvr:   margin + 176,
      hires:  margin + 208,
      cph:    margin + 236,
    };
    function drawRegionChannelTable(role, plat, startY) {
      let ry = startY;
      const plan = plans[role];
      const rows = (plan.regionChannel && plan.regionChannel[plat]) || [];
      const RH = 11; // row height (taller to fit the range sub-line)
      // Sub-heading
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12);
      pdf.text(role + ' \u00B7 ' + PLATFORM_LABELS[plat], margin, ry);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); setColor(MID);
      pdf.text('Every location for this role and platform. Locations with no open roles show zero spend and keep their historic rates.',
        margin, ry + 5);
      ry += 10;
      // Header
      // The three predicted columns are stacked over two lines, because
      // "Predicted hires" on one line runs into the column beside it.
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, 10, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Region',      rcCols.region, ry + 6.8);
      pdf.text('Spend',       rcCols.spend,  ry + 6.8);
      pdf.text('Apply CVR',   rcCols.cvr,    ry + 6.8);
      pdf.text('Cost / app',  rcCols.cpa,    ry + 6.8);
      pdf.text('Hire CVR',    rcCols.hcvr,   ry + 6.8);
      pdf.text('Cost / hire', rcCols.cph,    ry + 6.8);
      pdf.setFontSize(7.4);
      [[rcCols.apps, 'apps'], [rcCols.hires, 'hires']].forEach(([x, w]) => {
        pdf.text('Predicted', x, ry + 3.6);
        pdf.text(w, x, ry + 7.6);
      });
      ry += 10;
      // Rows
      pdf.setFont('helvetica', 'normal');
      let tSpend = 0, tApps = 0, tHires = 0;
      rows.forEach((r, i) => {
        if (i % 2 === 1) { setFill(LIGHT); pdf.rect(margin, ry, pageW - margin * 2, RH, 'F'); }
        // Dim regions with no live vacancy so the eye skips to the funded ones
        setColor(r.live ? INK : MID);
        pdf.setFontSize(8.5);
        pdf.text(r.region, rcCols.region, ry + 5.6);
        pdf.text(fmtGBP(r.spend), rcCols.spend, ry + 5.6);
        pdf.text(fmtInt(r.predApps), rcCols.apps, ry + 5.6);
        pdf.text(r.cvr > 0 ? (r.cvr * 100).toFixed(1) + '%' : 'n/a', rcCols.cvr, ry + 5.6);
        pdf.text(r.cpa > 0 ? fmtGBP(r.cpa) : '\u2013', rcCols.cpa, ry + 5.6);
        // Hire columns: "no data" where RAC has no hire rate for the region
        if (r.hireCvr == null) {
          pdf.text('no data', rcCols.hcvr, ry + 5.6);
          pdf.text('\u2013', rcCols.hires, ry + 5.6);
          pdf.text('\u2013', rcCols.cph, ry + 5.6);
        } else {
          pdf.text((r.hireCvr * 100).toFixed(2) + '%', rcCols.hcvr, ry + 5.6);
          pdf.text(r.predHires.toFixed(1), rcCols.hires, ry + 5.6);
          pdf.text(r.cph ? fmtGBP(r.cph) : '\u2013', rcCols.cph, ry + 5.6);
        }
        // Range sub-lines on live rows: predicted apps, apply CVR, cost per
        // app and predicted hires, each under its own figure.
        if (r.spend > 0) {
          pdf.setFontSize(6.4); setColor(MUTED);
          if (r.predApps > 0) pdf.text(fmtInt(r.predLow) + '\u2013' + fmtInt(r.predHigh), rcCols.apps, ry + 9.2);
          if (r.cvr > 0) pdf.text((r.cvrLow * 100).toFixed(1) + '\u2013' + (r.cvrHigh * 100).toFixed(1) + '%', rcCols.cvr, ry + 9.2);
          if (r.cpa > 0) pdf.text(fmtGBP(r.cpaLow) + '\u2013' + fmtGBP(r.cpaHigh), rcCols.cpa, ry + 9.2);
          if (r.hireCvr != null && r.predHires > 0) {
            pdf.text(r.predHiresLow.toFixed(1) + '\u2013' + r.predHiresHigh.toFixed(1), rcCols.hires, ry + 9.2);
          }
          pdf.setFontSize(8.5);
        }
        tSpend += r.spend; tApps += r.predApps; tHires += r.predHires;
        ry += RH;
      });
      // Total. Taller than it was, so the apps and hires ranges can sit under
      // their figures here too rather than only on the rows.
      const tBand = (rows[0] && rows[0].bandPct) || 0;
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, 11, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', rcCols.region, ry + 5.4);
      pdf.text(fmtGBP(tSpend), rcCols.spend, ry + 5.4);
      pdf.text(fmtInt(tApps), rcCols.apps, ry + 5.4);
      pdf.text(tApps > 0 ? fmtGBP(tSpend / tApps) : '\u2013', rcCols.cpa, ry + 5.4);
      pdf.text(tApps > 0 ? (tHires / tApps * 100).toFixed(2) + '%' : '\u2013', rcCols.hcvr, ry + 5.4);
      pdf.text(tHires.toFixed(1), rcCols.hires, ry + 5.4);
      pdf.text(tHires > 0 ? fmtGBP(tSpend / tHires) : '\u2013', rcCols.cph, ry + 5.4);
      if (tBand > 0) {
        pdf.setFontSize(6.4); pdf.setTextColor(200, 208, 220);
        if (tApps > 0) pdf.text(fmtInt(tApps * (1 - tBand / 100)) + '\u2013' + fmtInt(tApps * (1 + tBand / 100)), rcCols.apps, ry + 9.0);
        if (tHires > 0) pdf.text((tHires * (1 - tBand / 100)).toFixed(1) + '\u2013' + (tHires * (1 + tBand / 100)).toFixed(1), rcCols.hires, ry + 9.0);
      }
      ry += 11;
      return ry;
    }

    // Build the list of (role, platform) tables, one per page (each table is
    // 12 regions + header + total, which fills the vertical space cleanly).
    const rcTables = [];
    ROLES.forEach(role => {
      PLATFORMS.forEach(plat => { rcTables.push({ role, plat }); });
    });
    let rcPageNum = roles.length + COMMENTARY_PAGES + SUMMARY_PAGES + 1;
    rcTables.forEach(tbl => {
      pdf.addPage();
      header('By region and channel', null);
      drawRegionChannelTable(tbl.role, tbl.plat, 30);
      footer(rcPageNum, TOTAL_PAGES);
      rcPageNum++;
    });

    // ---- Glossary page ---------------------------------------------------
    pdf.addPage();
    header('Glossary', null);

    const gColA = margin, gColB = margin + gColW + 6;
    let gy = 30, gCol = 0, gPageNum = roles.length + COMMENTARY_PAGES + SUMMARY_PAGES + REGION_CHANNEL_PAGES + 1;
    terms.forEach(t => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      const split = pdf.splitTextToSize(t[1], gColW - 4);
      const blockH = 5 + split.length * 3.6 + 4;
      // wrap to next column / page
      if (gy + blockH > pageH - 14) {
        if (gCol === 0) { gCol = 1; gy = 30; }
        else { footer(gPageNum, TOTAL_PAGES); gPageNum++; pdf.addPage(); header('Glossary (continued)', null); gCol = 0; gy = 30; }
      }
      const gx = gCol === 0 ? gColA : gColB;
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5);
      pdf.text(t[0], gx, gy);
      setColor(INK); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      pdf.text(split, gx, gy + 4.5);
      gy += blockH + 1;
    });
    footer(gPageNum, TOTAL_PAGES);

    const roleTag = roles.length === 1 ? '_' + roles[0] : '';
    const notesTag = withNotes ? '' : '_No_Notes';
    pdf.save('RAC_' + monthLabel.replace(' ', '_') + roleTag + '_Plan' + notesTag + '.pdf');
  } catch (e) {
    alert('PDF export failed: ' + e.message);
  }
}// ====================================================================

// CHANGELOG - a plain record of what changed in the tool itself, not in
// the plans or the data. Newest first. Dated, no version numbers.
// ====================================================================

  { date: '19 Aug', items: [
    'The Data tab now says how far the numbers actually reach, and warns when a month was folded in before it finished. It used to read the end of the last month it had seen, so folding a part month left it claiming the whole month was in. July was folded on 24 July and has been reading as complete ever since, which means every plan built since then used a July about a quarter light: London Google shows 1,204 pounds against 1,719 for the full month, and Scotland Google shows 13 pounds against 499. The label now comes from the last date in the file that was uploaded, and if that is not the last day of its month it says so in amber and tells you how many days are in.',
    
    'Fixed the totals on the workings spreadsheet coming out blank, which also took the Summary tab down with them. A location funded at nothing has no platform rows under it, but it was still getting a total row, and that row summed a range starting one row below itself: SUM(D5:D4). Excel reads that as circular, returns zero, and since the plan total adds every location total together, one circular reference emptied the whole row. The Summary reads its figures from that row, so it emptied too. Locations with no funded platforms no longer get a total row. This showed up on a September SMR plan where London was capped low enough to receive nothing.',
    
    'Fixed the Summary tab of the workings spreadsheet. The four range formulas were pointing one row short, at a blank spacer rather than at Range used, so predicted applications low and high both came out equal to the central figure and predicted hires did the same. Every workings export taken so far shows no range on that tab.',
    'Column I of the Workings sheet, the cost per application the plan uses, was a fixed number pasted in with no working. It is now a formula: the measured figure in column H pulled toward the platform average, weighted by how many applications sit behind the cell. The header carries the formula and the sheet description explains it, so anyone can see why a thin cell moves a long way and one with hundreds of applications barely moves.',
    
    'The workings spreadsheet now shows the upweighting, and works at all on an upweighted plan. The Raw monthly data sheet had a column saying Yes or No for whether a month was in the period used, worked out by comparing the month against a start and end date. An upweighted window has no start and end date, only a multiplier, so every month came out as No and the Workings sheet was built with no formulas in it. That column is now Weight in this plan and shows what each month actually counts for: 0 if it is left out, 1 for a normal month, 3 on a last three months x3 setting. The formulas on the Workings sheet carry the same weights, so a month at 3x appears in them as three times its value rather than once, and the workbook adds up the same way the plan does.',
    
    'Took the App target column off the location table on the plan page. It split RAC\u2019s total application target across locations by open roles, which is not how the budget is allocated, so it marked a capped location down for being capped and a well funded cheap one up for being funded. On a recent Patrol plan it showed West Midlands wanting 73 applications against 217 predicted, and London 183 against 137. Now the plan is solved on hires, a per-location application target measured against demand says nothing useful. The remaining columns are spread wider and the footnote no longer refers to it.',
    
    'Budget to hit target now solves on hires rather than applications. The application target is worked back from the hire target using a rate that moves with where the budget goes, so solving on applications meant chasing a figure that shifted every time the budget did, which is why typing in the number it asked for made it ask for a different one. Hires are what RAC sets, so hires are what it answers. Where the caps mean the hire target cannot be reached at any budget, the box says Capped rather than showing a figure that would not deliver it.',
    
    'The application target no longer moves with the budget. It is worked back from the hire target using the rate at which applications become hires, and that rate was being read off a plan built at whatever budget happened to be set. With caps in place, changing the budget changes which locations are at their cap, which changes the mix and moves the rate, so the target drifted by an application or two. That is what made Budget to hit target chase itself: the target it was solving for kept moving. The rate is now weighted by open roles, which do not change when the budget does, and uses the same per-location rates from RAC\u2019s file that the plan runs on. Application targets will shift slightly against previously saved plans as a result.',
    
    'Fixed Budget to hit target chasing itself when caps are set. Typing in the figure it asked for made it ask for a different one, and typing that in brought back the first. Two causes. Once every location is at its cap, extra budget has nowhere to go and predicted applications stop moving, so the search that solves for the target was working across a flat stretch and could settle anywhere inside it. And the top of that search was seeded from whatever budget was currently set, so it took a different path each time and the answer moved by the rounding step. The search no longer depends on the current budget and runs finer, so it returns the same figure whatever is in the box. Where the caps mean more budget could not be spent, the box now says so.',

    'Added a Predicted hires column to the location and platform table on the plan page, on the end after the likely range, with the total on the bottom row. The other columns shifted left to make room. A location RAC has no hire data for reads no data rather than 0.0, which looked like a prediction of no hires.',
    
    'Swapped the R square in the header and on the sign-in screen for the RAC logo, and renamed the tool from RAC Planning Tools to RAC Tool Suite.',
    'Brought the Method tab up to date. The spend ceiling was described as a hard limit that nothing could go above, which has not been true for a while: it is a soft cap, the plan will go past it when the target needs the money, and it reports how much sits above. Added how a location floor or ceiling works and that typing N holds a location at nothing. Added that cost per hire is now worked out from the cost per application and the hire rate rather than looked up. Explained what happens to a cost per application with thin data behind it and where to see it. Added the two commentary sections and the export without notes.',
    
    'Added a second export button, PDF, no notes. It produces exactly the same document with both commentary sections left out, for when the plan is going to someone who does not need the reasoning or when the notes are still being agreed. Page numbering and the total on every page adjust to the shorter document. The file is named with No Notes on the end so the two do not sit in a folder looking identical.',
    
    'Added a second commentary box on Setup, Commentary relating to legacy plan, alongside the existing one. It works exactly the same way, one point per line, saved and frozen with the plan. In the PDF it prints as its own section headed Notes on the legacy plan, ahead of the notes on this plan, and it breaks onto extra pages at six points each in its own right. Numbering restarts at 1 for the legacy section. The four figures across the top stay on the notes for this plan only, because they describe this plan and would say something untrue sitting above notes about a different one.',
    
    'A location can now be held at zero spend instead of the pound we have been putting in to keep it visible. Type N in its Max box on Setup. It stays in the plan and on every page of the PDF, funded at nothing, and it keeps its share of the application target so the unmet demand is still on the page. A cap of 0 still means no cap, as it always has, so nothing already saved changes.',
    
    'The address bar now follows where you are: #planner/benchmarks, #priorities, #pacing and so on. Refreshing puts you back on the tab you were on instead of Setup, the browser back button walks through the tabs rather than leaving the tool, and you can send someone a link to a particular view. The month is not in the address on purpose, because it lives in the shared workspace and a link that set it would move everyone else\u2019s month as well.',
    
    'Added a row of initials at the top of the page showing who else is signed in right now. It checks in every 25 seconds and drops anyone who has not been seen for 75. Your own initials are the orange one. Hovering gives the full address. Everyone writes their own row rather than a shared one, so this cannot clash the way the workspace does.',
    
    'Cost per hire is now worked out as cost per application divided by the hire rate, everywhere. It used to be read straight out of the data file, where it had come over from Scott\u2019s sheet alongside the hire rate. Only the rate travelled cleanly. The spend behind his cost per hire was not the spend our platforms are running, so the two never belonged in the same row: the SMR Indeed page showed North West at 54 pounds an application and a 1.46% hire rate, then claimed a 979 pound hire, where those two figures give 3,699. Every location outside London and the South East was understated, and understated most in the northern locations the model has been pushing budget toward. The corrected figures are higher: North West 979 becomes 3,866, Yorkshire 666 becomes 3,145, East Midlands 2,742 becomes 5,255, London 10,525 becomes 11,614. Hire rates are unchanged and still Scott\u2019s. No budget moves, because the allocation never used the stored figure.',
    
    'The Benchmarks tab now shows the cost per application the plan actually uses, rather than the raw historic rate. The two used to differ and there was no way to tell from the screen which one a plan was built on. Inside each platform breakdown the figure is now the same number that appears on the By region and channel pages of a PDF. The blended figures by location and by platform are built from those same cell rates, so they will still sit a little away from a plan\u2019s own, which is weighted by where next month\u2019s budget goes rather than by where spend has gone historically.',
    'The Benchmarks tab also takes its hire rates from Scott\u2019s file now, the same source the plan runs on. It was using the coarse three-band set built in April. The two disagreed, worst of all in London, where the band said 1.70% and Scott\u2019s file says nearer 1%, so the tab was quoting a cost per hire thousands of pounds below what the plan quoted for the same location.',
    'Took the coloured verdict banner off the top of the plan page. On track, close to target and falling short have gone. Every figure it carried is already in the tiles underneath it. The Application target tile now shows the target on its own, with nothing underneath it.',
    'On the By region and channel pages, the likely apps range no longer has a column of its own at the far right. It sits under the predicted apps figure, the way the apply CVR and cost per app ranges already did. Predicted hires now carries its range underneath in the same way, and the totals row shows both. Dropping a column let the rest spread wider.',
    'Swapped the Predicted apps and Apply CVR columns on By channel and By region, so predicted apps comes first. That is also the order the region and channel detail pages already used.',

    'While adding it I found the blended apply CVR on the By channel total was worked out by averaging platforms and then averaging those. Doing the same by location gave a different answer for the same money, 3.3% against 3.2% on a test plan, because a cell with no conversion rate was dropped from the inner average but its spend stayed in the outer weight. Both totals are now measured across every location and platform at once, so they agree.',
    'The notes page in the PDF now runs onto a second or third page instead of shrinking the type to fit. Six points is the most that will go on a page. Where a role has more than that, they are shared out evenly rather than filling the first page and leaving one point stranded on its own, and the numbering carries on across the pages. The four figures across the top stay on the opening page only.',
    'Moved the dividing line above Deployable budget down a couple of millimetres. It was sitting on top of the text.',

    'Reworded two lines on the plan page into plainer English. The budget row that used to read "Of which above proven spend" now reads "Of which more than has been spent before". The line above the location table now says the budget goes to the platforms where hires cost the least, with a soft cap at the highest amount historically spent.',
