    'The updated data covers both roles. Patrol has measured hire rates for the first time rather than SMR multiplied by 0.933.',
    'Commentary is now the opening page of the plan and reads as cards rather than a list, with the budget, predicted hires, cost per application and cost per hire across the top so the notes sit against the figures they are about. The data period is already in the header, so it does not take a tile.',
    'Commentary reads as one column of full-width rows rather than a two column grid. Two columns forced the type down to fit and the point of the page is that it reads easily. The numbers sit on the same baseline as the first line of their text, so they line up however many lines follow.',
    'Fixed the commentary text sitting low in its row rather than in the middle. The offset from the top of the block to the first line of type was being added in points on a page measured in millimetres, so it pushed the text down by about a centimetre. Line heights had the same fault, which is what made the page run off the bottom.',
    'A short list no longer stretches into a few enormous boxes. Rows take a limited share of the spare height and the list sits just under the figures. Checked at two, five, eight and ten points.',
    'Fixed the planner lagging while typing. Every keystroke anywhere on Setup rebuilt both roles from scratch, including the budget solver, which is 148 milliseconds of work per role. A built plan is now kept against the settings that produced it, so a change the figures do not read costs nothing. Repeat builds went from 148 milliseconds to 3.',
    'The commentary box keeps its text to itself while you type and only tells the plan when you click away. Typing went from 38 milliseconds a keystroke to under 2.',
    'The budget solver stops once it is inside the fifty pounds the answer is rounded to, rather than always running a fixed twenty six passes.',
    'Added commentary to the plan. There is a box on Setup, one point per line, and it comes out as its own page in the PDF headed Notes on this plan. It saves and freezes with the plan like everything else, so exporting an older version brings back the notes that went with it. Leave it empty and the page is left out.',
    'Points can be typed with numbers, dashes or bullets, or none at all. Whatever is typed, the page reads as a clean numbered list.',
    'Fixed the PDF disagreeing with the screen. It built its figures from its own list of settings and never passed the data period or the spend ceiling, so it silently used all time whatever was picked. On an SMR plan that read 2,077 applications and 38.2 hires against 1,667 and 30.1 on screen. Every place that builds a plan now goes through the one builder.',
    'Fixed the Benchmarks tables not changing when the period changed. The tables were still reading a from and to range, which only means anything on a custom range, so every other option left them on the full history and only the label moved.',
    'Fixed weighting inflating the volumes. A month counting three times was contributing three times its real spend and applications, so the weighted option showed more applications than the whole history. The ratios were never affected, but spend and applications read too high and the data quality labels were reading off inflated counts.',
    'Fixed the Benchmarks tab going blank. When I added the five period options I replaced the buttons but an edit to the code behind them did not apply, and I did not check. So the new buttons were reading a value the old code never created. All five options, the multiplier and both roles now render.',
    'Fixed the tool hanging the browser. The weighting worked out which months to use by scanning the whole dataset every single time it needed a month\u2019s weight, which is once per month, per location, per platform, on every plan build, and the budget solver runs the whole plan twenty six times. The weights are now worked out once per setting. One pass over the locations went from 113 milliseconds to 2, and the dataset is scanned once rather than 2,258 times.',
    'Fixed the tool failing to load. The function that names the data period was defined further down the file than the code calling it, and being a const rather than a function it does not hoist. Anything on a custom date range hit it before it existed and the page died. Only a saved custom range triggered it, which is why it looked fine on a fresh load.',
    'Benchmarks now offers all time, year to date, last 3 months, year to date with the last 3 months weighted, and a custom range. The weighted option takes a multiplier, so the last three months can count 2, 3, 4 times as much as the earlier months of the year while every month still contributes.',
    'Weighting rather than a hard cut-off, because a window drops a month from counting fully to counting nothing overnight and a thin location can lose most of its evidence in one step. Tested on January to July: planning on the full year under-predicted cost per application in all eight months across both roles, and weighting the last three at three times the rest cuts that bias. The improvement flattens after about 3 times.',
    'The prediction range and the platform tables follow the weighting too, so nothing is left reading the old period.',
    'Fixed the data period making almost no difference to the budget. The Plan and Platforms tabs built their figures from a hand-written list of settings that predated the period being a setting at all, so they quietly used whatever was last selected rather than the period the plan holds. Everything now goes through one builder. On the same target the two periods are about 38 per cent apart, where before they came out within 3 per cent of each other.',
    'The data period is part of the plan and each role holds its own, so SMR can sit on the last three months while Patrol sits on all time. A saved plan keeps the periods it was built on and cannot change afterwards: before this, changing the period on screen silently changed what a saved plan predicted.',
    'The header and the plan selector name both periods rather than one, and the PDF and the workings export each use the period for the role they are for.',
    'Changelog entries are dated by the day they were made. Everything up to 2 August had been landing under 28 July, which is when the entry above it happened to be written.',
  ] },
  { date: '3 Aug', items: [
    'Fixed the master sheet reading a day short and losing the first of the month. Dates come out of the spreadsheet reader at midnight local time, and the code was reading them in UTC, which is an hour earlier through British Summer Time. So 31 July read as 30 July, and 1 July read as 30 June and dropped out of the month altogether. On the July file that was 382 rows and 6,000 pounds of spend missing. This affected every master sheet load between late March and late October.',
    'The In platform data heading names the master sheet file it read and the last day in it. Downloads all share a name with a number on the end, so it was easy to load an older one and not notice.',
    'Took the last mention of matching the master sheet dates out of the two export boxes.',
    'An older shared copy can no longer replace newer work in your browser. Every save is stamped, and the reload leaves yours alone if it is the more recent of the two. This is what would otherwise have wiped five days of work the first time the tool was opened after the save bug was fixed.',
    'Added Back up next to the sync label. It downloads everything in this browser as a file.',
    'Fixed nothing having saved to the server since 28 July. The functions that read and write the shared copy had been deleted by an edit and the tool carried on against the copy in your browser without saying so. That is also why Performance Pacing kept losing what you had pasted: the reload was pulling a five day old copy over the top of it. Restored, and the test suite now fails the build if anything is called that does not exist.',
    'Removed the loading screen in front of the tool. It waited on the folded-in benchmarks before rendering anything, so a slow or failed request left it sat there. The tool opens straight away and the benchmarks fold in when they arrive.',
    'Trends is shaded day to day. Green where a location gained roles on the day before, red where it lost them, one role pale and four or more dark. A location that closed that day is solid red and one that opened is solid green. No change stays white. The first column is shaded against the plan, since that is the day before it. Depth is the number of roles that moved rather than a percentage, because one role off five is an ordinary day rather than a twenty per cent event.',
  ] },
  { date: '28 Jul to 2 Aug', items: [
    'Location priorities can compare against a saved plan. Pick one in Compare against and the Plan column becomes the open roles as at the day that plan was built on, so the grid, What changed and Trends all show how the month has moved against the plan rather than against RAC\u2019s own plan column. It works per location rather than per region, because the plan records its date and the counts for that day are already in the month\u2019s own history.',
    'A plan saved without a date recorded falls back to RAC\u2019s plan column, and the banner says which of the two is in use.',
    'A plan can be built on the open roles as at any day RAC have sent, picked on Setup, instead of typing the counts in by hand. The working plan keeps the date rather than the numbers, so it stays true to their file if they revise a day. Saving a version freezes the counts as they stood and records which date they came from, shown next to the plan.',
    'Location priorities takes RAC\u2019s own file directly. Their Location Updates workbook and our daily tracker both paste in as they are, so their file no longer has to be copied into ours first. Checked against June, July and August: 111 SMR rows and 120 Patrol, none unmatched.',
    'Dates in the file with nothing filled in yet are skipped. RAC lay the whole month out in advance, so the last column was usually empty and every location was reading as zero. The paste summary says how many were skipped.',
    'RAC\u2019s plan column is kept per month, and Setup offers it as the basis for a plan. So a plan can be built on the counts the month was planned against rather than on whatever the daily list says today.',
    'Fixed being unable to add vacancies to a month with nothing in it. The empty state was rendering instead of the paste box, so it told you to paste and gave you nowhere to do it. Vacancies now always shows, whatever month you are on.',
    'A month with no list of its own carries the previous month\u2019s open roles forward, which is what you want when building next month\u2019s plan early. Setup now says so instead of showing them as this month\u2019s own figures.',
    'Shorter wording on the Windsor button and the two export boxes.',
    'The pacing summary names where each platform\u2019s figures came from, so Windsor, the Indeed export, the Appcast export and the master sheet are no longer all described as pasted.',
    'Fixed the Windsor button failing with "sign-in could not be verified" about an hour after signing in. It was the one call that did not renew the session first, so it sent whatever token was sitting in the browser while everything else renewed and carried on working. It now renews before it asks, and retries once if it is still refused.',
    'The Windsor button also says why a sign-in was refused rather than just that it was. If the function is pointed at a different Supabase project than the one you signed in to, it names both.',
    'Workings export rebuilt. Read me sheet gone and the notes under each table gone. Clicks and apply rate are now on the Workings sheet as well as the raw data, and where clicks were never recorded it says so rather than leaving a blank that looks like a nought.',
    'Every calculation in the workbook is a live Excel formula rather than a pasted number. Cost per application reads =D5/E5, predicted applications reads =J5/I5, the location totals are SUM ranges and the Summary points at the Workings total. Click any cell and the arithmetic is there.',
    'SMR or Patrol is picked in the header before exporting, and only that one comes out. Both buttons used to fire twice and produce a file you did not want.',
    'Fixed budget to hit target giving a different answer depending on the budget you were looking at. It was scaling up from the current plan\u2019s applications per pound, which assumes spending twice as much buys twice as many applications. It does not, and the rest of the tool is built on knowing that. It now runs the whole plan at trial budgets until it lands on the target, so the figure is the same from any starting point. On YTD data it reads 136,250 from a 70,000 plan, a 128,200 plan or a 155,000 plan.',
    'Added Export workings next to Export PDF. A formatted spreadsheet for each role, generated from the same plan the PDF is drawn from so the two cannot disagree. Four sheets after the read me: the summary, one Workings sheet with every location and platform as a row reading left to right from raw performance through to predicted hires, every month of raw data, and how the range is worked out.',
    'Loading a saved plan now brings back everything it was built on, not just the settings typed into it. It restores the data window it used and the open roles as they stood when it was saved. Before this, opening an older plan re-costed it on whatever window happened to be selected, so it stopped being the plan that was issued.',
    'The plan selector says which window each saved plan was built on, so it is visible without loading it.',
    'Cut the PDF glossary from 20 entries to 13. Application, open roles, monthly budget and the on track wording were all saying what the label already said. Predicted hires and the range were each in there twice. Deployable budget just restated the two hold-back entries above it. Platforms still described the old way of splitting a budget, copying whatever the historic mix was.',
    'Fixed the tool getting permanently stuck on Reconnecting. Sign-in tokens can only be renewed once, and the page was renewing in two places at the same time, so one of them used a token the other had already spent. After that every save failed and it kept retrying behind the Reconnecting label instead of saying anything. Only one renewal now happens at a time, it happens a couple of minutes before the token runs out rather than after a save has failed, and if it genuinely cannot renew you go back to the sign in screen instead of sitting there.',
    'Took the last line telling you to download and publish the data file off the fold-in button.',
    'Rewrote the Method tab. It was describing things the tool no longer does: an equal coverage slice per location, a budget-to-target figure that included that slice, and UK-tagged spend being spread across locations. It also never explained how a location\u2019s budget splits across platforms, which is now the main thing the plan does. It says which data window it is built on and updates when that changes.',
    'The PDF says at the top of every page which data the plan is built on, all time or whichever window is picked.',
    'Copy pass on the PDF. The budget-split note still described the old method of copying the historic platform mix. The glossary still said hire rates came from the May plan and still mentioned three locations with no hire data, both out of date. Took out the softer wording and the first-person phrasing.',
    'Fixed how the range on the whole plan is worked out. It was the average of each location\u2019s own range, which is the wrong measure: a single location swings more than the whole plan does. It is now measured on the role\u2019s own cost per application month by month, over whichever benchmark window is picked.',
    'That makes a real difference. SMR on all time reads 12.8 to 31.3 hires, which is not much use to anyone. On January to June it reads 14.5 to 20.9. Patrol stays wide at 5.6 to 14.3 on the same window, because Patrol genuinely is that volatile month to month.',
    'The prediction range now follows the benchmark window. It used to read every month on record whatever window was picked, so choosing recent months changed the cost per application but not how certain it was. On the last three months the range comes down from 39% to 29% for SMR and 43% to 35% for Patrol.',
    'A window of fewer than three months cannot show variance, so those cells fall back to their own full history rather than to a flat 35%. Picking a two month window used to make everything look tighter purely because the placeholder was tighter than the real figure.',
    'Predicted hires now carries a range, on screen and in the PDF, alongside the headline number and on every line of the by-channel table. Applications had a range and hires did not, which made hires look like the more certain number when it is applications multiplied by a rate. Same rate across the range: fewer applications means fewer hires.',
    'Folding months into the benchmarks now saves them for everyone straight away, the same as plans and priorities. Updating the master sheet no longer means downloading a file and putting it in the repository. The download is still there as a backstop, along with an undo that goes back to the numbers the tool starts from.',
    'Plainer wording on Setup for how the split works and for the above-proven figure.',
    'Changed how a location\u2019s budget splits across platforms. It used to copy whatever the split had historically been, which took no account of what anything cost. It now goes wherever the next hire is cheapest, using a spend response curve fitted per platform and each location\u2019s own hire rate, held to spend levels already run. On July that is 22.0 SMR hires against 21.1 and 11.8 Patrol against 11.2, on the same budget.',
    'It works on the cost of the next hire rather than the next application. Working on applications made Patrol worse: it pushed money into Appcast, which converts to applications well and to hires badly, so applications went up and hires went down.',
    'No toggle for it. There is one method rather than a choice to make.',
    'Took the last coverage reserve wording out of the PDF glossary.',
    'Took the coverage reserve out. Stress tested across sixteen demand shapes, both ways of splitting, from two locations at 50 roles against 1 up to twelve locations on an 8,000 pound budget. It never moved the worst-off location by more than about thirty pounds and the predicted applications were identical every time. A location the demand split would starve has no spend history, and the spend ceiling will not let it take the extra anyway, so the two cancel each other out. Gone from Setup, from the workings and from the PDF.',
    'Nothing is ever planned above what a location and platform has already spent in a month. That is now the default and it applies whichever way the budget is split, not just the new way. The old split had no ceiling at all and was putting money into cells above anything measured.',
    'Added a spend ceiling on Setup, set as a percentage of the biggest month each location and platform has already run. 100% means never above a proven figure. Raise it to 110% to stretch a little, and the number is on the page rather than buried in the model.',
    'Where a location has never run a platform, the ceiling is that platform\u2019s typical month across the locations that have. Still a figure that has been spent somewhere, rather than a number picked out of the air.',
    'When the budget goes past what has already been spent, it is still spent, because that is what the target needs on our estimate. What changes is that the plan says how much of it sits above proven levels and shows it as its own line on Setup, in the workings and in the PDF. On July SMR that is 3,212 pounds of 62,908, so 5.1%. Patrol fits inside proven spend entirely.',
    'The curve shape is fitted per platform, not per location. A single location has six or eight months and fits to nonsense: Google London came out saying more spend buys fewer applications. Each location sets its own scale from its own cost per application, so local knowledge is kept without inventing a curve from noise.',
    'Every location and platform is capped at 1.75 times the biggest month it has actually done. Appcast is cheapest at the margin by a distance but has never taken more than 1,640 pounds in a month, and without the cap the curve would happily send it 20,000.',
    'Cut a lot of text out. Headings that repeated themselves, help under fields that explained the obvious, and banners that said the same thing three ways. About a quarter of the written copy has gone and nothing works differently.',
    'The benchmark window now drives the plan. Pick May to June in Benchmarks and the planner, the channel tables and the PDF all work on those rates. The window is shown next to the month at the top, and a saved plan records which window it was built on.',
    'Every benchmark table now leads with the same four columns: cost per application, cost per hire, hire rate and apply rate. Anything else comes after.',
    'Clicks are now kept month by month, so apply rate moves with the chosen window instead of being stuck on the all-time figure. Months before 2026 have no clicks on record and fall back to the all-time rate, marked with a star. The Data tab keeps clicks from now on, so this fills in as months are added.',
    'Sign in is now required. No local-only mode, no sign out button, and only enhancemedia.co.uk addresses. The address is checked in the page and again by the database, so a link sent anywhere else gets nowhere.',
    'Fixed the tool dropping to Offline for no visible reason. Sessions expire after about an hour and were never being renewed. Requests now renew the session and retry, and a save that fails keeps retrying rather than being thrown away. If a session cannot be renewed you land back on the sign in screen instead of quietly working on your own copy.',
    'Benchmarks can be set to a date range. Presets for all time, last six months and last three, plus a from and to month picker for a specific window like May to June. It says how far off all time that window is, so the difference is on the page rather than something to work out.',
    'Benchmarks now shows cost per hire alongside cost per application. Hire rates stay on the whole history whatever window is picked, because hires lag by weeks and a short window never has enough of them, so cost per hire is the window\u2019s cost per application divided by the all-time hire rate.',
    'Months of data now says which months, not just how many. Nine months reads as "9, Oct 25 to Jun 26".',
    'Added two blended views to Benchmarks: every location across all platforms, and every platform across all locations. The per-platform tables fold away.',
    'Fixed the blended CPA on Month on month. It was averaging the location rates, which gives a location with two roles the same say as one with twenty. It is now total spend over total applications with the budget following the roles, so a bigger share in an expensive location moves it. Reads about 3 pounds lower and matches how the planner works out its own blended rate.',
    'Location priorities is split by role first. Pick SMR or Patrol, then Vacancies, What changed, Trends or Month on month underneath. What changed and Trends used to show both roles stacked on one page.',
    'Month on month is per role too, so the blended CPA of the mix is SMR\u2019s or Patrol\u2019s rather than the two averaged together, which was not a number that meant anything.',
    'Fixed a month with nothing pasted showing July\u2019s locations under its own heading. July\u2019s tracker was being used as the fallback for every month, so August looked populated when it was empty, and Month on month only counted one month because only one had anything genuinely stored against it.',
    'Renamed "this month\u2019s actuals" to In platform data, and it folds away once loaded so it stops taking up the top of the page.',
    'Location priorities has a Month on month view. Pick two months and it shows open roles, live locations and the blended CPA of the mix for each, then the same by location. It says whether this month\u2019s spread of roles is a more expensive one to fill than last month\u2019s, before anything about how either month ran.',
    'The tool menu on the left now stays put as the page scrolls.',
    'Why now breaks the cost per application down by platform: planned rate against actual, and how many locations each platform is above its planned rate in. If one platform is above plan almost everywhere, that reads differently to one or two locations being off.',
    'Locations the plan never funded are now part of where it went, rather than being counted as free applications on their own. Money going to them came out of the funded locations, so it is priced the same way, at that location\u2019s own historic cost per application. The three figures on the page now add up to the gap with nothing left over.',
    'Fixed the mix table counting locations the plan never funded. Spend somewhere with no planned share was still diluting everyone else\u2019s share, so every funded location looked like it had lost ground to nobody and London losing share read as a loss when it should have been a gain. The mix now only covers locations the plan funded, and off-plan spend is called out separately.',
    'Plainer wording across the banners and help text.',
    'Plainer wording throughout Why. The callouts now just say the numbers, for example "the live mix now has a blended CPA of £60 compared to £54 in the plan", instead of explaining what that means about the mix.',
    'Fixed the worth column in the mix table. It was showing what a location\u2019s money was doing against the average, which is positive for any cheap location whatever its share does, so a cheap location losing share still read as a gain. It now prices only the shift: the money held over or under the planned share. A location on its planned share reads nil, however cheap or dear.',
    'Why now shows how the mix has moved: share of spend in the plan against share now, per location, priced at that location\u2019s historic cost per application. So if London was a tenth of the plan and is now nearly a third, that is on the page with what it has cost in applications. Rates used are the historic ones the plan was built on, never this month\u2019s, because the question is what moving the money is worth on known performance rather than how the month happens to be running.',
    'Why now splits a gap three ways instead of two: how much was spent, where it went, and what each application cost. The middle one was missing, which is why it could say "underspending costs applications" while spend was actually up. Money moving off cheap locations onto dear ones loses applications without spend falling at all, and that now has its own number.',
    'Where it went compares the blended CPA of the locations currently carrying the money against the blended CPA in the plan, so a shift onto more expensive locations shows up with a number on it.',
    'Spend on a different project is now dropped completely rather than sitting in the total. The four-digit code at the end of a campaign name says which project it belongs to, and any code that has no campaigns in the plan is somebody else\u2019s work. For July that takes out Geofencing and the OneRAC open day, about £4,200.',
    'Non-standard is now its own line, separate from other projects. Brand, competitor, consideration and remarketing are RAC recruitment money so they stay in total spend, they just never count against plan. About £4,500 in July.',
    'Fixed the not-placed figure being counted twice. A Windsor pull covers Google and Meta together but its leftovers are recorded once, and the table was adding them for both. It read £25,816 where the real figure is £8,642.',
    'Fixed the spend reconciliation showing Google at roughly twice its size. Spend the pull could not place, mostly Demand Gen and brand campaigns, was being shown against whichever platform came first in the list rather than on its own. It now has its own row and the per-platform figures show only what actually went into the plan comparison.',
    'Removed the second Google and Meta paste box. The button covers it.',
    'Fixed pacing showing nothing unless the master sheet was loaded. Windsor and the Indeed and Appcast pastes now stand on their own, which is what was intended when Windsor started carrying applications. The master sheet is only needed if you want Eploy applications for Indeed.',
    'Added an "actuals run to day" box for when there is no master sheet, since a paste carries no dates. Windsor fills it in from the day it pulled to.',
    'Fixed saved plans disappearing. Saving opened a box asking for a note, and closing it counted as coming back to the tab, which reloaded the shared copy over the top of the save before it had gone up. The reload now waits for anything unsaved to finish, and saving no longer asks anything. Use Rename to add a name and a note once it is saved.',
    'Windsor now brings applications as well as spend for Google and Meta, so the master sheet is no longer needed for those two. Set up the same way the Excel pacing doc pulls them: for Google, the conversion action named exactly "Application Submitted"; for Meta, its own applications field on the same row as spend.',
    'Google and Meta spend now comes straight from Windsor with a button, for the same days the master sheet covers. The Windsor key sits on the server and never reaches the browser. Pasting an export still works if the button will not play.',
    'Shared saving now needs a sign in, using a link sent to your work email. Anyone on an enhancemedia.co.uk address is allowed, others can be added to a list. Without signing in the tool still works, it just keeps everything on that browser and the header says so.',
    'Moved to its own database rather than sharing one with another tool.',
    'Plans, priorities and pacing are now saved to a shared copy instead of just this browser. Anyone opening the tool sees the same numbers, and it reloads when you come back to the tab. A label in the header says Shared, Saving or Offline. If it says Offline, changes are still being kept on that browser but nobody else can see them.',
    'Google and Meta can be pasted from a Windsor export. Platform is read from each campaign name, so Search goes into the plan and Demand Gen and display are left out on their own. Windsor rows carry dates, unlike the Appcast and Indeed exports.',
    'Added a Why tab to Performance Pacing. It splits a gap in applications into the two things that cause it: spending more or less than planned, and each application costing more or less than planned. The two add up to the gap exactly, and it shows which locations or platforms are driving it.',
    'Removed the strapline from the bottom of the page.',
    'Status labels no longer wrap onto two lines and overflow their column.',
    'Added plan CPA next to actual CPA everywhere, with actual shown green when it is at or under plan.',
    'Renamed the "%" columns to "vs expected" and spelt out that percentages are against where the plan says we should be by now, not against the whole month.',
    'Left-hand menu: Planner is now Monthly Budget Planner, Pacing is Performance Pacing, and Data and Changelog moved to an Admin group at the bottom so they are not sat with the tools.',
    'The Appcast and Indeed paste boxes now name the exact date range to export for, taken from where the master sheet stops. Those exports carry no dates, so one taken month to date against a master sheet that stops on the 25th was reading as over pacing purely for having more days in it.',
    'Pacing breakdown can be filtered by role, location and platform, and any column can be clicked to sort. Default order is role then location then platform instead of biggest spend first. Totals at the bottom follow whatever is filtered.',
    'Fixed Indeed and Appcast pastes reading the wrong spend when copied out of Excel. Excel copies with tabs and leaves the comma in numbers like 1,395.67, and the splitter was treating that comma as a new column, so everything after it shifted along the row. Rows under a thousand were fine, rows over it were not, which is why the total came out low. It now works out the separator from the header and sticks to it.',
    'Pacing export rebuilt with far more in it: role by platform, role by region, role by region by platform, region totals, platform totals, a spend and applications grid per role, and every line unaggregated. Each row now also carries spend left in plan, apps left to target, projected spend and apps at the current rate, and plan CPA against actual CPA.',
    'Plans are named "RAC Media Budgets - July 2026 v1" instead of just v1, and can be renamed or deleted. Delete asks first.',
    'Applications running ahead of plan now shows green instead of red. Spend keeps flagging both directions.',
    'Added a spend reconciliation showing master sheet against pasted figures per platform, with a warning when a paste is a long way off. Neither the Appcast nor the Indeed export carries dates, so a paste taken over a shorter range silently replaced the whole month.',
    'Open roles can now be set by hand for a single plan instead of always following Location priorities. Default is still live. Use it to rebuild an older plan on the demand it was actually written against, when priorities have moved on since.',
    'Fixed pacing comparing against a moving target. The planner takes its open roles from Location priorities as they stand today, so the plan was silently rebuilding itself every time a list was pasted and nothing could read as off plan. Saved plans now freeze the open-role counts they were built on, and pacing measures against a saved plan you pick rather than the working one.',
    'Pacing says which plan it is measuring against and flags when open roles have moved since that plan was saved.',
    'Pasted actuals stay put when moving between tabs instead of clearing.',
    'Favicon set to the RAC icon.',
    'Three tools in one place now: planner, location priorities, pacing. Work is filed by month, and a month can hold several saved plans to compare side by side.',
    'Planner takes a hire target instead of an application target. The application target is worked back from it using the blended hire rate for the locations live that month.',
    'Open roles per location moved out of the planner into Location priorities. One number, one place.',
    'Location priorities replaces the Excel tracker. Paste the whole SMR or Patrol tab and it replaces the month. Keeps the grids, What changed and Trends.',
    'Pacing added. Shows spend and applications against plan by role, location and platform, and exports to Excel.',
    'Appcast and Indeed can be pasted straight off the platform. Role and location are read from the campaign name. No more typing Indeed spend in by hand.',
    'Indeed spend comes from Total cost, not Budget spent. The Indeed export has no applications in it, so those stay from Eploy.',
    'Region view moved to Pacing and now reads its budget from the plan instead of a typed-in figure.',
    'Rebuilt all of 2026 from the master sheet. Spend not tagged to a location is no longer spread across locations, it is left out. Indeed CPA down to £84, Google £46, Meta up to £71, Appcast £26.',
    'Data tab added so the benchmarks can be updated without a developer. Drop the master sheet in, pick the months, download the new data file.',
    'Historic data moved out of the page into its own file so it can be updated on its own.',

// ====================================================================
// WORKSPACE - months, plan versions, and the shared demand numbers.
//
// A month is a container. It holds the open-role counts for that month
// (owned by Location priorities), the plan you are currently working on,
// and any plans you have saved. Saved plans are compared against each
// other, not against other months.
//
// Demand sits at month level, not inside each saved plan. That is on
// purpose: comparing two saved plans should show what changed in the
// planning, not muddle it with a change in how many roles were open.
// ====================================================================

function defaultPlannerState() {
  return {
    budget: { SMR: 35000, Patrol: 28000 },
    hireTarget: { SMR: 26, Patrol: 26 },
    coverageFloor: 1000,
    capMultiple: 1.0,
    bench: { SMR: null, Patrol: null },
    commentary: { SMR: '', Patrol: '' },
    commentaryLegacy: { SMR: '', Patrol: '' },
    coveragePct: 0,
    premiumCampaigns: { SMR: 3, Patrol: 3 },
    acReserve: { SMR: AC_RESERVE_DEFAULT, Patrol: AC_RESERVE_DEFAULT },
    platMin: {
      SMR: { indeed: 0, meta: 0, google: 0, appcast: 0 },
      Patrol: { indeed: 0, meta: 0, google: 0, appcast: 0 },
    },
    platMax: {
      SMR: { indeed: 0, meta: 0, google: 0, appcast: 0 },
      Patrol: { indeed: 0, meta: 0, google: 0, appcast: 0 },
    },
    coverage: { SMR: defaultCoverage('SMR'), Patrol: defaultCoverage('Patrol') },
    regionMin: { SMR: {}, Patrol: {} },
    regionMax: { SMR: {}, Patrol: {} },
  };
}

// A fresh month starts from the real snapshot for that month if there is
// one, then from whatever the previous month held, then from the dataset's
// own baseline.
function defaultDemand(ws, month) {
  const snap = DATA.demand_snapshots && DATA.demand_snapshots[month];
  if (snap) {
    const out = {};
    ROLES.forEach(role => {
      out[role] = {};
      DATA.regions_ordered.forEach(r => { out[role][r] = (snap[role] && snap[role][r]) || 0; });
    });
    return out;
  }
  // No list for this month yet, so carry the most recent one forward. A plan
  // for next month has to be built on what is known now. Where it came from
  // is marked below so it does not read as this month's own figure.
  const earlier = Object.keys(ws.months || {}).filter(m => m < month).sort();
  if (earlier.length) {
    const prev = ws.months[earlier[earlier.length - 1]];
    if (prev && prev.demand) {
      const copy = JSON.parse(JSON.stringify(prev.demand));
      copy._carriedFrom = earlier[earlier.length - 1];
      return copy;
    }
  }
  const out = {};
  ROLES.forEach(role => {
    out[role] = {};
    DATA.regions_ordered.forEach(r => {
      out[role][r] = (DATA.default_vacancies && DATA.default_vacancies[role] && DATA.default_vacancies[role][r]) || 0;
    });
  });
  return out;
}

function newMonth(ws, month) {
  return { demand: defaultDemand(ws, month), working: defaultPlannerState(), versions: [], loaded: null };
}

function defaultWorkspace() {
  const snaps = Object.keys(DATA.demand_snapshots || {}).sort();
  const month = snaps.length ? snaps[snaps.length - 1] : DATA.default_month;
  const ws = { current: month, months: {} };
  ws.months[month] = newMonth(ws, month);
  return ws;
}

// Everything the planner needs, assembled from the month container. The
// open-role counts and the live locations are read from demand, and the
// application target is derived from the hire target. Nothing downstream
// has to know where any of it came from.
function composePlannerState(month, container, demandOverride) {
  const s = { ...container.working, planMonth: month };
  // A plan can be anchored to one day of the priorities history rather than
  // to today's counts. The date is stored, not the numbers, so the plan keeps
  // matching the file. Saving a version freezes the numbers as they stood.
  if (!demandOverride && s.demandDate) {
    try {
      const pri = priorityFor(month, container);
      if ((pri.dates || []).includes(s.demandDate)) {
        demandOverride = demandAsAt(pri, s.demandDate);
      }
    } catch (e) { /* fall through to live counts */ }
  }
  // Live priorities by default. A plan can pin its own counts instead, which
  // is how a plan written weeks ago gets rebuilt on the demand it actually
  // had rather than on today's.
  const demandSrc = (container.working && container.working.demandOverride)
    || demandOverride || container.demand;
  s.vacancies = {};
  s.liveRegions = {};
  ROLES.forEach(role => {
    const d = (demandSrc && demandSrc[role]) || {};
    const vac = {};
    DATA.regions_ordered.forEach(r => { vac[r] = Math.max(0, Math.round(d[r] || 0)); });
    s.vacancies[role] = vac;
    s.liveRegions[role] = DATA.regions_ordered.filter(r => vac[r] > 0);
  });
  s.appTarget = {};
  ROLES.forEach(role => {
    s.appTarget[role] = deriveAppTarget(role, (s.hireTarget && s.hireTarget[role]) || 0, s);
  });
  return s;
}

// ====================================================================
// LOCATION PRIORITIES
// A port of the Daily Location Priorities tracker. RAC send the SMR and
// Patrol lists every weekday; those get pasted in and everything else is
// worked out from them.
//
// The paste matches on location name, never on row position. RAC's list
// can arrive in a different order and can carry locations that have never
// appeared before, and a fixed grid of rows would put yesterday's numbers
// against today's wrong locations without saying a word. Matching on the
// name makes the order irrelevant and new lines land on their own.
//
// RAC send a complete list, so a location that has closed comes through at
// zero rather than disappearing. Anything already on the grid that is
// missing from a paste is set to zero for that day, which lands in the
// same place.
// ====================================================================

function priorityRegion(raw) {
  if (typeof raw !== 'string') return null;
  const k = raw.toLowerCase().replace(/[^a-z]/g, '');
  const direct = DATA.regions_ordered.find(r => r.toLowerCase().replace(/[^a-z]/g, '') === k);
  return direct || (DATA.region_aliases || {})[k] || null;
}
const locKey = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/[^a-z0-9 ]/g, '').trim();

const pad2 = n => String(n).padStart(2, '0');
const MONTH_NAMES = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

// Read a date out of a header cell. Copying out of a sheet gives text, and
// UK format, so 01/07/2026 is the first of July and never the seventh of
// January.
function parseDateCell(v, fallbackYear) {
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const t = String(v == null ? '' : v).trim();
  if (!t) return null;
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) {
    let y = m[3]; if (y.length === 2) y = '20' + y;
    return y + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  }
  m = t.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-]?(\d{2,4})?$/);
  if (m) {
    const mi = MONTH_NAMES.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mi >= 0) {
      let y = m[3] || fallbackYear; if (String(y).length === 2) y = '20' + y;
      return y + '-' + pad2(mi + 1) + '-' + pad2(m[1]);
    }
  }
  return null;
}

// Pull the whole tab apart: the header row of dates, then a row per
// location. The full month is repasted every time, so this reads the lot
// rather than merging a single day in.
function parseMonthPaste(text, fallbackYear) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { error: 'Nothing pasted.' };
  const grid = lines.map(l => (l.includes('\t') ? l.split('\t') : l.split(/\s{2,}/)).map(c => String(c).replace(/^"|"$/g, '').trim()));

  // The header is whichever row carries the most dates.
  let hdr = -1, best = 0, dateCols = [];
  grid.forEach((cells, i) => {
    const found = [];
    cells.forEach((c, j) => { const d = parseDateCell(c, fallbackYear); if (d) found.push([j, d]); });
    if (found.length > best) { best = found.length; hdr = i; dateCols = found; }
  });
  if (hdr < 0 || dateCols.length === 0) {
    return { error: 'I could not find a row of dates. Paste the whole tab including the header row with the date columns across the top.' };
  }

  const head = grid[hdr].map(c => c.toLowerCase());
  const findCol = (...words) => head.findIndex(h => words.some(w => h.includes(w)));
  let iLoc = findCol('location', 'role and'), iReg = findCol('region'), iPlan = findCol('plan');
  const dateIdx = dateCols.map(d => d[0]);
  if (iPlan >= 0 && dateIdx.includes(iPlan)) iPlan = -1;

  const rows = [], unmatched = [];
  for (let i = hdr + 1; i < grid.length; i++) {
    const cells = grid[i];
    const first = (cells[0] || cells[1] || '').toLowerCase();
    if (/^(total live|total vac|total\b)/.test(first)) continue;

    let region = iReg >= 0 ? priorityRegion(cells[iReg]) : null;
    if (!region) cells.forEach((c, j) => { if (!region && !dateIdx.includes(j)) { const m = priorityRegion(c); if (m) region = m; } });

    let location = iLoc >= 0 ? cells[iLoc] : '';
    if (!location) {
      location = cells.find((c, j) => !dateIdx.includes(j) && j !== iReg && j !== iPlan && c && !/^\d+$/.test(c)) || '';
    }
    if (!location && !region) continue;                       // blank spacer row
    if (!location || !region) {
      unmatched.push({ line: i + 1, text: cells.join(' ').trim().slice(0, 90),
                       why: !location ? 'no location name' : 'region not recognised' });
      continue;
    }
    const v = {};
    let any = false;
    dateCols.forEach(([j, iso]) => {
      const raw = (cells[j] == null ? '' : String(cells[j])).trim();
      if (raw === '') return;                                 // blank means it did not exist yet
      const n = parseInt(raw.replace(/[^0-9-]/g, ''), 10);
      if (!isNaN(n)) { v[iso] = Math.max(0, n); any = true; }
    });
    const plan = iPlan >= 0 ? (parseInt(String(cells[iPlan] || '').replace(/[^0-9]/g, ''), 10) || 0) : 0;
    if (!any && !plan) continue;
    rows.push({ location, region, plan, v });
  }

  if (!rows.length) return { error: 'I found the date row but no location rows under it.' };
  // RAC's own file lays the whole month out in advance, so most columns are
  // still empty. Keep only the days that have actually been filled in, or
  // every location reads as zero on the last column.
  const allDates = dateCols.map(d => d[1]).sort();
  const filled = allDates.filter(d => rows.some(r => r.v[d] !== undefined && r.v[d] !== null && r.v[d] !== ''));
  const blank = allDates.length - filled.length;
  rows.forEach(r => {
    const v = {};
    filled.forEach(d => { if (r.v[d] !== undefined) v[d] = r.v[d]; });
    r.v = v;
  });
  return { rows, dates: filled, unmatched, hadPlan: iPlan >= 0, blankCols: blank };
}

// The paste is the whole month, so it replaces the role's grid outright.
// No merging, no inferring what a missing row means.
// RAC's file carries a plan column: the vacancy count the month was planned
// on. Kept per month so a plan can be built on it rather than on whatever the
// daily list says today.
// Vacancy counts as at one day of the priorities history, per role.
function demandAsAt(pri, date) {
  const out = {};
  ROLES.forEach(role => {
    out[role] = {};
    DATA.regions_ordered.forEach(r => { out[role][r] = 0; });
    (((pri.roles || {})[role] || {}).rows || []).forEach(row => {
      const n = +((row.v || {})[date]) || 0;
      if (n > 0 && out[role][row.region] !== undefined) out[role][row.region] += n;
    });
  });
  return out;
}

// What the Plan column on Location priorities compares against. A saved plan
// records the day its open roles were taken from, so the baseline can be that
// day's counts, per location, straight out of this month's own history. Where
// a plan has no date on it, RAC's own plan column is used instead.
function planBaselineFor(pri, container, planId) {
  const versions = (container && container.versions) || [];
  const v = versions.find(x => x.id === planId);
  if (v && v.demandDate && (pri.dates || []).includes(v.demandDate)) {
    return { kind: 'date', date: v.demandDate, name: v.name,
             valueFor: (row) => +((row.v || {})[v.demandDate]) || 0 };
  }
  if (v) {
    return { kind: 'plan-column', name: v.name, noDate: true,
             valueFor: (row) => +row.plan || 0 };
  }
  return { kind: 'plan-column', valueFor: (row) => +row.plan || 0 };
}

function planDemandFrom(pri, role) {
  const rows = ((pri.roles || {})[role] || {}).rows || [];
  const out = {};
  DATA.regions_ordered.forEach(r => { out[r] = 0; });
  let any = false;
  rows.forEach(r => {
    const n = +r.plan || 0;
    if (n > 0 && out[r.region] !== undefined) { out[r.region] += n; any = true; }
  });
  return any ? out : null;
}

function applyMonthPaste(pri, role, parsed) {
  const next = JSON.parse(JSON.stringify(pri));
  const oldRows = (next.roles[role] || {}).rows || [];
  const oldByKey = {}; oldRows.forEach(r => { oldByKey[locKey(r.location)] = r; });

  const rows = parsed.rows.map(p => ({
    location: p.location, region: p.region,
    plan: parsed.hadPlan ? p.plan : ((oldByKey[locKey(p.location)] || {}).plan || 0),
    v: p.v,
  }));
  next.roles[role] = { rows };
  const all = new Set([...(next.dates || []), ...parsed.dates]);
  // Only keep dates that some role still carries.
  next.dates = [...all].sort().filter(d =>
    ROLES.some(r => ((next.roles[r] || {}).rows || []).some(x => x.v[d] != null)));

  const newKeys = new Set(rows.map(r => locKey(r.location)));
  const added = rows.filter(r => !oldByKey[locKey(r.location)]);
  const gone = oldRows.filter(r => !newKeys.has(locKey(r.location)));
  const newDates = parsed.dates.filter(d => !(pri.dates || []).includes(d));
  return { next, report: { total: rows.length, added, gone, newDates, dates: parsed.dates.length } };
}


// The seed is July's tracker. It belongs to July and nowhere else: falling
// back to it for any month with nothing pasted showed one month's locations
// under another month's heading.
function seedMonth() {
  const d = ((DATA.priorities_seed || {}).dates || [])[0];
  return d ? d.slice(0, 7) : null;
}

function emptyPriorities() {
  return { dates: [], roles: { SMR: { rows: [] }, Patrol: { rows: [] } }, budgets: {}, thresholds: {} };
}

// What a given month actually holds: what was pasted, or the seed if this is
// the month the seed is for, or nothing.
function priorityFor(month, container) {
  if (container && container.priorities) return container.priorities;
  if (month === seedMonth()) return seedPriorities();
  return emptyPriorities();
}

function seedPriorities() {
  const s = DATA.priorities_seed;
  if (!s) return { dates: [], roles: { SMR: { rows: [] }, Patrol: { rows: [] } }, budgets: {}, thresholds: {} };
  return JSON.parse(JSON.stringify({
    dates: s.dates, roles: s.roles, budgets: s.budgets, thresholds: s.thresholds,
  }));
}


function nextWeekday(fromISO) {
  const d = new Date((fromISO || todayISO()) + 'T00:00:00');
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return d.toISOString().slice(0, 10);
}

function regionCut(rows, date, baseline) {
  const out = {};
  DATA.regions_ordered.forEach(r => { out[r] = { locs: 0, vac: 0 }; });
  (rows || []).forEach(row => {
    const n = date === 'plan' ? (baseline ? baseline.valueFor(row) : (row.plan || 0)) : (row.v && row.v[date]);
    if (!out[row.region] || !(n > 0)) return;
    out[row.region].locs += 1;
    out[row.region].vac += n;
  });
  return out;
}

function cellTone(now, before) {
  if (now == null || before == null) return '';
  if (now > before) return 'up';
  if (now === 0 && before > 0) return 'closed';
  if (now < before) return 'down';
  return 'same';
}

function riskOf(chg, th) {
  if (chg == null) return { label: 'No plan', kind: 'none' };
  if (chg <= (th.dilution ?? -0.4)) return { label: 'High dilution', kind: 'bad' };
  if (chg <= (th.caution ?? -0.25)) return { label: 'Caution', kind: 'warn' };
  if (chg >= (th.concentrated ?? 0.25)) return { label: 'Concentrated', kind: 'good' };
  return { label: 'On plan', kind: 'none' };
}

// ---- paste one day of RAC's list ----
function MonthPaste({ role, pri, onApply, month }) {
  const [text, setText] = useState('');
  const year = (month || '2026-07').slice(0, 4);
  const parsed = useMemo(() => (text.trim() ? parseMonthPaste(text, year) : null), [text, year]);

  const preview = useMemo(() => {
    if (!parsed || parsed.error) return null;
    const old = (pri.roles[role] || {}).rows || [];
    const oldKeys = new Set(old.map(r => locKey(r.location)));
    const newKeys = new Set(parsed.rows.map(r => locKey(r.location)));
    const last = parsed.dates[parsed.dates.length - 1];
    return {
      added: parsed.rows.filter(r => !oldKeys.has(locKey(r.location))),
      gone: old.filter(r => !newKeys.has(locKey(r.location))),
      newDates: parsed.dates.filter(d => !(pri.dates || []).includes(d)),
      live: parsed.rows.filter(r => (r.v[last] || 0) > 0).length,
      vac: parsed.rows.reduce((s, r) => s + (r.v[last] || 0), 0),
      last,
    };
  }, [parsed, pri, role]);

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">Paste the whole {role} tab</div>
        
      </div>
      <div className="card-body">
        <div className="help-text" style={{ marginBottom: 10 }}>
          Copy the {role} tab from the sheet RAC send, header row included, and paste it here. It replaces
          the month outright rather than merging a day in, so whatever they have sent is what you get and
          the trends always line up with the source.
        </div>
        <textarea className="paste-box" rows={7} value={text}
          placeholder={'Role and Location\tRegion\tJuly Plan\t01/07/2026\t02/07/2026 ...'}
          onChange={e => setText(e.target.value)} />

        {parsed && parsed.error && (
          <div className="parse-bad" style={{ marginTop: 10 }}>{parsed.error}</div>
        )}

        {preview && (
          <div className="parse-report">
            <div className="parse-line">
              <strong>{parsed.rows.length}</strong> locations
              {' \u00B7 '}<strong>{parsed.dates.length}</strong> days, {fmtDay(parsed.dates[0])} to {fmtDay(preview.last)}
              {' \u00B7 '}<strong>{preview.live}</strong> live and <strong>{preview.vac}</strong> vacancies on the last day
            </div>
            {parsed.blankCols > 0 && (
              <div style={{ marginTop: 6 }}>
                {parsed.blankCols} later date{parsed.blankCols === 1 ? '' : 's'} in the file
                {parsed.blankCols === 1 ? ' is' : ' are'} still empty and {parsed.blankCols === 1 ? 'was' : 'were'} skipped.
              </div>
            )}
            {parsed.unmatched.length > 0 && (
              <div className="parse-bad">
                <strong>{parsed.unmatched.length} row{parsed.unmatched.length === 1 ? '' : 's'} I could not read.</strong>
                {' '}Nothing is taken from these, so check them before applying.
                <ul style={{ margin: '6px 0 0 18px' }}>
                  {parsed.unmatched.slice(0, 5).map((u, i) => (
                    <li key={i}>Line {u.line}: {u.text} <span className="text-muted">({u.why})</span></li>
                  ))}
                  {parsed.unmatched.length > 5 && <li className="text-muted">and {parsed.unmatched.length - 5} more</li>}
                </ul>
              </div>
            )}
            {preview.newDates.length > 0 && (
              <div className="parse-new">
                <strong>{preview.newDates.length} new day{preview.newDates.length === 1 ? '' : 's'}:</strong>
                {' '}{preview.newDates.map(fmtDay).join(', ')}
              </div>
            )}
            {preview.added.length > 0 && (
              <div className="parse-new">
                <strong>{preview.added.length} location{preview.added.length === 1 ? '' : 's'} new to the grid.</strong>
                <ul style={{ margin: '6px 0 0 18px' }}>
                  {preview.added.slice(0, 5).map((p, i) => <li key={i}>{p.location} ({p.region})</li>)}
                  {preview.added.length > 5 && <li className="text-muted">and {preview.added.length - 5} more</li>}
                </ul>
              </div>
            )}
            {preview.gone.length > 0 && (
              <div className="parse-bad">
                <strong>{preview.gone.length} location{preview.gone.length === 1 ? '' : 's'} on the grid but not in this paste.</strong>
                {' '}They will be dropped, along with their history. If that is unexpected, the paste may be
                short of some rows.
                <ul style={{ margin: '6px 0 0 18px' }}>
                  {preview.gone.slice(0, 5).map((r, i) => <li key={i}>{r.location}</li>)}
                  {preview.gone.length > 5 && <li className="text-muted">and {preview.gone.length - 5} more</li>}
                </ul>
              </div>
            )}
          </div>
        )}

        <div className="dial-row" style={{ marginTop: 12 }}>
          <button className="btn btn-sm btn-primary" disabled={!preview}

            Replace the {role} month

          <span className="help-text" style={{ flex: 1 }}>
            Locations are matched by name, so the order RAC send them in makes no difference.
          </span>
        </div>
      </div>
    </div>
  );
}

                  <th className="plan-col">{totLocs('plan')}</th>

                  <th className="plan-col">{totVac('plan')}</th>

                  <tr key={i}>
