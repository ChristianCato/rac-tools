// ---- Trends ----
// Shading against the day before, so a column shows what moved that day
// rather than the whole gap since the plan. Depth grows with the size of the
// move and tops out at a third, so one big swing does not flatten the rest.
// Reaching nought, or coming back from it, is called out on its own because
// closing a location is a different event from losing a role in it.
function trendShade(now, prev) {
  if (prev === 0 && now === 0) return null;
  if (prev > 0 && now === 0) return { bg: 'rgba(198,40,40,0.85)', fg: '#fff', strong: true, note: 'closed' };
  if (prev === 0 && now > 0) return { bg: 'rgba(27,110,60,0.85)', fg: '#fff', strong: true, note: 'opened' };
  if (now === prev) return null;
  // Depth is the number of roles that moved, not a percentage. Day to day
  // these are small counts, and one role off five is an ordinary day rather
  // than a 20% event. One role is pale, four or more is as dark as it gets
  // short of the location closing.
  const share = Math.min(1, (Math.abs(now - prev) - 1) / 3);
  const a = 0.12 + share * 0.40;
  return now < prev
    ? { bg: 'rgba(198,40,40,' + a.toFixed(2) + ')', fg: 'var(--ink)', note: 'down' }
    : { bg: 'rgba(27,110,60,' + a.toFixed(2) + ')', fg: 'var(--ink)', note: 'up' };
}

function TrendsView({ pri, role, baseline }) {
  const dates = pri.dates || [];
  return (
    <div>
      {[role].map(role => {
        const rows = (pri.roles[role] || {}).rows || [];
        const cuts = {}; dates.forEach(d => { cuts[d] = regionCut(rows, d); });
        const planCut = regionCut(rows, 'plan', baseline);
        const blocks = [
          { key: 'locs', title: 'live locations', get: (c, r) => c[r].locs },
          { key: 'vac', title: 'live vacancies', get: (c, r) => c[r].vac },
        ];
        return blocks.map(b => (
          <div className="card" key={role + b.key}>
            <div className="card-head">
              <div className="card-title">{role}: {b.title}</div>
              <div style={{ flex: 1 }} />
              <div className="trend-key" title="Each day is shaded against the day before. The first column is shaded against the plan.">
                <span><i style={{ background: 'rgba(198,40,40,0.85)' }} />closed</span>
                <span><i style={{ background: 'rgba(198,40,40,0.28)' }} />down</span>
                <span><i style={{ background: '#fff', border: '1px solid var(--line-c)' }} />no change</span>
                <span><i style={{ background: 'rgba(27,110,60,0.28)' }} />up</span>
                <span><i style={{ background: 'rgba(27,110,60,0.85)' }} />opened</span>
              </div>
            </div>
            <div className="card-body" style={{ padding: 0 }}>
              <div className="grid-scroll">
                <table className="pri-grid trend">
                  <thead>
                    <tr>
                      <th className="stick">Region</th>
                      <th className="plan-col">Plan</th>
                      {dates.map(d => <th key={d}>{fmtDay(d)}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {DATA.regions_ordered.map(r => (
                      <tr key={r}>
                        <td className="stick loc">{r}</td>
                        <td className="plan-col mono">{b.get(planCut, r) || 0}</td>
                        {dates.map((d, i) => {
                          const v = b.get(cuts[d], r) || 0;
                          // The day before, or the plan for the first column.
                          const prev = i === 0 ? (b.get(planCut, r) || 0) : (b.get(cuts[dates[i - 1]], r) || 0);
                          const sh = trendShade(v, prev);
                          const against = i === 0 ? 'the plan' : fmtDay(dates[i - 1]);
                          return (
                            <td key={d} className="mono num"
                              title={sh ? (v + ' against ' + prev + ' on ' + against) : (v + ', unchanged from ' + against)}
                              style={sh ? { background: sh.bg, color: sh.fg, fontWeight: sh.strong ? 600 : 400 }
                                        : { color: v ? 'var(--ink)' : 'var(--ink-35)' }}>{v}</td>
                          );
                        })}
                      </tr>
                    ))}
                    <tr className="tot-row">
                      <td className="stick"><strong>Total</strong></td>
                      <td className="plan-col mono">{DATA.regions_ordered.reduce((s, r) => s + b.get(planCut, r), 0)}</td>
                      {dates.map(d => (
                        <td key={d} className="mono num">{DATA.regions_ordered.reduce((s, r) => s + b.get(cuts[d], r), 0)}</td>
                      ))}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        ));
      })}
    </div>
  );
}

// Compare a month against another, on the numbers the priorities grid holds.
function MonthOnMonth({ ws, month, role }) {
  const withData = Object.keys(ws.months || {})
    .filter(m => {
      const p = priorityFor(m, ws.months[m]);
      return (p.dates || []).length > 0 && (((p.roles || {})[role] || {}).rows || []).length > 0;
    }).sort();
  const [a, setA] = useState(withData[Math.max(0, withData.indexOf(month) - 1)] || withData[0]);
  const [b, setB] = useState(month);

  if (withData.length < 2) {
    return (
      <div className="card"><div className="card-body">
        <div className="help-text">
          Only {withData.length} month has {role} priorities in it. Paste another month's {role} tab and
          this fills in.
        </div>
      </div></div>
    );
  }

  const cut = (m) => {
    const pri = priorityFor(m, ws.months[m]);
    const dates = pri.dates || [];
    const last = dates[dates.length - 1];
    const out = {};
    DATA.regions_ordered.forEach(r => { out[r] = { locs: 0, vac: 0 }; });
    ((pri.roles || {})[role] || {}).rows?.forEach(row => {
      const n = row.v && row.v[last];
      if (!out[row.region] || !(n > 0)) return;
      out[row.region].locs += 1; out[row.region].vac += n;
    });
    return { cut: out, asAt: last };
  };
  const A = cut(a), B = cut(b);
  const label = m => (DATA.month_labels && DATA.month_labels[m]) || m;
  // Historic cost per application for the location, blended across roles by
  // how many roles are open there. That is what makes one month's mix of
  // locations more expensive than another's.
  const rate = (region) => {
    try {
      const c = regionBlendedCPA(region, role);
      if (c && c.cpa > 0) return c.cpa;
    } catch (e) { /* no data for this location and role */ }
    return null;
  };
  // Budget follows the roles, so a location holding a fifth of the roles gets
  // about a fifth of the money. The blended rate is therefore what all that
  // money buys: total spend over total applications, not an average of the
  // rates. Averaging the rates gives every location equal say regardless of
  // what its share of the budget buys, and reads about £3 high here.
  const blended = (c) => {
    let share = 0, apps = 0;
    DATA.regions_ordered.forEach(r => {
      const v = c[r].vac; if (!v) return;
      const cpa = rate(r); if (!cpa) return;
      share += v; apps += v / cpa;
    });
    return apps > 0 ? share / apps : null;
  };
  const bA = blended(A.cut), bB = blended(B.cut);
  const tot = c => DATA.regions_ordered.reduce((s, r) => s + c[r].vac, 0);
  const locs = c => DATA.regions_ordered.reduce((s, r) => s + c[r].locs, 0);

  return (
    <div>
      <div className="month-bar" style={{ padding: 0, border: 'none', background: 'none', marginBottom: 14 }}>
        <div className="mb-group">
          <label>Compare</label>
          <select value={a} onChange={e => setA(e.target.value)}>
            {withData.map(m => <option key={m} value={m}>{label(m)}</option>)}
          </select>
          <label>with</label>
          <select value={b} onChange={e => setB(e.target.value)}>
            {withData.map(m => <option key={m} value={m}>{label(m)}</option>)}
          </select>
        </div>
      </div>

      <div className="kpi-row" style={{ marginBottom: 18 }}>
        <div className="kpi kpi-accent-navy">
          <div className="kpi-label">Open roles</div>
          <div className="kpi-value mono">{tot(B.cut)}</div>
          <div className="kpi-sub">{tot(A.cut)} in {label(a)}, {tot(B.cut)} in {label(b)}</div>
        </div>
        <div className="kpi kpi-accent-navy">
          <div className="kpi-label">Live locations</div>
          <div className="kpi-value mono">{locs(B.cut)}</div>
          <div className="kpi-sub">{locs(A.cut)} in {label(a)}, {locs(B.cut)} in {label(b)}</div>
        </div>
        <div className={'kpi kpi-accent-' + (bA && bB && bB > bA ? 'orange' : 'good')}>
          <div className="kpi-label">Blended CPA of the mix</div>
          <div className="kpi-value mono">{bB ? fmtGBP(bB) : '-'}</div>
          <div className="kpi-sub">
            {bA ? fmtGBP(bA) : '-'} in {label(a)}, {bB ? fmtGBP(bB) : '-'} in {label(b)}.
            {' '}What the money buys across the mix, on historic rates, with budget following the roles.
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">By location</div>
          <div className="card-sub">
            {label(a)} as at {A.asAt ? fmtDay(A.asAt) : '-'} against {label(b)} as at {B.asAt ? fmtDay(B.asAt) : '-'}
          </div>
        </div>
        <div className="card-body" style={{ padding: 0 }}>
          <table className="alloc-table rv">
            <thead>
              <tr>
                <th>Location</th><th>Historic CPA</th>
                <th>{label(a)} roles</th><th>{label(b)} roles</th><th>Change</th>
                <th>{label(a)} share</th><th>{label(b)} share</th>
              </tr>
            </thead>
            <tbody>
              {DATA.regions_ordered.map(r => {
                const va = A.cut[r].vac, vb = B.cut[r].vac;
                if (!va && !vb) return null;
                const cpa = rate(r);
                const sa = tot(A.cut) > 0 ? va / tot(A.cut) : 0;
                const sb = tot(B.cut) > 0 ? vb / tot(B.cut) : 0;
                const d = vb - va;
                return (
                  <tr key={r}>
                    <td>{r}</td>
                    <td className="mono" style={{ color: (cpa && bB && cpa > bB) ? 'var(--bad)' : 'var(--ink)' }}>
                      {cpa ? fmtGBP(cpa) : '-'}
                    </td>
                    <td className="mono">{va}</td>
                    <td className="mono">{vb}</td>
                    <td className="mono" style={{ fontWeight: 600, color: d === 0 ? 'var(--ink-35)' : d > 0 ? 'var(--good)' : 'var(--bad)' }}>
                      {d === 0 ? '-' : (d > 0 ? '+' : '') + d}
                    </td>
                    <td className="mono">{Math.round(sa * 1000) / 10}%</td>
                    <td className="mono">{Math.round(sb * 1000) / 10}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="help-text" style={{ padding: '10px 16px' }}>
            Both months are taken at their last recorded day. Historic CPA is what that location has cost
            per application across the whole dataset, so the blended figure above says whether this month's
            spread of roles is a more expensive one to fill than last month's, before anything about how
            either month actually ran.
          </div>
        </div>
      </div>
    </div>
  );
}

function PrioritiesTool({ container, patchMonth, month, ws }) {
  const [role, setRole] = useState('SMR');
  const [view, setView] = useState('grid');
  const baseline = planBaselineFor(priorityFor(month, container), container, container.planBaselineId);
  const pri = priorityFor(month, container);
  const dates = pri.dates || [];
  const [from, setFrom] = useState(dates.length > 1 ? dates[dates.length - 2] : dates[0]);
  const [to, setTo] = useState(dates[dates.length - 1]);

  const setPri = (updater) => {
    const next = typeof updater === 'function' ? updater(pri) : updater;
    const latest = (next.dates || [])[(next.dates || []).length - 1];
    const demand = {};
    ROLES.forEach(role => {
      const cut = regionCut((next.roles[role] || {}).rows, latest);
      demand[role] = {};
      DATA.regions_ordered.forEach(r => { demand[role][r] = cut[r].vac; });
    });
    patchMonth({ priorities: next, demand });
  };

  const views = [['grid', 'Vacancies'], ['changed', 'What changed'],
                 ['trends', 'Trends'], ['mom', 'Month on month']];

  // An empty month used to return here, before the paste box rendered, so it
  // told you to paste and gave you nowhere to do it. Vacancies always renders;
  // only the views that need history are held back.
  const empty = dates.length === 0;
  if (empty && view !== 'grid' && view !== 'mom') {
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
          <div className="role-switch role-switch-lead">
            {ROLES.map(r => (
              <button key={r} className={r === role ? 'active' : ''} onClick={() => setRole(r)}>{r}</button>
            ))}
          </div>
          <div className="role-switch">
            {views.map(([id, label]) => (
              <button key={id} className={id === view ? 'active' : ''} onClick={() => setView(id)}>{label}</button>
            ))}
          </div>
        </div>
        <div className="card"><div className="card-body">
          <div className="help-text">
            No {role} data for {(DATA.month_labels && DATA.month_labels[month]) || month} yet.
            {' '}<a href="#" className="link-inline" onClick={e => { e.preventDefault(); setView('grid'); }}>Paste the {role} tab</a>
            {' '}to fill it in.
          </div>
        </div></div>
      </div>
    );
  }

  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          Paste the whole tab back in each day, for each role, straight from RAC's file. The whole month,
          not just the new day. Locations match on name, so the order doesn't matter.
          {' '}{baseline.kind === 'date'
            ? 'The Plan column is the open roles as at ' + fmtDay(baseline.date) + ', which is what ' + baseline.name + ' was built on.'
            : baseline.noDate
              ? 'The Plan column is RAC\u2019s own, because ' + baseline.name + ' has no date recorded against it.'
              : 'The Plan column is RAC\u2019s own. Pick a saved plan above to compare against what that plan was built on instead.'}
        </div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
        <div className="role-switch role-switch-lead">
          {ROLES.map(r => (
            <button key={r} className={r === role ? 'active' : ''} onClick={() => setRole(r)}>{r}</button>
          ))}
        </div>
        <div className="role-switch">
          {views.map(([id, label]) => (
            <button key={id} className={id === view ? 'active' : ''} onClick={() => setView(id)}>{label}</button>
          ))}
        </div>
        {(container.versions || []).length > 0 && view !== 'mom' && (
          <div className="mb-group">
            <label>Compare against</label>
            <select value={container.planBaselineId || ''}
              onChange={e => patchMonth({ planBaselineId: e.target.value || null })}>
              <option value="">RAC's plan column</option>
              {(container.versions || []).map(v => (
                <option key={v.id} value={v.id}>{v.name}</option>
              ))}
            </select>
          </div>
        )}
        {view === 'changed' && (
          <div className="mb-group">
            <label>Compare</label>
            <select value={from} onChange={e => setFrom(e.target.value)}>
              {dates.map(d => <option key={d} value={d}>{fmtDay(d)}</option>)}
            </select>
            <label>to</label>
            <select value={to} onChange={e => setTo(e.target.value)}>
              {dates.map(d => <option key={d} value={d}>{fmtDay(d)}</option>)}
            </select>
          </div>
        )}
      </div>

      {view === 'grid' && <PriorityGrid role={role} pri={pri} setPri={setPri} month={month} baseline={baseline} />}
      {view === 'changed' && <WhatChanged pri={pri} from={from} to={to} role={role} baseline={baseline} />}
      {view === 'trends' && <TrendsView pri={pri} role={role} baseline={baseline} />}
      {view === 'mom' && <MonthOnMonth ws={ws} month={month} role={role} />}
    </div>
  );
}

// ====================================================================
// PLATFORM PASTES
// Appcast and Indeed both encode everything in the campaign name, so the
// raw export off either platform can go in as it comes. No reshaping, no
// manual spend entry.
//
//   RAC | Conversion | Patrol Mechanics | London | Appcast | Nov 25 | 2936
//   RAC | Conversion | SMR Mechanics | Mobile Vehicle Tech - Derby | Indeed | ...
//
// Role sits at the third pipe, location at the fourth. The location is
// sometimes a region and sometimes a job title ending in a city, so it gets
// resolved against the location map and then against whatever the
// priorities grid already knows.
// ====================================================================

// A CSV line splitter that respects quotes, because Indeed quotes every
// field and Appcast writes thousands as "1,400".
function splitCsvLine(line, delim) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === delim && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

// Work out the delimiter once from the header, then hold to it. Copying out
// of Excel gives tabs with unquoted thousands separators, so treating comma
// as a delimiter too would split 1,395.67 in half and shift every column
// after it along the row.
function sniffDelimiter(headerLine) {
  return headerLine.indexOf('\t') >= 0 ? '\t' : ',';
}

const toNum = v => {
  const t = String(v == null ? '' : v).replace(/[^0-9.\-]/g, '');
  const n = parseFloat(t);
  return isFinite(n) ? n : 0;
};

// e.g. "... | Jul 26 | 3037" or "... | Aug 25 | 2936 | Leads" -> 3037, 2936
function campaignProject(camp) {
  const codes = String(camp || '').split('|').map(x => x.trim()).filter(x => /^\d{4}$/.test(x));
  return codes.length ? codes[codes.length - 1] : null;
}

function campaignRole(seg) {
  const s = String(seg || '').toLowerCase();
  if (s.includes('smr')) return 'SMR';
  if (s.includes('patrol')) return 'Patrol';
  return null;
}

// Resolve a campaign's location segment to one of the twelve regions.
// Tries the region names, then the location map, then the city after a
// dash, then anything the pasted priorities grid knows.
function campaignRegion(seg, priRows) {
  if (!seg) return null;
  const direct = priorityRegion(seg);
  if (direct) return direct;
  const norm = s => String(s).toLowerCase().replace(/[^a-z]/g, '');
  const map = DATA.location_map || {};
  const tryKey = (s) => {
    const k = norm(s);
    if (!k) return null;
    const asRegion = priorityRegion(s);   // the tail can be a region, not a city
    if (asRegion) return asRegion;
    if (map[k]) return priorityRegion(map[k]) || map[k];
    if (priRows) {
      const hit = priRows.find(r => norm(r.location) === k ||
        norm(String(r.location).split(' - ').pop()) === k);
      if (hit) return hit.region;
    }
    return null;
  };
  return tryKey(seg) || (String(seg).includes(' - ') ? tryKey(String(seg).split(' - ').pop()) : null);
}

// Read a raw platform export. Works out which platform it is from the
// headers, so you paste and it just knows.
function parsePlatformPaste(text, priRows) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { error: 'Paste the export including its header row.' };
  const delim = sniffDelimiter(lines[0]);
  const rows = lines.map(l => splitCsvLine(l, delim));
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ''));
  const find = (...names) => {
    for (const n of names) {
      const k = n.toLowerCase().replace(/[^a-z]/g, '');
      const i = head.indexOf(k);
      if (i >= 0) return i;
    }
    return -1;
  };
  const iCamp = find('Campaign');
  if (iCamp < 0) return { error: 'I could not find a Campaign column. Paste the export with its header row.' };

  // Indeed carries Total cost; Appcast carries Spend and Total Applies.
  const iTotalCost = find('Total cost');
  const iSpend = find('Spend');
  const iApplies = find('Total Applies', 'Paid Applies');
  const iDate = find('Date');
  let platform, iMoney, iApps, fromCampaign = false;
  if (iTotalCost >= 0) {
    platform = 'indeed'; iMoney = iTotalCost; iApps = -1;   // Indeed apps come from Eploy
  } else if (iDate >= 0 && iSpend >= 0) {
    // A Windsor export: one row per campaign per day. Which platform each
    // row belongs to is in the campaign name, not the file, so it is read
    // per row rather than set once. The live feed carries applications; a
    // hand-made export may not.
    platform = null; iMoney = iSpend; iApps = find('Apps', 'Applications'); fromCampaign = true;
  } else if (iSpend >= 0) {
    platform = 'appcast'; iMoney = iSpend; iApps = iApplies;
  } else {
    return { error: 'I could not tell which platform this is. I look for a Total cost column for Indeed, Spend for Appcast, or Date plus Spend for a Windsor export.' };
  }

  const cells = {}, unmatched = [], platforms = {}, planProjects = {};
  let matchedSpend = 0, unmatchedSpend = 0, matchedApps = 0, n = 0;
  const each = (i) => {
    const r = rows[i];
    const camp = r[iCamp]; if (!camp) return;
    const spend = toNum(r[iMoney]);
    const apps = iApps >= 0 ? toNum(r[iApps]) : 0;
    if (!spend && !apps) return;
    n++;
    const parts = camp.split('|').map(x => x.trim());
    const role = campaignRole(parts[2]);
    const region = campaignRegion(parts[3], priRows);
    let plat = platform;
    if (fromCampaign) {
      plat = CAMPAIGN_PLATFORM[String(parts[4] || '').trim().toLowerCase()] || null;
      if (!plat) {
        // Demand Gen, display remarketing and anything else unrecognised are
        // non-standard, so they stay out of the plan comparison.
        unmatchedSpend += spend;
        unmatched.push({ campaign: camp.slice(0, 78), spend, project: campaignProject(camp),
          why: 'not a planned platform (' + (parts[4] || 'no platform in the name') + ')' });
        return;
      }
    }
    if (!role || !region) {
      unmatchedSpend += spend;
      unmatched.push({ campaign: camp.slice(0, 78), spend, project: campaignProject(camp),
        why: !role ? 'role not SMR or Patrol' : 'location not recognised' });
      return;
    }
    const key = role + '|' + region + '|' + plat;
    cells[key] = cells[key] || { role, region, platform: plat, spend: 0, apps: 0 };
    platforms[plat] = true;
    cells[key].spend += spend; cells[key].apps += apps;
    matchedSpend += spend; matchedApps += apps;
    const proj = campaignProject(camp);
    if (proj) planProjects[proj] = true;
  };
  for (let i = 1; i < rows.length; i++) each(i);
  // Split what was left out: money on this plan's projects, against money on
  // a different piece of work entirely.
  let otherProjectSpend = 0, nonStandardSpend = 0;
  unmatched.forEach(u => {
    u.otherProject = !!(u.project && !planProjects[u.project]);
    if (u.otherProject) otherProjectSpend += u.spend; else nonStandardSpend += u.spend;
  });
  if (!n) return { error: 'No rows with any spend in that paste.' };
  const found = Object.keys(platforms);
  return { platform: fromCampaign ? found : platform, cells, unmatched,
           matchedSpend, unmatchedSpend, matchedApps, rows: n,
           nonStandardSpend, otherProjectSpend, planProjects: Object.keys(planProjects),
           appsIncluded: iApps >= 0, multi: fromCampaign };
}

// ---- pacing maths ----

// Where the plan said we would be by now. Straight-line: a plan is a month
// of intent spread evenly, and anything cleverer needs a reason.
function paceStatus(ratio, kind) {
  if (ratio == null || !isFinite(ratio)) return { label: '-', kind: 'none' };
  const apps = kind === 'apps';
  const words = apps
    ? ['Well behind', 'Behind', 'On pace', 'Ahead', 'Well ahead']
    : ['Under spending', 'Under pacing', 'On pace', 'Over pacing', 'Over spending'];
  // On spend, drifting either way is worth a look. On applications, more is
  // simply better, so ahead reads green rather than being flagged as a miss.
  const kinds = apps
    ? ['bad', 'warn', 'good', 'good', 'good']
    : ['bad', 'warn', 'good', 'warn', 'bad'];
  const i = ratio < 0.85 ? 0 : ratio < 0.90 ? 1 : ratio <= 1.10 ? 2 : ratio <= 1.15 ? 3 : 4;
  return { label: words[i], kind: kinds[i] };
}

// The plan baseline, as Role x Region x Platform rows. Read from whichever
// plan is loaded, so pacing measures against the plan you actually issued.
function planBaseline(month, container, version) {
  const state = version
    ? composePlannerState(month, { ...container, working: version.planner }, version.demand)
    : composePlannerState(month, container);
  const rows = [];
  ROLES.forEach(role => {
    const plan = buildFundingPlan(role, { ...planParams(role, state), appTarget: state.appTarget[role] || 0 });
    PLATFORMS.forEach(plat => {
      ((plan.regionChannel && plan.regionChannel[plat]) || []).forEach(r => {
        if (!(r.spend > 0) && !(r.predApps > 0)) return;
        rows.push({ role, region: r.region, platform: plat, planSpend: r.spend, planApps: r.predApps });
      });
    });
  });
  return rows;
}

// Actuals for one month out of the master sheet. Regional rows are SMR and
// Patrol on the four modelled platforms, tagged to a location. Everything
// else is counted separately for the total view rather than thrown away.
function digestActuals(rows, month) {
  if (!rows || rows.length < 2) return { error: 'No rows found in that file.' };
  const head = rows[0].map(normHeader);
  const col = (...names) => { for (const n of names) { const i = head.indexOf(normHeader(n)); if (i >= 0) return i; } return -1; };
  const iDate = col('Date'), iPlat = col('Platform'), iArea = col('Area'),
        iReg = col('Region'), iSpend = col('Ad Spend'), iApps = col('Blended Apply Completes');
  if ([iDate, iPlat, iArea, iReg, iSpend, iApps].some(i => i < 0)) {
    return { error: 'That sheet is missing columns. It should be the Raw Data Export tab of the master sheet.' };
  }
  const regional = {}, other = {};
  let lastDay = 0, totalSpend = 0, totalApps = 0;
  let nonStdSpend = 0, nonStdApps = 0, untaggedSpend = 0, untaggedApps = 0, monthRows = 0;

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r]; if (!row || !row.length) continue;
    const day = sheetDay(row[iDate]);
    if (!day) continue;
    const mo = day.y + '-' + String(day.m).padStart(2, '0');
    if (mo !== month) continue;
    monthRows++;
    lastDay = Math.max(lastDay, day.d);

    const spend = Number(row[iSpend]) || 0, apps = Number(row[iApps]) || 0;
    totalSpend += spend; totalApps += apps;
    const platRaw = String(row[iPlat] || '').trim();
    const plat = UPDATE_PLATMAP[platRaw.toLowerCase()];
    const role = String(row[iArea] || '').trim();
    const region = priorityRegion(row[iReg]);

    if (!plat || (role !== 'SMR' && role !== 'Patrol')) {
      nonStdSpend += spend; nonStdApps += apps;
      const k = platRaw || 'Unknown';
      other[k] = other[k] || { spend: 0, apps: 0 };
      other[k].spend += spend; other[k].apps += apps;
      continue;
    }
    if (!region) {
      untaggedSpend += spend; untaggedApps += apps;
      const k = platRaw + ' (not tagged to a location)';
      other[k] = other[k] || { spend: 0, apps: 0 };
      other[k].spend += spend; other[k].apps += apps;
      continue;
    }
    const key = role + '|' + region + '|' + plat;
    regional[key] = regional[key] || { role, region, platform: plat, spend: 0, apps: 0 };
    regional[key].spend += spend; regional[key].apps += apps;
  }
  if (!monthRows) return { error: 'No rows for ' + ((DATA.month_labels && DATA.month_labels[month]) || month) + ' in that file.' };
  return { regional, other, lastDay, totalSpend, totalApps, nonStdSpend, nonStdApps, untaggedSpend, untaggedApps, monthRows };
}

// Platform pastes replace the master sheet's figures for that platform.
// The paste is straight off the platform, so where the two disagree the
// platform is the better source.
function mergeActuals(base, pastes, asAtDay) {
  if (base && base.error) return base;
  const hasPaste = Object.keys(pastes || {}).some(k => pastes[k] && !pastes[k].error);
  if (!base && !hasPaste) return null;
  // With no master sheet, the pastes are the whole picture. Start from
  // nothing and let them fill it in.
  const start = base || { regional: {}, other: {}, lastDay: 0, totalSpend: 0, totalApps: 0, monthRows: 0 };
  const out = { ...start, regional: { ...start.regional }, other: { ...start.other }, sources: {} };
  if (!base) out.lastDay = asAtDay || 0;
  Object.keys(pastes || {}).forEach(plat => {
    const p = pastes[plat]; if (!p || p.error) return;
    let removedSpend = 0, removedApps = 0;
    Object.keys(out.regional).forEach(k => {
      if (out.regional[k].platform !== plat) return;
      removedSpend += out.regional[k].spend; removedApps += out.regional[k].apps;
      delete out.regional[k];
    });
    let addedSpend = 0, addedApps = 0;
    Object.values(p.cells).forEach(c => {
      const k = c.role + '|' + c.region + '|' + plat;
      // Indeed's export carries no applications, so keep the ones the
      // master sheet had from Eploy rather than zeroing them.
      const keepApps = p.appsIncluded ? c.apps : ((start.regional[k] || {}).apps || 0);
      out.regional[k] = { role: c.role, region: c.region, platform: plat, spend: c.spend, apps: keepApps };
      addedSpend += c.spend; addedApps += keepApps;
    });
    // Another project's spend is not RAC recruitment money and is dropped
    // outright. Non-standard is this plan's money, so it stays in the total.
    out.totalSpend = out.totalSpend - removedSpend + addedSpend + (p.nonStandardSpend || 0);
    out.otherProjectSpend = (out.otherProjectSpend || 0) + (p.otherProjectSpend || 0);
    if (p.appsIncluded) out.totalApps = out.totalApps - removedApps + addedApps;
    if (p.nonStandardSpend > 0) {
      out.other[PLATFORM_LABELS[plat] + ' non-standard'] = { spend: p.nonStandardSpend, apps: 0 };
    }
    out.sources[plat] = { matched: p.matchedSpend, unmatched: p.unmatchedSpend, cells: Object.keys(p.cells).length, appsIncluded: p.appsIncluded };
  });
  return out;
}

// Join plan to actuals and work out the pace on each line.
function buildPacing(month, container, actuals, version) {
  const days = (DATA.days_in_month && DATA.days_in_month[month]) || 30;
  const elapsed = Math.min(days, actuals.lastDay || days);
  const pace = elapsed / days;
  const plan = planBaseline(month, container, version);
  const seen = {};
  const rows = plan.map(p => {
    const key = p.role + '|' + p.region + '|' + p.platform;
    seen[key] = true;
    const a = actuals.regional[key] || { spend: 0, apps: 0 };
    const expSpend = p.planSpend * pace, expApps = p.planApps * pace;
    return {
      ...p, actualSpend: a.spend, actualApps: a.apps,
      expSpend, expApps,
      spendRatio: expSpend > 0 ? a.spend / expSpend : null,
      appsRatio: expApps > 0 ? a.apps / expApps : null,
      cpa: a.apps > 0 ? a.spend / a.apps : null,
    };
  });
  // Spend that landed somewhere the plan did not fund.
  Object.keys(actuals.regional).forEach(k => {
    if (seen[k]) return;
    const a = actuals.regional[k];
    rows.push({ role: a.role, region: a.region, platform: a.platform,
      planSpend: 0, planApps: 0, actualSpend: a.spend, actualApps: a.apps,
      expSpend: 0, expApps: 0, spendRatio: null, appsRatio: null,
      cpa: a.apps > 0 ? a.spend / a.apps : null, unplanned: true });
  });
  return { rows, days, elapsed, pace };
}

function agg(rows, keyFn) {
  const out = {};
  rows.forEach(r => {
    const k = keyFn(r);
    const o = out[k] = out[k] || { key: k, planSpend: 0, actualSpend: 0, expSpend: 0, planApps: 0, actualApps: 0, expApps: 0 };
    o.planSpend += r.planSpend; o.actualSpend += r.actualSpend; o.expSpend += r.expSpend;
    o.planApps += r.planApps; o.actualApps += r.actualApps; o.expApps += r.expApps;
  });
  Object.values(out).forEach(o => {
    o.spendRatio = o.expSpend > 0 ? o.actualSpend / o.expSpend : null;
    o.appsRatio = o.expApps > 0 ? o.actualApps / o.expApps : null;
    o.cpa = o.actualApps > 0 ? o.actualSpend / o.actualApps : null;
    o.planCpa = o.planApps > 0 ? o.planSpend / o.planApps : null;
  });
  return Object.values(out);
}

function PaceCell({ ratio, kind }) {
  const s = paceStatus(ratio, kind);
  return (
    <>
      <td className="mono">{ratio == null ? '-' : Math.round(ratio * 100) + '%'}</td>
      <td><Pill kind={s.kind === 'none' ? undefined : s.kind}>{s.label}</Pill></td>
    </>
  );
}

// PACING
// Region view lives here, because it is a plan-against-reality question
// rather than a record of what RAC sent. The rest of pacing comes next.
// ====================================================================
function RegionView({ pri, from, to, month, container, setPri }) {
  const th = pri.thresholds || {};
  // Budget per location comes from the plan itself now, rather than being
  // typed in a second time. One number, one home, same as the demand.
  const planBudgets = useMemo(() => {
    const out = {};
    ROLES.forEach(r => { out[r] = {}; });
    try {
      planBaseline(month, container).forEach(p => {
        out[p.role][p.region] = (out[p.role][p.region] || 0) + p.planSpend;
      });
    } catch (e) { /* no plan yet, fall back below */ }
    return out;
  }, [month, container]);
  return (
    <div>
      {ROLES.map(role => {
        const rows = (pri.roles[role] || {}).rows || [];
        const plan = regionCut(rows, 'plan');
        const a = regionCut(rows, from), b = regionCut(rows, to);
        const fromPlan = planBudgets[role] || {};
        const budgets = Object.keys(fromPlan).length ? fromPlan : ((pri.budgets || {})[role] || {});
        let tB = 0, tPL = 0, tA = 0, tR = 0;
        const body = DATA.regions_ordered.map(reg => {
          const budget = budgets[reg] || 0;
          const planLocs = plan[reg].locs;
          const planPer = planLocs > 0 ? budget / planLocs : null;
          const nowPer = b[reg].locs > 0 ? budget / b[reg].locs : null;
          const adds = Math.max(0, b[reg].locs - a[reg].locs);
          const removes = Math.max(0, a[reg].locs - b[reg].locs);
          const chg = (planPer && nowPer) ? (nowPer - planPer) / planPer : null;
          tB += budget; tPL += planLocs; tA += adds; tR += removes;
          return { reg, budget, planLocs, planPer, from: a[reg].locs, to: b[reg].locs, adds, removes, nowPer, chg };
        });
        return (
          <div className="card" key={role}>
            <div className="card-head">
              <div className="card-title">{role === 'SMR' ? 'Mobile Vehicle Tech (SMR)' : 'Roadside Tech (Patrol, incl. SuperFlex)'}</div>
              <div className="card-sub">
                {fmtDay(from)} to {fmtDay(to)}
                {Object.keys(fromPlan).length ? ' \u00B7 budget read from the plan' : ' \u00B7 no plan, using typed budgets'}
              </div>
            </div>
            <div className="card-body" style={{ padding: 0 }}>
              <table className="alloc-table rv">
                <thead>
                  <tr>
                    <th>Region</th><th>Budget</th><th>Plan locs</th><th>Plan £/loc</th>
                    <th>From</th><th>To</th><th>Adds</th><th>Removes</th><th>Net</th>
                    <th>Current £/loc</th><th>vs plan</th><th>Risk</th>
                  </tr>
                </thead>
                <tbody>
                  {body.map(r => {
                    const risk = riskOf(r.chg, th);
                    const net = r.to - r.from;
                    return (
                      <tr key={r.reg}>
                        <td>{r.reg}</td>
                        <td className="mono">{r.budget ? fmtGBP(r.budget) : '-'}</td>
                        <td className="mono">{r.planLocs}</td>
                        <td className="mono">{r.planPer ? fmtGBP(r.planPer) : '-'}</td>
                        <td className="mono">{r.from}</td>
                        <td className="mono">{r.to}</td>
                        <td className="mono" style={{ color: r.adds ? 'var(--good)' : 'var(--ink-35)' }}>{r.adds || '-'}</td>
                        <td className="mono" style={{ color: r.removes ? 'var(--bad)' : 'var(--ink-35)' }}>{r.removes || '-'}</td>
                        <td className="mono">{net > 0 ? '+' + net : net || '-'}</td>
                        <td className="mono">{r.nowPer ? fmtGBP(r.nowPer) : '-'}</td>
                        <td className="mono" style={{ color: r.chg == null ? 'var(--ink-35)' : r.chg < 0 ? 'var(--bad)' : 'var(--good)' }}>
                          {r.chg == null ? '-' : (r.chg > 0 ? '+' : '') + Math.round(r.chg * 100) + '%'}
                        </td>
                        <td><Pill kind={risk.kind === 'none' ? undefined : risk.kind}>{risk.label}</Pill></td>
                      </tr>
                    );
                  })}
                  <tr className="tot-row">
                    <td><strong>Total</strong></td>
                    <td className="mono"><strong>{fmtGBP(tB)}</strong></td>
                    <td className="mono"><strong>{tPL}</strong></td>
                    <td /><td /><td />
                    <td className="mono"><strong>{tA}</strong></td>
                    <td className="mono"><strong>{tR}</strong></td>
                    <td /><td /><td /><td />
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PriorityInputs({ pri, setPri }) {
  const setBudget = (role, reg, v) => setPri(p => ({
    ...p, budgets: { ...p.budgets, [role]: { ...((p.budgets || {})[role] || {}), [reg]: v } },
  }));
  const setTh = (k, v) => setPri(p => ({ ...p, thresholds: { ...(p.thresholds || {}), [k]: v } }));
  const th = pri.thresholds || {};
  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>Plan budget per region, read by Region view.</div>
      </div>
      {ROLES.map(role => (
        <div className="card" key={role}>
          <div className="card-head">
            <div className="card-title">{role} plan budget</div>
            <div className="card-sub">
              {fmtGBP(DATA.regions_ordered.reduce((s, r) => s + (((pri.budgets || {})[role] || {})[r] || 0), 0))} total
            </div>
          </div>
          <div className="card-body">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
              {DATA.regions_ordered.map(r => (
                <div key={r}>
                  <label className="field-label">{r}</label>
                  <input className="text-input"
                    value={'\u00A3' + (((pri.budgets || {})[role] || {})[r] || 0).toLocaleString('en-GB')}
                    onChange={e => setBudget(role, r, parseInt(e.target.value.replace(/[^0-9]/g, ''), 10) || 0)} />
                </div>
              ))}
            </div>
          </div>
        </div>
      ))}
      <div className="card">
        <div className="card-head">
          <div className="card-title">Risk thresholds</div>
          
        </div>
        <div className="card-body">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
            {[['caution', 'Caution at'], ['dilution', 'High dilution at'], ['concentrated', 'Concentrated at']].map(([k, label]) => (
              <div key={k}>
                <label className="field-label">{label}</label>
                <input className="text-input" value={Math.round((th[k] ?? 0) * 100) + '%'}
                  onChange={e => {
                    const raw = e.target.value.replace(/[^0-9-]/g, '');
                    setTh(k, raw === '' || raw === '-' ? 0 : parseInt(raw, 10) / 100);
                  }} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// Excel out. This is the thing that gets fed back in to write the weekly
// and monthly reports, so it is flat, labelled, and carries the workings
// rather than only the verdicts.
function exportPacingXLSX(month, pacing, actuals, planName) {
  if (!window.XLSX) { alert('The spreadsheet writer did not load. Check the connection and reload.'); return; }
  const label = (DATA.month_labels && DATA.month_labels[month]) || month;
  const X = window.XLSX;
  const wb = X.utils.book_new();
  const n2 = n => Math.round((n || 0) * 100) / 100;
  const n1 = n => Math.round((n || 0) * 10) / 10;
  const pc = r => (r == null || !isFinite(r) ? '' : Math.round(r * 1000) / 10);
  const pace = pacing.pace || 1;

  // One row shape everywhere, so any cut reads the same way and can be
  // pivoted or pasted without rework.
  const HEAD = ['Plan spend', 'Actual spend', 'Expected spend to date', 'Spend vs expected %', 'Spend status',
                'Spend left in plan', 'Projected spend at this rate',
                'Plan apps', 'Actual apps', 'Expected apps to date', 'Apps vs expected %', 'Apps status',
                'Apps left to target', 'Projected apps at this rate',
                'Plan CPA', 'Actual CPA'];
  const line = r => [
    n2(r.planSpend), n2(r.actualSpend), n2(r.expSpend), pc(r.spendRatio), paceStatus(r.spendRatio, 'spend').label,
    n2(r.planSpend - r.actualSpend), n2(pace > 0 ? r.actualSpend / pace : 0),
    n1(r.planApps), n1(r.actualApps), n1(r.expApps), pc(r.appsRatio), paceStatus(r.appsRatio, 'apps').label,
    n1(r.planApps - r.actualApps), n1(pace > 0 ? r.actualApps / pace : 0),
    r.planApps > 0 ? n2(r.planSpend / r.planApps) : '', r.actualApps > 0 ? n2(r.actualSpend / r.actualApps) : '',
  ];

  // Build a sheet from a grouping. `cols` names the key parts.
  const sheet = (name, cols, keyFn, sortFn) => {
    const rows = agg(pacing.rows, keyFn);
    const out = [[...cols, ...HEAD]];
    rows.sort(sortFn || ((a, b) => a.key.localeCompare(b.key))).forEach(r => {
      const parts = r.key.split('|').map(x => PLATFORMS.includes(x) ? PLATFORM_LABELS[x] : x);
      out.push([...parts, ...line(r)]);
    });
    const tot = agg(pacing.rows, () => 'Total')[0];
    if (tot) out.push([...cols.map((c, i) => i === 0 ? 'Total' : ''), ...line(tot)]);
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(out), name);
  };

  // --- Summary ---
  const roleRows = agg(pacing.rows, r => r.role);
  const tot = agg(pacing.rows, () => 'All')[0] || {};
  const sum = [
    ['RAC pacing', label],
    ['Plan measured against', planName || ''],
    ['Days in month', pacing.days],
    ['Days elapsed', pacing.elapsed],
    ['Through the month %', Math.round(pace * 1000) / 10],
    [],
    ['Scope', 'SMR and Patrol, tagged to a location, on Indeed / Meta / Google Search / Appcast. That is what the plan funds.'],
    ['Note', 'Expected is the plan spread evenly across the month. Projected is what the current rate lands on by month end.'],
    [],
    ['Role', ...HEAD],
  ];
  [...roleRows, { ...tot, key: 'Total' }].forEach(r => sum.push([r.key, ...line(r)]));
  sum.push([]);
  sum.push(['Total activity including non-standard']);
  sum.push(['Line', 'Spend', 'Applications', 'Share of spend %']);
  sum.push(['In plan: SMR and Patrol by location', n2(tot.actualSpend), n1(tot.actualApps),
            Math.round(1000 * (tot.actualSpend || 0) / (actuals.totalSpend || 1)) / 10]);
  Object.keys(actuals.other).sort((a, b) => actuals.other[b].spend - actuals.other[a].spend).forEach(k =>
    sum.push([k, n2(actuals.other[k].spend), n1(actuals.other[k].apps),
              Math.round(1000 * actuals.other[k].spend / (actuals.totalSpend || 1)) / 10]));
  sum.push(['Total', n2(actuals.totalSpend), n1(actuals.totalApps), 100]);
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(sum), 'Summary');

  sheet('Role x platform', ['Role', 'Platform'], r => r.role + '|' + r.platform);
  sheet('Role x region', ['Role', 'Region'], r => r.role + '|' + r.region);
  sheet('Role x region x platform', ['Role', 'Region', 'Platform'], r => r.role + '|' + r.region + '|' + r.platform);
  sheet('By region', ['Region'], r => r.region);
  sheet('By platform', ['Platform'], r => r.platform);

  // Per role, a region by platform grid of spend and of applications, which
  // is the shape most of the reporting ends up in.
  ROLES.forEach(role => {
    const rows = pacing.rows.filter(r => r.role === role);
    const grid = [[role + ': actual spend by location and platform', ...PLATFORMS.map(p => PLATFORM_LABELS[p]), 'Total']];
    const pick = (reg, plat, f) => rows.filter(r => r.region === reg && r.platform === plat).reduce((a, r) => a + r[f], 0);
    DATA.regions_ordered.forEach(reg => {
      const vals = PLATFORMS.map(p => n2(pick(reg, p, 'actualSpend')));
      grid.push([reg, ...vals, n2(vals.reduce((a, b) => a + b, 0))]);
    });
    grid.push([]);
    grid.push([role + ': actual applications by location and platform', ...PLATFORMS.map(p => PLATFORM_LABELS[p]), 'Total']);
    DATA.regions_ordered.forEach(reg => {
      const vals = PLATFORMS.map(p => n1(pick(reg, p, 'actualApps')));
      grid.push([reg, ...vals, n1(vals.reduce((a, b) => a + b, 0))]);
    });
    grid.push([]);
    grid.push([role + ': spend vs expected %, by location and platform', ...PLATFORMS.map(p => PLATFORM_LABELS[p])]);
    DATA.regions_ordered.forEach(reg => {
      grid.push([reg, ...PLATFORMS.map(p => {
        const e = pick(reg, p, 'expSpend'), a = pick(reg, p, 'actualSpend');
        return e > 0 ? Math.round(1000 * a / e) / 10 : '';
      })]);
    });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(grid), role + ' grid');
  });

  // Every line, unaggregated, for anything the sheets above do not answer.
  const raw = [['Role', 'Region', 'Platform', 'In plan', ...HEAD]];
  pacing.rows.slice()
    .sort((a, b) => a.role.localeCompare(b.role) || a.region.localeCompare(b.region) || a.platform.localeCompare(b.platform))
    .forEach(r => raw.push([r.role, r.region, PLATFORM_LABELS[r.platform],
      r.unplanned ? 'No, not funded in plan' : 'Yes', ...line(r)]));
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(raw), 'All lines');

  X.writeFile(wb, 'RAC_pacing_' + month + '.xlsx');
}


// ====================================================================
// WHY
// A gap in applications has two causes and they can be told apart.
// Applications are spend divided by cost per application, so:
//
//   short because we spent less than planned  = (actual spend - expected
//                                                spend) / plan CPA
//   short because each one cost more          = actual apps - actual spend
//                                                / plan CPA
//
// The two add up to the gap exactly, no residual and nothing hand-waved.
// Worked out per location and platform then rolled up, so the answer holds
// at whatever level it is read.
// ====================================================================
// Historic cost per application for a cell, from the benchmark dataset.
// Used for every location including ones the plan never funded, so a
// location that only exists in the actuals still has a rate to be priced at.
// The plan's own rate wherever the plan funded a location: that is what it
// was costed at, and using anything else stops the three causes adding up to
// the gap. The benchmark is only needed for locations the plan never funded,
// which have no rate of their own.
function historicCpa(r, fallback) {
  if (r.planApps > 0 && r.planSpend > 0) return r.planSpend / r.planApps;
  try {
    const c = regionPlatformCPA(r.platform, r.region, r.role);
    if (c && c.cpa > 0) return c.cpa;
  } catch (e) { /* fall through */ }
  return fallback || null;
}

function explainGap(rows) {
  const t = { gap: 0, expApps: 0, actualApps: 0, expSpend: 0, actualSpend: 0, planSpend: 0, planApps: 0 };
  rows.forEach(r => {
    t.expApps += r.expApps; t.actualApps += r.actualApps;
    t.expSpend += r.expSpend; t.actualSpend += r.actualSpend;
    t.planSpend += r.planSpend; t.planApps += r.planApps;
  });
  t.gap = t.actualApps - t.expApps;

  // The plan's blended rate. Everything is priced against this.
  const planBlended = t.planApps > 0 ? t.planSpend / t.planApps : null;
  t.planBlendedCpa = planBlended;

  const out = rows.map(r => {
    const h = historicCpa(r, planBlended);
    return { ...r, planCpa: h, offPlan: !(r.planSpend > 0) && (r.actualSpend > 0 || r.actualApps > 0) };
  });

  // Three causes, no fourth. Money that went somewhere the plan gave nothing
  // is a shift in the mix like any other: it came out of the locations the
  // plan did fund, so it is priced the same way rather than counted as free.
  const atOwnRates = out.reduce((a, r) => a + (r.planCpa ? r.actualSpend / r.planCpa : 0), 0);
  t.moneyEffect = planBlended ? (t.actualSpend - t.expSpend) / planBlended : 0;
  t.mixEffect = planBlended ? atOwnRates - (t.actualSpend / planBlended) : 0;
  t.rateEffect = t.actualApps - atOwnRates;
  t.mixCpa = atOwnRates > 0 ? t.actualSpend / atOwnRates : null;
  t.unplanned = 0;
  t.unplannedSpend = out.filter(r => r.offPlan).reduce((a, r) => a + r.actualSpend, 0);
  t.offPlanRegions = [...new Set(out.filter(r => r.offPlan).map(r => r.region))];

  out.forEach(r => {
    r.planShare = t.planSpend > 0 ? r.planSpend / t.planSpend : 0;
    r.actualShare = t.actualSpend > 0 ? r.actualSpend / t.actualSpend : 0;
    r.shareShift = r.actualShare - r.planShare;
    // Price only the shift: money held over or under the planned share, at
    // this location's own historic rate against the plan's blended one.
    const wouldHave = t.actualSpend * r.planShare;
    r.mixContrib = (planBlended && r.planCpa)
      ? (r.actualSpend - wouldHave) * (1 / r.planCpa - 1 / planBlended)
      : 0;
    // Kept for the per-location table below.
    r.spendEffect = r.planCpa ? (r.actualSpend - r.expSpend) / r.planCpa : 0;
    r.effEffect = r.planCpa ? r.actualApps - (r.actualSpend / r.planCpa) : 0;
    r.gap = r.actualApps - r.expApps;
  });

  // Where the rate miss sits. Only what the numbers support: which platform
  // and which locations, and whether it is one platform misbehaving or all
  // of them. Nothing about why.
  const byPlat = {};
  out.forEach(r => {
    if (!r.planCpa || (!r.actualSpend && !r.actualApps)) return;
    const o = byPlat[r.platform] = byPlat[r.platform] ||
      { platform: r.platform, effect: 0, spend: 0, apps: 0, atRate: 0, worse: 0, cells: 0 };
    o.effect += r.effEffect; o.spend += r.actualSpend; o.apps += r.actualApps;
    o.atRate += r.actualSpend / r.planCpa;
    if (r.actualSpend > 0) {
      o.cells += 1;
      const actual = r.actualApps > 0 ? r.actualSpend / r.actualApps : Infinity;
      if (actual > r.planCpa) o.worse += 1;
    }
  });
  t.rateByPlatform = Object.values(byPlat).map(o => ({
    ...o,
    actualCpa: o.apps > 0 ? o.spend / o.apps : null,
    planCpa: o.atRate > 0 ? o.spend / o.atRate : null,
  })).sort((a, b) => a.effect - b.effect);

  // One platform carrying most of it, or spread across the board.
  const losers = t.rateByPlatform.filter(x => x.effect < 0);
  const totalLoss = losers.reduce((a, x) => a + x.effect, 0);
  t.rateConcentrated = losers.length && totalLoss < 0 && (losers[0].effect / totalLoss) > 0.6
    ? losers[0] : null;

  return { rows: out, totals: t };
}

function WhyView({ pacing, planDemand, liveDemand }) {
  const [role, setRole] = useState('SMR');
  const [grain, setGrain] = useState('region');
  const rows = pacing.rows.filter(r => r.role === role);
  const ex = useMemo(() => explainGap(rows), [rows]);
  const t = ex.totals;

  // Group the causes up for reading.
  const grouped = useMemo(() => {
    const key = r => grain === 'region' ? r.region : grain === 'platform' ? PLATFORM_LABELS[r.platform]
      : r.region + ' \u00B7 ' + PLATFORM_LABELS[r.platform];
    const m = {};
    ex.rows.forEach(r => {
      const k = key(r);
      const o = m[k] = m[k] || { key: k, gap: 0, spendEffect: 0, effEffect: 0, unplanned: 0, expApps: 0, actualApps: 0, expSpend: 0, actualSpend: 0 };
      ['gap', 'spendEffect', 'effEffect', 'unplanned', 'expApps', 'actualApps', 'expSpend', 'actualSpend']
        .forEach(f => { o[f] += r[f]; });
    });
    return Object.values(m).sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap));
  }, [ex, grain]);

  // Roles closed since the plan was frozen: part of why a plan is missed.
  const rolesThen = planDemand ? DATA.regions_ordered.reduce((s, r) => s + ((planDemand[role] || {})[r] || 0), 0) : null;
  const rolesNow = liveDemand ? DATA.regions_ordered.reduce((s, r) => s + ((liveDemand[role] || {})[r] || 0), 0) : null;

  const behind = t.gap < 0;
  const n = x => (x >= 0 ? '+' : '') + Math.round(x);

  return (
    <div>
      <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
        <div className="role-switch">
          {ROLES.map(r => (
            <button key={r} className={r === role ? 'active' : ''} onClick={() => setRole(r)}>{r}</button>
          ))}
        </div>
        <div className="role-switch">
          {[['region', 'By location'], ['platform', 'By platform'], ['full', 'Location and platform']].map(([id, l]) => (
            <button key={id} className={id === grain ? 'active' : ''} onClick={() => setGrain(id)}>{l}</button>
          ))}
        </div>
      </div>

      <div className={'banner ' + (behind ? 'banner-bad' : 'banner-good')}>
        <div className="banner-icon">{behind ? '!' : '\u2713'}</div>
        <div>
          <strong>{role} is {behind ? 'behind by' : 'ahead by'} {Math.abs(Math.round(t.gap))} applications.</strong>
          {' '}{fmtInt(t.actualApps)} in against {fmtInt(t.expApps)} expected by now. The three figures
          below add up to that.
        </div>
      </div>

      <div className="kpi-row" style={{ marginBottom: 18 }}>
        <div className={'kpi kpi-accent-' + (t.moneyEffect < 0 ? 'orange' : 'good')}>
          <div className="kpi-label">Amount spent</div>
          <div className="kpi-value mono">{n(t.moneyEffect)}</div>
          <div className="kpi-sub">
            {fmtGBP(t.actualSpend)} spent so far against {fmtGBP(t.expSpend)} the plan expected by now.
          </div>
        </div>
        <div className={'kpi kpi-accent-' + (t.mixEffect < 0 ? 'orange' : 'good')}>
          <div className="kpi-label">Where it went</div>
          <div className="kpi-value mono">{n(t.mixEffect)}</div>
          <div className="kpi-sub">
            {t.mixCpa && t.planBlendedCpa ? (
              <>The live mix now has a blended CPA of {fmtGBP(t.mixCpa)} compared to
              {' '}{fmtGBP(t.planBlendedCpa)} in the plan.
              {t.offPlanRegions.length > 0 && (
                <> {fmtGBP(t.unplannedSpend)} of it went to {t.offPlanRegions.slice(0, 3).join(', ')}
                {t.offPlanRegions.length > 3 ? ' and ' + (t.offPlanRegions.length - 3) + ' more' : ''},
                which the plan gave nothing to.</>
              )}</>
            ) : 'Not enough of the plan has a rate to compare.'}
          </div>
        </div>
        <div className={'kpi kpi-accent-' + (t.rateEffect < 0 ? 'orange' : 'good')}>
          <div className="kpi-label">Cost per application</div>
          <div className="kpi-value mono">{n(t.rateEffect)}</div>
          <div className="kpi-sub">
            Applications are costing {t.actualApps > 0 ? fmtGBP(t.actualSpend / t.actualApps) : '-'} each
            against {t.expApps > 0 ? fmtGBP(t.expSpend / t.expApps) : '-'} in the plan.
          </div>
        </div>
      </div>

      <div className="help-text" style={{ marginBottom: 18 }}>
        Open roles: {rolesNow == null ? 'no plan snapshot' : rolesNow + ' now'}
        {rolesThen != null && rolesThen !== rolesNow
          ? ', ' + rolesThen + ' when the plan was saved, so ' + (rolesNow < rolesThen ? 'fewer' : 'more') + ' to advertise than planned for'
          : rolesThen != null ? ', unchanged since the plan was saved' : ''}.
      </div>

      {t.rateEffect <= -1 && t.rateByPlatform.length > 0 && (
        <div className="card">
          <div className="card-head">
            <div className="card-title">Where the cost per application is going wrong</div>
            <div className="card-sub">
              {t.rateConcentrated
                ? 'Mostly ' + PLATFORM_LABELS[t.rateConcentrated.platform] + ', above its planned rate in '
                  + t.rateConcentrated.worse + ' of ' + t.rateConcentrated.cells + ' locations'
                : 'Spread across the platforms rather than one of them'}
            </div>
          </div>
          <div className="card-body" style={{ padding: 0 }}>
            <table className="alloc-table rv">
              <thead>
                <tr>
                  <th>Platform</th><th>Planned CPA</th><th>Actual CPA</th><th>Difference</th>
                  <th>Locations above plan</th><th>Applications</th>
                </tr>
              </thead>
              <tbody>
                {t.rateByPlatform.map(o => (
                  <tr key={o.platform}>
                    <td>{PLATFORM_LABELS[o.platform]}</td>
                    <td className="mono">{o.planCpa ? fmtGBP(o.planCpa) : '-'}</td>
                    <td className="mono" style={{ color: (o.actualCpa && o.planCpa && o.actualCpa > o.planCpa) ? 'var(--bad)' : 'var(--good)' }}>
                      {o.actualCpa ? fmtGBP(o.actualCpa) : '-'}
                    </td>
                    <td className="mono">
                      {(o.actualCpa && o.planCpa) ? (o.actualCpa > o.planCpa ? '+' : '') + Math.round((o.actualCpa / o.planCpa - 1) * 100) + '%' : '-'}
                    </td>
                    <td className="mono">{o.worse} of {o.cells}</td>
                    <td className="mono" style={{ color: o.effect < 0 ? 'var(--bad)' : 'var(--good)' }}>
                      {o.effect >= 0 ? '+' : ''}{Math.round(o.effect)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="help-text" style={{ padding: '10px 16px' }}>
              This says where the miss is, not why. A platform above its planned rate in nearly every
              location is a platform-wide thing, which usually means the auction rather than anything in
              the account. One or two locations out of many points the other way. Planned CPA here is what
              this month's spread of spend was costed at.
            </div>
          </div>
        </div>
      )}

      {Math.abs(t.mixEffect) >= 1 && (
        <div className="card">
          <div className="card-head">
            <div className="card-title">How the mix has moved</div>
            <div className="card-sub">
              Share of spend, plan against actual, priced at historic rates
            </div>
          </div>
          <div className="card-body" style={{ padding: 0 }}>
            <table className="alloc-table rv">
              <thead>
                <tr>
                  <th>Location</th><th>Historic CPA</th>
                  <th>Share of plan</th><th>Share now</th><th>Shift</th><th>Worth</th>
                </tr>
              </thead>
              <tbody>
                {(() => {
                  const byLoc = {};
                  ex.rows.forEach(r => {
                    const o = byLoc[r.region] = byLoc[r.region] ||
                      { region: r.region, planSpend: 0, actualSpend: 0, atRate: 0, mixContrib: 0 };
                    o.planSpend += r.planSpend; o.actualSpend += r.actualSpend;
                    o.atRate += r.planCpa ? r.actualSpend / r.planCpa : 0;
                    o.mixContrib += r.mixContrib;
                  });
                  return Object.values(byLoc)
                    .filter(o => o.planSpend > 0 || o.actualSpend > 0)
                    .sort((a, b) => a.mixContrib - b.mixContrib)
                    .map(o => {
                      const ps = t.planSpend > 0 ? o.planSpend / t.planSpend : 0;
                      const as = t.actualSpend > 0 ? o.actualSpend / t.actualSpend : 0;
                      const shift = as - ps;
                      const cpa = o.atRate > 0 ? o.actualSpend / o.atRate : null;
                      return (
                        <tr key={o.region}>
                          <td>{o.region}</td>
                          <td className="mono" style={{ color: (cpa && t.planBlendedCpa && cpa > t.planBlendedCpa) ? 'var(--bad)' : 'var(--ink)' }}>
                            {cpa ? fmtGBP(cpa) : '-'}
                          </td>
                          <td className="mono">{Math.round(ps * 1000) / 10}%</td>
                          <td className="mono">{Math.round(as * 1000) / 10}%</td>
                          <td className="mono" style={{ fontWeight: 600, color: Math.abs(shift) < 0.005 ? 'var(--ink-35)' : shift > 0 ? 'var(--ink)' : 'var(--ink-55)' }}>
                            {Math.abs(shift) < 0.005 ? '-' : (shift > 0 ? '+' : '') + (Math.round(shift * 1000) / 10) + '%'}
                          </td>
                          <td className="mono" style={{ color: o.mixContrib < 0 ? 'var(--bad)' : 'var(--good)' }}>
                            {n(o.mixContrib)}
                          </td>
                        </tr>
                      );
                    });
                })()}
              </tbody>
            </table>
            <div className="help-text" style={{ padding: '10px 16px' }}>
              Locations the plan gave nothing to are in here too, at 0% of plan. Money going to them came
              out of the funded locations, so it is priced the same way rather than treated as free.
              Historic CPA is what that location has cost per application across the whole dataset. That's
              what the plan was built on. This month's own rate isn't used here, because the question is
              what moving the money is worth on what we already know, not how the month is going.
              Worth is the applications gained or lost by the shift on its own: the money a location holds
              over or under its planned share, at its own rate against the plan's blended one. A location
              sitting on its planned share comes out at nil. These add up to the mix figure above.
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head">
          <div className="card-title">Where the gap comes from</div>
          
        </div>
        <div className="card-body" style={{ padding: 0 }}>
          <div className="grid-scroll">
            <table className="alloc-table rv">
              <thead>
                <tr>
                  <th>{grain === 'platform' ? 'Platform' : 'Location'}</th>
                  <th>Expected apps</th><th>Actual</th><th>Gap</th>
                  <th>Of which spend</th><th>Of which cost per app</th>
                  <th>Plan CPA</th><th>Actual CPA</th><th>Reading</th>
                </tr>
              </thead>
              <tbody>
                {grouped.map(r => {
                  const planCpa = r.expApps > 0 ? r.expSpend / r.expApps : null;
                  const actCpa = r.actualApps > 0 ? r.actualSpend / r.actualApps : null;
                  const big = Math.abs(r.spendEffect) >= Math.abs(r.effEffect) ? 'spend' : 'cost';
                  const reading = Math.abs(r.gap) < 1 ? 'On plan'
                    : r.gap > 0 ? (big === 'spend' ? 'Ahead, spending more' : 'Ahead, cheaper than planned')
                    : (big === 'spend' ? 'Behind, spending less' : 'Behind, costing more than planned');
                  return (
                    <tr key={r.key}>
                      <td>{r.key}</td>
                      <td className="mono">{fmtInt(r.expApps)}</td>
                      <td className="mono">{fmtInt(r.actualApps)}</td>
                      <td className="mono" style={{ fontWeight: 700, color: r.gap < 0 ? 'var(--bad)' : 'var(--good)' }}>{n(r.gap)}</td>
                      <td className="mono" style={{ color: r.spendEffect < 0 ? 'var(--bad)' : 'var(--good)' }}>{n(r.spendEffect)}</td>
                      <td className="mono" style={{ color: r.effEffect < 0 ? 'var(--bad)' : 'var(--good)' }}>{n(r.effEffect)}</td>
                      <td className="mono">{planCpa ? fmtGBP(planCpa) : '-'}</td>
                      <td className="mono">{actCpa ? fmtGBP(actCpa) : '-'}</td>
                      <td style={{ fontSize: 11.5, color: 'var(--ink-55)' }}>{reading}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="help-text" style={{ padding: '10px 16px' }}>
            These add up to the gap exactly. Amount spent is the change in total money at the plan's
            blended rate. Where it went is the same money spread differently across locations, which moves
            the total even when spend doesn't change. What each cost is the actual rate against the planned
            one. Locations the plan never funded are separate, because there was no target to miss there.
            The two columns in the table below are per location at that location's own planned rate, so the
            mix shows up in the totals rather than on any one row.
          </div>
        </div>
      </div>
    </div>
  );
}

// The function returns date, campaign and spend rows: the same shape a
// Windsor export has. Turn them back into a paste and reuse the parser that
// is already tested, rather than growing a second way in.
function rowsToCsv(rows) {
  const esc = v => ('"' + String(v == null ? '' : v).replace(/"/g, '""') + '"');
  return ['date,campaign,spend,apps'].concat(
    rows.map(r => [esc(r.date), esc(r.campaign), r.spend, r.apps || 0].join(','))).join('\n');
}

function WindsorPull({ month, lastDay, priRows, onApply }) {
  const [state, setState] = useState({ status: 'idle' });
  const from = month + '-01';
  // Match the master sheet when one is loaded, so every platform covers the
  // same days. On its own, run to yesterday: today is always part-reported.
  const y = new Date(); y.setDate(y.getDate() - 1);
  const to = month + '-' + String(lastDay || y.getDate()).padStart(2, '0');

  const go = async () => {
    if (!sbSignedIn()) { setState({ status: 'error', msg: 'Sign in first, using the button at the top.' }); return; }
    setState({ status: 'busy' });
    try {
      // Renew the session first. This is the one call that does not go
      // through sbFetch, so without this it sends whatever token was in the
      // browser and fails an hour after signing in.
      await sbFresh();
      let r = await fetch('/api/windsor-spend?from=' + from + '&to=' + to, {
        headers: { Authorization: 'Bearer ' + (SB_TOKEN && SB_TOKEN.access_token) },
      });
      if (r.status === 401 && await sbRefresh()) {
        r = await fetch('/api/windsor-spend?from=' + from + '&to=' + to, {
          headers: { Authorization: 'Bearer ' + (SB_TOKEN && SB_TOKEN.access_token) },
        });
      }
      const j = await r.json();
      if (!r.ok) {
        const extra = [j.reason, j.signedInTo && ('signed in to ' + j.signedInTo),
          j.serverConfiguredFor && ('server set to ' + j.serverConfiguredFor), j.fix, j.hint]
          .filter(Boolean).join(' \u00B7 ');
        throw new Error((j.error || ('Request failed: ' + r.status)) + (extra ? ' ' + extra : ''));
      }
      if (!j.rows || !j.rows.length) throw new Error('Windsor returned nothing for ' + from + ' to ' + to + '.');
      const parsed = parsePlatformPaste(rowsToCsv(j.rows), priRows);
      if (parsed.error) throw new Error(parsed.error);
      onApply(parsed, Number(to.slice(-2)));
      setState({ status: 'done', spend: j.spend, apps: j.apps, rows: j.rows.length, parsed,
        warn: (j.errors || []).map(e => e.error).join(' ') });
    } catch (e) {
      setState({ status: 'error', msg: e.message });
    }
  };

  return (
    <div style={{ marginBottom: 14 }}>
      <div className="section-label">Google and Meta, straight from Windsor</div>
      <div className="help-text" style={{ marginBottom: 8 }}>
        Spend and applications, {from} to {to}.
      </div>
      <button className="btn btn-sm btn-primary" onClick={go} disabled={state.status === 'busy'}>
        {state.status === 'busy' ? 'Fetching...' : 'Get spend from Windsor'}
      </button>
      {state.status === 'error' && <div className="parse-bad" style={{ marginTop: 8 }}>{state.msg}</div>}
      {state.status === 'done' && (
        <div className="parse-report">
          <div className="parse-line">
            <strong>{fmtGBP(state.parsed.matchedSpend)}</strong> and
            {' '}<strong>{fmtInt(state.parsed.matchedApps)}</strong> applications placed across
            {' '}{Object.keys(state.parsed.cells).length} location rows, from {state.rows} campaign days.
            {state.parsed.unmatchedSpend > 0 && (
              <> {fmtGBP(state.parsed.unmatchedSpend)} left out as non-standard or unplaceable.</>
            )}
          </div>
          {state.warn && <div className="parse-bad">{state.warn}</div>}
        </div>
      )}
    </div>
  );
}

function PlatformPasteBox({ label, hint, priRows, onApply, applied, range }) {

      {parsed && !parsed.error && (

            {' \u00B7 '}<strong>{fmtGBP(parsed.matchedSpend)}</strong> matched across {Object.keys(parsed.cells).length} location rows
            {parsed.appsIncluded ? ' \u00B7 ' + fmtInt(parsed.matchedApps) + ' applications' : ' \u00B7 spend only, applications come from Eploy'}
          </div>

              <ul style={{ margin: '6px 0 0 18px' }}>
                {parsed.unmatched.filter(u => u.spend > 0).slice(0, 5).map((u, i) => (

                ))}
              </ul>
            </div>
          )}

function splitByPlatform(parsed) {
  if (!parsed.multi) return { [parsed.platform]: parsed };
  const out = {};
  parsed.platform.forEach(plat => {
    const cells = {};
    Object.keys(parsed.cells).forEach(k => { if (parsed.cells[k].platform === plat) cells[k] = parsed.cells[k]; });
    const matchedSpend = Object.values(cells).reduce((a, c) => a + c.spend, 0);
    const p = parsed;
    out[plat] = { platform: plat, cells, matchedSpend,
      // The unplaceable spend belongs to the file, not to any one platform,
      // so it is only counted once.
      unmatchedSpend: plat === parsed.platform[0] ? parsed.unmatchedSpend : 0,
      nonStandardSpend: plat === parsed.platform[0] ? (parsed.nonStandardSpend || 0) : 0,
      otherProjectSpend: plat === parsed.platform[0] ? (parsed.otherProjectSpend || 0) : 0,
      unmatched: plat === parsed.platform[0] ? parsed.unmatched : [],
      matchedApps: 0, appsIncluded: p.appsIncluded, rows: Object.keys(cells).length };
  });
  return out;
}

function PacingTool({ month, container, patchMonth }) {
  const [view, setView] = useState('pacing');

  // Pasted and loaded actuals live in the month, not in this component, so
  // they survive moving between tabs.
  const baseActuals = container.actuals || null;
  const pastes = container.pastes || {};
  const setBaseActuals = (v) => patchMonth({ actuals: v });
  const setPastes = (u) => patchMonth({ pastes: typeof u === 'function' ? u(container.pastes || {}) : u });
  // How far through the month the actuals run. The master sheet says so
  // itself; Windsor sets it from the day it pulled to; otherwise it is
  // yesterday, and editable, because a paste carries no dates.
  const yesterday = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.getDate(); })();
  const asAt = container.actualsAsAt || yesterday;
  const setAsAt = (d) => patchMonth({ actualsAsAt: d });
  const [busy, setBusy] = useState('');
  const [grain, setGrain] = useState('region');
  const [fRole, setFRole] = useState('All');
  const [fRegion, setFRegion] = useState('All');
  const [fPlat, setFPlat] = useState('All');
  const [sortBy, setSortBy] = useState('key');
  const [sortDir, setSortDir] = useState('asc');
  const sortOn = (k) => {
    if (sortBy === k) setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortBy(k); setSortDir(k === 'key' ? 'asc' : 'desc'); }
  };
  const fileRef = useRef(null);
  const pri = priorityFor(month, container);
  const dates = pri.dates || [];
  const [from, setFrom] = useState(dates.length > 1 ? dates[dates.length - 2] : dates[0]);
  const [to, setTo] = useState(dates[dates.length - 1]);
  const setPri = (u) => patchMonth({ priorities: typeof u === 'function' ? u(pri) : u });

  const readFile = async (file) => {
    setBusy('Reading ' + file.name);
    try {
      const buf = await file.arrayBuffer();
      let rows;
      if (/\.csv$/i.test(file.name)) rows = new TextDecoder().decode(buf).split(/\r?\n/).map(l => l.split(','));
      else {
        if (!window.XLSX) throw new Error('The spreadsheet reader did not load.');
        const wb = window.XLSX.read(buf, { cellDates: true });
        const n = wb.SheetNames.find(x => normHeader(x).includes('rawdata')) || wb.SheetNames[0];
        rows = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true });
      }
      const dg = digestActuals(rows, month);
      if (!dg.error) { dg.loadedAt = new Date().toISOString(); dg.fileName = file.name; }
      setBaseActuals(dg);
    } catch (e) { setBaseActuals({ error: e.message }); }
    setBusy('');
  };

  const priRows = useMemo(() => ROLES.reduce((a, r) => a.concat(((pri.roles || {})[r] || {}).rows || []), []), [pri]);
  // The platform exports carry no dates at all, so they are taken as covering
  // the same days as the master sheet. If one is exported month to date and
  // the master sheet stops earlier, that platform reads as over pacing for no
  // reason but the extra days. Naming the range is the cheapest guard.
  const exportRange = useMemo(() => {
    if (!baseActuals || baseActuals.error || !baseActuals.lastDay) return null;
    const mName = new Date(month + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'long' });
    return '1 to ' + baseActuals.lastDay + ' ' + mName;
  }, [baseActuals, month]);
  // Pacing measures against whatever plan the planner is currently on. Load
  // a saved plan there and pacing follows it.
  // Pacing measures against a SAVED plan, never the working one. A working
  // plan takes its open-role counts from Location priorities as they stand
  // today, so it would move every time a list is pasted and the plan could
  // never be missed.
  const versions = container.versions || [];
  const [planId, setPlanId] = useState(container.loaded || (versions[versions.length - 1] || {}).id || '');
  const chosenPlan = versions.find(v => v.id === planId) || null;
  const planDemandTotals = useMemo(() => {
    const d = (chosenPlan && chosenPlan.demand) || null;
    if (!d) return null;
    const out = {};
    ROLES.forEach(r => { out[r] = DATA.regions_ordered.reduce((a, x) => a + ((d[r] || {})[x] || 0), 0); });
    return out;
  }, [chosenPlan]);
  const liveDemandTotals = useMemo(() => {
    const out = {};
    ROLES.forEach(r => { out[r] = DATA.regions_ordered.reduce((a, x) => a + (((container.demand || {})[r] || {})[x] || 0), 0); });
    return out;
  }, [container.demand]);
  const actuals = useMemo(() => mergeActuals(baseActuals, pastes, asAt), [baseActuals, pastes, asAt]);
  const pacing = useMemo(
    () => (actuals && !actuals.error && chosenPlan ? buildPacing(month, container, actuals, chosenPlan) : null),
    [actuals, month, container, chosenPlan]);

  const roleRows = pacing ? agg(pacing.rows, r => r.role) : [];
  const total = pacing ? (agg(pacing.rows, () => 'All')[0] || {}) : {};
  const filtered = pacing ? pacing.rows.filter(r =>
    (fRole === 'All' || r.role === fRole) &&
    (fRegion === 'All' || r.region === fRegion) &&

  const detail = pacing
    ? (grain === 'region'

    : [];
  const detailSorted = detail.slice().sort((a, b) => {
    const dir = sortDir === 'asc' ? 1 : -1;
    if (sortBy === 'key') return dir * String(a.key).localeCompare(String(b.key));
    const av = a[sortBy], bv = b[sortBy];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;              // blanks always last
    if (bv == null) return -1;
    return dir * (av - bv);
  });
  const detailTotal = agg(filtered, () => 'Total')[0];

  return (
    <div>

            <select value={from} onChange={e => setFrom(e.target.value)}>
              {dates.map(d => <option key={d} value={d}>{fmtDay(d)}</option>)}
            </select>
            <label>to</label>
            <select value={to} onChange={e => setTo(e.target.value)}>
              {dates.map(d => <option key={d} value={d}>{fmtDay(d)}</option>)}
            </select>
          </div>
        )}
      </div>

      {view === 'region' && (dates.length > 0
        ? <RegionView pri={pri} from={from} to={to} month={month} container={container} setPri={setPri} />
        : <div className="card"><div className="card-body"><div className="help-text">No location data for this month yet.</div></div></div>)}

      {(view === 'pacing' || view === 'total' || view === 'why') && (
        <>
          {versions.length === 0 && (
            <div className="banner banner-warn">

              </div>
            </div>

                <div className="card-sub">Open roles are frozen as they stood when the plan was saved</div>
              </div>
              <div className="card-body">
                <div className="dial-row">
                  <select className="text-input" style={{ width: 260, flex: 'none' }}
                    value={planId} onChange={e => setPlanId(e.target.value)}>
