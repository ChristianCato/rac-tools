// ====================================================================
// DATA UPDATE
// Folding a finished month into the benchmarks, without me.
//
// Drop in the master sheet and this applies the same rules the dataset was
// built on: SMR and Patrol only, Indeed / Meta / Google Search / Appcast
// only, untagged rows left out rather than spread across locations. It
// shows what it found and what it would move before anything is applied,
// then hands back a new rac_data.js to commit.
// ====================================================================

const UPDATE_PLATMAP = {
  'indeed': 'indeed',
  'meta ads': 'meta', 'meta': 'meta', 'facebook': 'meta',
  'google search ads': 'google', 'google search': 'google',
  'appcast': 'appcast',
};
// Everything else is non-standard and never reaches the allocation engine.
// Which platform a campaign belongs to, read from its name. Anything not
// here is non-standard and never reaches the plan comparison.
const CAMPAIGN_PLATFORM = {
  'gs': 'google', 'google search': 'google',
  'indeed': 'indeed', 'appcast': 'appcast',
  'fb': 'meta', 'meta': 'meta', 'facebook': 'meta', 'fb ig': 'meta', 'social': 'meta',
};
const NON_STANDARD = ['google ads demandgen', 'google demand gen', 'demandgen', 'acast', 'linkedin', 'placed'];

// A month is foldable once it has closed and its conversions have settled.
// Applications keep being credited back for weeks: April moved from 204 to
// 330 on identical spend between two pulls. Three weeks is the wait.
const SETTLE_DAYS = 21;
function monthSettled(mo) {
  const [y, m] = mo.split('-').map(Number);
  const end = new Date(Date.UTC(y, m, 0));
  return (Date.now() - end.getTime()) / 86400000 >= SETTLE_DAYS;
}

// The calendar day a spreadsheet cell means. The reader hands back dates at
// local midnight, and reading those in UTC shifts them back an hour through
// British Summer Time: 31 July becomes 30 July, and 1 July becomes 30 June
// and falls out of the month. So local parts for real dates, UTC parts for
// Excel's own serial numbers, which genuinely are UTC based.
function sheetDay(raw) {
  if (raw instanceof Date) {
    if (isNaN(raw.getTime())) return null;
    return { y: raw.getFullYear(), m: raw.getMonth() + 1, d: raw.getDate() };
  }
  if (typeof raw === 'number' && isFinite(raw)) {
    const dt = new Date(Math.round((raw - 25569) * 86400000));
    if (isNaN(dt.getTime())) return null;
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  const t = String(raw || '').trim();
  if (!t) return null;
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2], d: +m[3] };
  m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return { y, m: +m[2], d: +m[1] }; }
  const dt = new Date(t);
  if (isNaN(dt.getTime())) return null;
  return { y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate() };
}

function normHeader(h) { return String(h || '').toLowerCase().replace(/[^a-z]/g, ''); }

// Turn the Raw Data Export into monthly cells. Returns the cells plus a
// plain account of everything it left out.
function digestExport(rows) {
  if (!rows || rows.length < 2) return { error: 'No rows found in that file.' };
  const head = rows[0].map(normHeader);
  const col = (...names) => {
    for (const n of names) { const i = head.indexOf(normHeader(n)); if (i >= 0) return i; }
    return -1;
  };
  // The furthest date the file actually reaches. Folding a month that has not
  // finished used to leave the tool claiming the whole month was in, because
  // the label was set to the end of the last month seen rather than to the last
  // day of data. July 2026 was folded on 24 July and read as complete for a
  // fortnight, so every plan built after it used a three quarter month.
  let maxDay = null;
  const iDate = col('Date'), iPlat = col('Platform'), iArea = col('Area'),
        iReg = col('Region'), iSpend = col('Ad Spend'),
        iApps = col('Blended Apply Completes'), iClicks = col('Clicks');
  const missing = [['Date', iDate], ['Platform', iPlat], ['Area', iArea], ['Region', iReg],
                   ['Ad Spend', iSpend], ['Blended Apply Completes', iApps]]
                   .filter(([, i]) => i < 0).map(([n]) => n);
  if (missing.length) return { error: 'That sheet is missing these columns: ' + missing.join(', ') + '. It should be the Raw Data Export tab.' };

  const cells = {}, months = {};
  let skippedNonStandard = 0, skippedNonStandardSpend = 0;
  let skippedOther = 0, untagged = 0, untaggedSpend = 0, untaggedApps = 0, unknownPlat = {};

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r]; if (!row || !row.length) continue;
    const day = sheetDay(row[iDate]);
    if (day) {
      const iso = day.y + '-' + String(day.m).padStart(2, '0') + '-' + String(day.d).padStart(2, '0');
      if (!maxDay || iso > maxDay) maxDay = iso;
    }
    if (!day) continue;
    const mo = day.y + '-' + String(day.m).padStart(2, '0');

    const platRaw = String(row[iPlat] || '').trim().toLowerCase();
    const spend = Number(row[iSpend]) || 0;
    const apps = Number(row[iApps]) || 0;
    const plat = UPDATE_PLATMAP[platRaw];
    if (!plat) {
      if (NON_STANDARD.includes(platRaw)) { skippedNonStandard++; skippedNonStandardSpend += spend; }
      else if (platRaw) { unknownPlat[row[iPlat]] = (unknownPlat[row[iPlat]] || 0) + spend; }
      continue;
    }
    const role = String(row[iArea] || '').trim();
    if (role !== 'SMR' && role !== 'Patrol') { skippedOther++; continue; }

    const region = priorityRegion(row[iReg]);
    if (!region) { untagged++; untaggedSpend += spend; untaggedApps += apps; continue; }

    months[mo] = true;
    const key = region + '__' + role;
    cells[plat] = cells[plat] || {};
    cells[plat][key] = cells[plat][key] || {};
    const c = cells[plat][key][mo] = cells[plat][key][mo] || { spend: 0, completes: 0, clicks: 0 };
    c.spend += spend; c.completes += apps;
    if (iClicks >= 0) c.clicks += Number(row[iClicks]) || 0;
  }

  Object.keys(cells).forEach(p => Object.keys(cells[p]).forEach(k => Object.keys(cells[p][k]).forEach(mo => {
    const c = cells[p][k][mo];
    c.spend = Math.round(c.spend * 100) / 100;
    c.completes = Math.round(c.completes * 1000) / 1000;
    c.cpa = c.completes > 0 ? Math.round(c.spend / c.completes * 10000) / 10000 : null;
    c.accepted = 0; c.started = 0; c.cph = null; c.cvr = 0;
  })));

  return {
    cells, months: Object.keys(months).sort(), lastDate: maxDay,
    skipped: { nonStandard: skippedNonStandard, nonStandardSpend: skippedNonStandardSpend,
               other: skippedOther, untagged, untaggedSpend, untaggedApps,
               unknownPlat: Object.keys(unknownPlat).length ? unknownPlat : null },
  };
}

// Totals per platform for a set of months, before and after, so the effect
// on the numbers the planner allocates on is visible before applying.
function platformTotals(months, cells) {
  const out = {};
  PLATFORMS.forEach(p => {
    let s = 0, c = 0;
    Object.keys((cells || {})[p] || {}).forEach(k => months.forEach(mo => {
      const x = cells[p][k][mo]; if (x) { s += x.spend; c += x.completes; }
    }));
    out[p] = { spend: s, apps: c, cpa: c > 0 ? s / c : null };
  });
  return out;
}
function currentAllTime() {
  const out = {};
  PLATFORMS.forEach(p => {
    let s = 0, c = 0;
    Object.keys(DATA[p]).forEach(k => {
      if (k === 'OVERALL') return;
      const a = DATA[p][k].all_time || {}; s += a.spend || 0; c += a.completes || 0;
    });
    out[p] = { spend: s, apps: c, cpa: c > 0 ? s / c : null };
  });
  return out;
}

// Write months into DATA in place. Each month is cleared everywhere first,
// so a cell that used to carry spend and no longer does goes to nothing
// rather than keeping a stale figure.
function applyMonths(months, cells, lastDate) {
  PLATFORMS.forEach(p => {
    Object.keys(DATA[p]).forEach(k => {
      const m = DATA[p][k].monthly; if (!m) return;
      months.forEach(mo => { delete m[mo]; });
    });
    Object.keys((cells || {})[p] || {}).forEach(k => {
      if (!DATA[p][k]) DATA[p][k] = { monthly: {}, all_time: { spend: 0, completes: 0, accepted: 0, started: 0, cph: null, cpa: null, cvr: 0, hireCvr: 0 } };
      DATA[p][k].monthly = DATA[p][k].monthly || {};
      months.forEach(mo => { if (cells[p][k][mo]) DATA[p][k].monthly[mo] = cells[p][k][mo]; });
    });
    // All-time follows from the monthly series. Hire figures carry through:
    // the master sheet has no hire data in it.
    Object.keys(DATA[p]).forEach(k => {
      const c = DATA[p][k]; if (!c.monthly) return;
      let s = 0, n = 0;
      Object.values(c.monthly).forEach(m => { s += m.spend || 0; n += m.completes || 0; });
      c.all_time = c.all_time || {};
      c.all_time.spend = Math.round(s * 100) / 100;
      c.all_time.completes = Math.round(n * 1000) / 1000;
      c.all_time.cpa = n > 0 ? Math.round(s / n * 10000) / 10000 : null;
    });
  });
  const all = new Set([...(DATA.data_months || []), ...months]);
  DATA.data_months = [...all].sort();
  const last = DATA.data_months[DATA.data_months.length - 1];
  if (lastDate) {
    // What the file actually reached, not the end of the month it fell in.
    if (!DATA.data_current_through || lastDate > DATA.data_current_through) DATA.data_current_through = lastDate;
  } else if (last) {
    const [y, m] = last.split('-').map(Number);
    DATA.data_current_through = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  }
  DATA.generated_at = todayISO();
}

function HireRates() {
  const updated = window.__AVP_HIRE_2026_08__ || null;
  const live = window.__RAC_HIRE__ || null;
  const on = !!live;
  const [edits, setEdits] = useState(live && live.edited ? live.rates : null);
  const [role, setRole] = useState('SMR');
  const [saving, setSaving] = useState('');

  const shown = (r, p) => {
    if (!on) {
      const s = (DATA[p] || {})[r + '__' + role];
      return (s && s.all_time && s.all_time.hireCvr) || null;
    }
    const src = edits || (updated && updated.rates) || {};
    const v = ((src[role] || {})[r] || {})[p];
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  };

  const apply = async (obj) => {
    window.__RAC_HIRE__ = obj;
    setHireOverride(obj);
    setSaving('saving');
    try { await sbSet('hire_rates', obj); setSaving('saved'); }
    catch (e) { setSaving('failed'); }
  };
  const toggle = (useUpdated) => {
    if (!useUpdated) { setEdits(null); apply(null); return; }
    apply({ ...updated, edited: false });
  };
  const setRate = (r, p, pct) => {
    const n = parseFloat(String(pct).replace(/[^0-9.]/g, ''));
    const base = edits || JSON.parse(JSON.stringify((updated && updated.rates) || { SMR: {}, Patrol: {} }));
    const next = JSON.parse(JSON.stringify(base));
    next[role] = next[role] || {};
    next[role][r] = next[role][r] || {};
    if (isFinite(n)) next[role][r][p] = n / 100; else delete next[role][r][p];
    setEdits(next);
    apply({ at: todayISO(), note: 'Updated data, some rates set by hand', edited: true, rates: next });
  };

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">Hire rates</div>
        <div className="card-sub">
          {on ? (live.note || 'Using the updated data') : 'Using the original rates. Nothing has changed.'}
        </div>

function DataTool() {
  const [digest, setDigest] = useState(null);
  const [busy, setBusy] = useState('');
  const [chosen, setChosen] = useState({});
  const [applied, setApplied] = useState(window.__RAC_BENCH__ || null);
  const [saving, setSaving] = useState('');
  const [, bump] = useState(0);
  const fileRef = useRef(null);

  const readFile = async (file) => {
    setBusy('Reading ' + file.name);
    try {
      const buf = await file.arrayBuffer();
      let rows;
      if (/\.csv$/i.test(file.name)) {
        const text = new TextDecoder().decode(buf);
        rows = text.split(/\r?\n/).map(l => l.split(','));
      } else {
        if (!window.XLSX) throw new Error('The spreadsheet reader did not load. Check the connection and reload.');
        const wb = window.XLSX.read(buf, { cellDates: true });
        const name = wb.SheetNames.find(n => normHeader(n).includes('rawdata')) || wb.SheetNames[0];
        rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true });
      }
      const d = digestExport(rows);
      setDigest(d);
      if (!d.error) {
        const pick = {};
        d.months.forEach(mo => { pick[mo] = monthSettled(mo); });
        setChosen(pick);
      }
    } catch (e) {
      setDigest({ error: e.message });
    }
    setBusy('');
  };

  const months = digest && !digest.error ? digest.months.filter(mo => chosen[mo]) : [];
  const before = useMemo(() => currentAllTime(), [applied, digest]);
  const preview = useMemo(() => {
    if (!months.length) return null;
    const incoming = platformTotals(months, digest.cells);
    // What all-time becomes: current, minus whatever those months already
    // hold, plus what is coming in.
    const existing = {};
    PLATFORMS.forEach(p => {
      let s = 0, c = 0;
      Object.keys(DATA[p]).forEach(k => {
        if (k === 'OVERALL') return;
        const m = DATA[p][k].monthly || {};
        months.forEach(mo => { if (m[mo]) { s += m[mo].spend || 0; c += m[mo].completes || 0; } });
      });
      existing[p] = { spend: s, apps: c };
    });
    const after = {};
    PLATFORMS.forEach(p => {
      const s = before[p].spend - existing[p].spend + incoming[p].spend;
      const c = before[p].apps - existing[p].apps + incoming[p].apps;
      after[p] = { spend: s, apps: c, cpa: c > 0 ? s / c : null };
    });
    return { incoming, after };
  }, [months.join(','), digest, before]);

  const doApply = async () => {
    applyMonths(months, digest.cells, digest.lastDate);
    // Keep only the months being folded in, so the row stays small.
    const store = { at: todayISO(), months, lastDate: digest.lastDate || null, cells: {} };
    PLATFORMS.forEach(p => {
      store.cells[p] = {};
      Object.keys((digest.cells || {})[p] || {}).forEach(k => {
        const keep = {};
        months.forEach(mo => { if (digest.cells[p][k][mo]) keep[mo] = digest.cells[p][k][mo]; });
        if (Object.keys(keep).length) store.cells[p][k] = keep;
      });
    });
    // Merge with anything folded in previously, so older months are not lost.
    const merged = { at: store.at, months: [...new Set([...(applied ? applied.months : []), ...months])].sort(), cells: {} };
    PLATFORMS.forEach(p => {
      merged.cells[p] = { ...((applied && applied.cells && applied.cells[p]) || {}) };
      Object.keys(store.cells[p]).forEach(k => {
        merged.cells[p][k] = { ...(merged.cells[p][k] || {}), ...store.cells[p][k] };
      });
    });
    setDigest(null);
    setApplied(merged);
    bump(x => x + 1);
    setSaving('saving');
    try { await sbSet('benchmarks', merged); setSaving('saved'); }
    catch (e) { setSaving('failed'); }
  };

  const download = () => {
    const blob = new Blob(['window.__AVP_DATA__ = JSON.parse(' + JSON.stringify(JSON.stringify(DATA)) + ');\n'],
      { type: 'text/javascript' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rac_data.js';
    a.click();
    URL.revokeObjectURL(a.href);
  };


  const s = digest && digest.skipped;

  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          Drop the master sheet in and pick the months you want. It shows what would change before
          anything does, then gives you a file to publish.
        </div>
      </div>

      {applied && (
        <div className={'banner ' + (saving === 'failed' ? 'banner-bad' : 'banner-good')}>
          <div className="banner-icon">{saving === 'failed' ? '!' : '\u2713'}</div>
          <div>
            {saving === 'failed'
              ? <><strong>Saved here but not to the server.</strong> Everyone else is still on the old
                  numbers. Try again, or download the file below as a backstop.</>
              : <>{applied.months.join(', ')} folded in on {applied.at}. Everyone signed in sees these
                  numbers.{saving === 'saving' ? ' Saving...' : ''}</>}
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head">
          <div className="card-title">Load the master sheet</div>
          <div className="card-sub">
            Data currently runs to {DATA.data_current_through}
            {(() => {
              // A month folded in before it finished is the quiet failure this
              // label used to hide. Say so rather than implying the month is
              // whole.
              const d = DATA.data_current_through;
              if (!d) return null;
              const [y, m, dd] = d.split('-').map(Number);
              const endOfMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
              if (dd >= endOfMonth) return null;
              return <span style={{ color: 'var(--warn)', fontWeight: 600 }}>
                {'. '}That month is not complete, so anything planned on it is
                {' '}built on {dd} of {endOfMonth} days. Fold it again once the month has closed.
              </span>;
            })()}
          </div>
        </div>
        <div className="card-body">
          <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.csv" style={{ display: 'none' }}
            onChange={e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; }} />
          <button className="btn btn-primary" onClick={() => fileRef.current && fileRef.current.click()}>
            Choose file
          </button>
          <span className="help-text" style={{ marginLeft: 12 }}>
            The Blended Reporting master sheet, or a CSV of its Raw Data Export tab.
          </span>
          {busy && <div className="help-text" style={{ marginTop: 10 }}>{busy}...</div>}
        </div>
      </div>

      {digest && digest.error && (
        <div className="banner banner-bad">
          <div className="banner-icon">!</div>
          <div>{digest.error}</div>
        </div>
      )}

      {digest && !digest.error && (
        <>
          <div className="card">
            <div className="card-head">
              <div className="card-title">Months found</div>
              <div className="card-sub">{digest.months.length} in the file</div>
            </div>
            <div className="card-body">
              <div className="help-text" style={{ marginBottom: 10 }}>
                A month is ticked once it has closed and had {SETTLE_DAYS} days to settle. Applications keep
                being credited back for weeks after the spend, so folding a month in too early makes it look
                more expensive than it was. You can tick one early if you want it anyway.
              </div>
              <div className="parse-cells">
                {digest.months.map(mo => {
                  const settled = monthSettled(mo);
                  const held = DATA.data_months && DATA.data_months.includes(mo);
                  return (
                    <label key={mo} className={'month-pick' + (chosen[mo] ? ' on' : '')}>
                      <input type="checkbox" checked={!!chosen[mo]}
                        onChange={e => setChosen(c => ({ ...c, [mo]: e.target.checked }))} />
                      {(DATA.month_labels && DATA.month_labels[mo]) || mo}
                      <span>{!settled ? 'still settling' : held ? 'replaces existing' : 'new'}</span>
                    </label>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-head">
              <div className="card-title">What it left out</div>
              
            </div>
            <div className="card-body">
              <div className="brief-row"><span>Not tagged to a location</span>
                <div>{fmtInt(s.untagged)} rows, {fmtGBP(s.untaggedSpend)} and {fmtInt(s.untaggedApps)} applications.
                Left out rather than spread, so a location figure only holds what genuinely happened there.</div></div>
              <div className="brief-row"><span>Non-standard platforms</span>
                <div>{fmtInt(s.nonStandard)} rows, {fmtGBP(s.nonStandardSpend)}. Demand Gen and Acast do not reach the allocation engine.</div></div>
              <div className="brief-row"><span>Not SMR or Patrol</span>
                <div>{fmtInt(s.other)} rows.</div></div>
              {s.unknownPlat && (
                <div className="brief-row"><span style={{ color: 'var(--bad)' }}>Platforms I do not know</span>
                  <div style={{ color: 'var(--bad)' }}>
                    {Object.keys(s.unknownPlat).map(k => k + ' (' + fmtGBP(s.unknownPlat[k]) + ')').join(', ')}.
                    {' '}These were left out. If any should count, they need adding to the platform list.
                  </div></div>
              )}
            </div>
          </div>

          {preview && (
            <div className="card">
              <div className="card-head">
                <div className="card-title">What it would move</div>
                
              </div>
              <div className="card-body" style={{ padding: 0 }}>
                <table className="alloc-table">
                  <thead>
                    <tr><th>Platform</th><th>Coming in</th><th>Now</th><th>After</th><th>Change</th></tr>
                  </thead>
                  <tbody>
                    {PLATFORMS.map(p => {
                      const inc = preview.incoming[p], af = preview.after[p], bf = before[p];
                      const chg = (bf.cpa && af.cpa) ? (af.cpa / bf.cpa - 1) * 100 : null;
                      return (
                        <tr key={p}>
                          <td>{PLATFORM_LABELS[p]}</td>
                          <td className="mono">{fmtGBP(inc.spend)}, {fmtInt(inc.apps)} apps</td>
                          <td className="mono">{bf.cpa ? fmtGBP(bf.cpa) : '-'}</td>
                          <td className="mono">{af.cpa ? fmtGBP(af.cpa) : '-'}</td>
                          <td className="mono" style={{ color: chg == null ? 'var(--ink-35)' : Math.abs(chg) < 1 ? 'var(--ink-55)' : chg < 0 ? 'var(--good)' : 'var(--bad)' }}>
                            {chg == null ? '-' : (chg > 0 ? '+' : '') + chg.toFixed(1) + '%'}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="card">
            <div className="card-body">
              <button className="btn btn-primary" disabled={!months.length} onClick={doApply}>
                Fold in {months.length ? months.length + ' month' + (months.length === 1 ? '' : 's') : 'nothing'}
              </button>
              <span className="help-text" style={{ marginLeft: 12 }}>
                Saves it for everyone straight away.
              </span>
            </div>
          </div>
        </>
      )}

      <HireRates />

      <div className="card">
        <div className="card-head">
          <div className="card-title">Keeping a copy</div>
          
        </div>
        <div className="card-body">
          <div className="help-text" style={{ marginBottom: 12 }}>
            Folding months in saves them for everyone straight away. The download below is only a backstop,
            for keeping a copy or for putting the numbers back into the file the tool starts from.
          </div>
          <button className="btn" onClick={download}>Download rac_data.js</button>
          {applied && (
            <a href="#" className="link-inline" style={{ marginLeft: 14 }}
              onClick={async e => {
                e.preventDefault();
                if (!window.confirm('Undo the folded-in months and go back to the numbers the tool starts from?')) return;
                try { await sbSet('benchmarks', null); } catch (err) { /* reload will show the truth */ }
                window.location.reload();
              }}>Undo and go back to the starting numbers</a>
          )}
        </div>
      </div>
    </div>
  );
}

function MethodTab({ state }) {
  const months = dataMonths();
  const first = months[0], last = months[months.length - 1];
  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>How the plan is worked out, in the order it happens.</div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">From a hire target to a budget</div></div>
        <div className="card-body method-body">
          <p>
            <strong>The hire target is the input.</strong> You enter the number of hires RAC need. The
            application target is worked back from it, through the blended hire rate for the locations live
            that month. The rate is blended rather than flat because a hire costs a very different number of
            applications in London than in the North West, and one flat rate across every location builds the
            wrong target.
          </p>
          <p>
            <strong>After that the plan runs on applications.</strong> Application data is plentiful and
            updates weekly, so next month can be predicted against a recent record. Hires are the goal, but
            they are thin and lag by weeks, so applications are what the plan is measured on.
          </p>
          <p>
            <strong>Open roles come from Location priorities.</strong> How many roles are open in each
            location is kept in one place and read by the planner rather than typed into it. That number sets
            which locations are funded and how much each one gets.
          </p>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">How the money is divided</div></div>
        <div className="card-body method-body">
          <p>
            <strong>Hold-backs come off the top.</strong> Indeed Premium, which is campaigns multiplied by
            days in the month at &pound;{INDEED_PREMIUM_RATE} a day, and the Combined Activity reserve for
            brand-level work not tied to a location. What is left is the deployable budget.
          </p>
          <p>
            <strong>Locations are funded by open roles.</strong> A location with 22 of 79 open roles takes
            22/79 of the deployable budget. The money tracks where the hiring need is.
          </p>
          <p>
            <strong>A location can be given a floor or a ceiling.</strong> Both are set on Setup. Money trimmed
            off a capped location goes to the ones still under their cap, shared out by open roles again, so
            the total never changes. Typing N instead of a number holds a location at nothing while keeping it
            in the plan and in every table, so its unmet demand is still visible.
          </p>
          <p>
            <strong>Platforms are funded by what a hire costs.</strong> Within each location the budget goes
            to whichever platform produces the next hire most cheaply. Two things decide that: every platform
            gets dearer per application the more it takes in one location in one month, and they turn
            applications into hires at different rates. A platform with no hire rate on record keeps its
            historic share instead.
          </p>
          <p>
            <strong>There is a soft cap on what each one can take.</strong> The cap is the biggest month
            that location and platform has actually spent. It is soft rather than hard: the plan will go above
            it if the target needs the money, but it says how much sits above and shows it as its own line on
            Setup, in the workings and in the PDF. That part of the plan is an estimate rather than something
            measured, because nobody has run that level before. The cap can be lifted on Setup, up to three
            times the biggest month. Where a location has never run a platform at all, the cap is that
            platform&rsquo;s typical month across the locations that have.
          </p>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">How far to trust it</div></div>
        <div className="card-body method-body">
          <p>
            <strong>Thin data is treated with caution.</strong> A very low cost per application earned on a
            few hundred pounds of spend rarely holds at scale, so the planning figure is pulled toward the
            platform average. How far it moves depends on how much evidence sits behind it. A location and
            platform with a few hundred applications barely shifts. One with a handful moves a long way. The
            Benchmarks tab shows the figure the plan uses, and the data quality label on each row says how
            much of it there is.
          </p>
          <p>
            <strong>Predictions come with a range.</strong> The range on the whole plan comes from how much
            the role&rsquo;s cost per application has moved month to month across the period the plan is built
            on. It is narrower than any single location, because locations do not all miss in the same
            direction to the same degree. Each location carries its own range from its own history.
          </p>
          <p>
            <strong>Hires carry the same range as applications.</strong> Predicted hires are predicted
            applications multiplied by the location&rsquo;s hire rate, so fewer applications means fewer hires
            at the same rate. Hire rates are never windowed, because hires lag by several weeks and a short
            period never holds enough of them to mean anything.
          </p>
          <p>
            <strong>Cost per hire is worked out, not looked up.</strong> It is the cost per application divided
            by the hire rate, so any row you see adds up: spend, applications, hire rate and cost per hire all
            agree with each other. Hire rates come from the file RAC provided, at location and platform level.
          </p>
          <p>
            <strong>Budget can be worked back from a target.</strong> Predicted applications scale with the
            deployable budget, so the tool reports the budget needed to land the central estimate on the
            target, hold-backs included.
          </p>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">Which data this is built on</div>
          <div className="card-sub">
            SMR {benchLabel(benchFor(state, 'SMR'))} &middot; Patrol {benchLabel(benchFor(state, 'Patrol'))}
          </div>
        </div>
        <div className="card-body method-body">
          <p>
            Applications are counted from the ad platforms for Meta, Google and Appcast, and from Eploy for
            Indeed. Google means Google Search only. Demand Gen, Acast, brand, competitor and remarketing
            campaigns are non-standard and never reach the plan.
          </p>
          <p>
            Spend that is not tagged to a location is left out rather than spread across locations, so a
            location figure only holds what actually happened there. Campaigns on a different project code
            are excluded outright.
          </p>
          <p>
            The dataset runs {monthShort(first)} to {monthShort(last)}. The window it plans on is set on the
            Benchmarks tab, and each role can sit on its own period. Changing it changes the cost per
            application, the range, and every figure that follows from them.
          </p>
          <p>
            The PDF carries two sets of notes, written on Setup: one on the legacy plan and one on this plan.
            They print as their own pages, in that order, and run onto a second page where there are more than
            six points. There is a second export button that produces the same document without them.
          </p>
        </div>
      </div>
    </div>
  );
}

// COMPARE - two saved plans for the same month, side by side.

function CompareView({ month, container, onClose }) {
  const versions = container.versions || [];
  const [leftId, setLeftId] = useState(versions.length > 1 ? versions[versions.length - 2].id : (versions[0] || {}).id);
  const [rightId, setRightId] = useState((versions[versions.length - 1] || {}).id);

  const runOf = (id) => {
    const v = versions.find(x => x.id === id);
    if (!v) return null;
    const s = composePlannerState(month, { ...container, working: v.planner }, v.demand);
    const out = { version: v, state: s, roles: {} };
    ROLES.forEach(role => {
      const plan = buildFundingPlan(role, { ...planParams(role, s), appTarget: s.appTarget[role] || 0 });
      out.roles[role] = plan;
    });
    return out;
  };
  const L = useMemo(() => runOf(leftId), [leftId, container, month]);
  const R = useMemo(() => runOf(rightId), [rightId, container, month]);

  if (versions.length < 2) {
    return (
      <div className="card">
        <div className="card-head">
          <div className="card-title">Nothing to compare yet</div>
          <div className="card-sub">Save at least two plans for this month</div>
        </div>
        <div className="card-body">
          <div className="help-text" style={{ marginBottom: 12 }}>
            Comparison puts two saved plans for the same month side by side, so you can see what a change
            of budget or hire target actually did. There
            {' '}{versions.length === 1 ? 'is one saved plan' : 'are no saved plans'} for
            {' '}{(DATA.month_labels && DATA.month_labels[month]) || month} so far.
          </div>
          <button className="btn btn-sm" onClick={onClose}>Back to the plan</button>
        </div>
      </div>
    );
  }

  const rows = [];
  ROLES.forEach(role => {
    const l = L && L.roles[role], r = R && R.roles[role];
    if (!l || !r) return;
    rows.push({ head: role + ' - ' + ROLE_FULL[role] });
    rows.push({ k: 'Budget', l: fmtGBP(l.budget), r: fmtGBP(r.budget), d: r.budget - l.budget, money: true });
    rows.push({ k: 'Hire target', l: fmtInt(L.state.hireTarget[role] || 0), r: fmtInt(R.state.hireTarget[role] || 0), d: (R.state.hireTarget[role] || 0) - (L.state.hireTarget[role] || 0) });
    rows.push({ k: 'Application target', l: fmtInt(l.appTarget), r: fmtInt(r.appTarget), d: r.appTarget - l.appTarget });
    rows.push({ k: 'Predicted applications', l: fmtInt(l.predictedApps), r: fmtInt(r.predictedApps), d: r.predictedApps - l.predictedApps });
    rows.push({ k: 'Predicted hires', l: l.predictedHires.toFixed(1), r: r.predictedHires.toFixed(1), d: r.predictedHires - l.predictedHires });
    rows.push({
      k: 'Blended cost per application',
      l: fmtGBP(l.predictedApps > 0 ? l.deployable / l.predictedApps : 0),
      r: fmtGBP(r.predictedApps > 0 ? r.deployable / r.predictedApps : 0),
      d: (r.predictedApps > 0 ? r.deployable / r.predictedApps : 0) - (l.predictedApps > 0 ? l.deployable / l.predictedApps : 0),
      money: true, lowerBetter: true,
    });
    rows.push({ k: 'Locations funded', l: fmtInt(l.totalCount), r: fmtInt(r.totalCount), d: r.totalCount - l.totalCount });
    rows.push({ k: 'Deployable after hold-backs', l: fmtGBP(l.deployable), r: fmtGBP(r.deployable), d: r.deployable - l.deployable, money: true });
  });

  const picker = (value, onChange) => (
    <select value={value} onChange={e => onChange(e.target.value)}>
      {versions.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
    </select>
  );

  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          Two saved plans for {(DATA.month_labels && DATA.month_labels[month]) || month}, side by side.
        </div>
      </div>
      <div className="card">
        <div className="card-head">
          <div className="card-title">Compare saved plans</div>
          <div className="spacer" style={{ flex: 1 }} />
          <button className="btn btn-sm" onClick={onClose}>Back to the plan</button>
        </div>
        <div className="card-body" style={{ padding: 0 }}>
          <div className="cmp-grid">
            <div className="cmp-head">&nbsp;</div>
            <div className="cmp-head">{picker(leftId, setLeftId)}</div>
            <div className="cmp-head">{picker(rightId, setRightId)}</div>
            {rows.map((row, i) => row.head ? (
              <React.Fragment key={i}>
                <div className="cmp-head">{row.head}</div>
                <div className="cmp-head">&nbsp;</div>
                <div className="cmp-head">&nbsp;</div>
              </React.Fragment>
            ) : (
              <React.Fragment key={i}>
                <div className="cmp-key">{row.k}</div>
                <div className="mono">{row.l}</div>
                <div className="mono">
                  {row.r}
                  {Math.abs(row.d) > 0.05 && (
                    <span className="cmp-diff" style={{
                      color: (row.lowerBetter ? row.d < 0 : row.d > 0) ? 'var(--good)' : 'var(--bad)',
                    }}>
                      {row.d > 0 ? '+' : '-'}{row.money ? fmtGBP(Math.abs(row.d)) : fmtInt(Math.abs(row.d))}
                    </span>
                  )}
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>
      {L && R && (L.version.note || R.version.note) && (
        <div className="card">
          <div className="card-head"><div className="card-title">Notes</div></div>
          <div className="card-body">
            <div className="help-text" style={{ marginBottom: 8 }}>
              <strong>{L.version.name}.</strong> {L.version.note || 'No note.'}
            </div>
            <div className="help-text">
              <strong>{R.version.name}.</strong> {R.version.note || 'No note.'}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [ws, setWsRaw] = useState(() => {
    const saved = lsGet('v3-workspace', null);
    if (saved && saved.months && saved.current && saved.months[saved.current]) return saved;
    return defaultWorkspace();
  });
  const [sync, setSync] = useState('loading');
  const pushRef = useRef(null);
  // True between a change and its push landing. A pull during that window
  // would fetch the older shared copy and wipe the change.
  const pendingRef = useRef(false);

  const pull = React.useCallback(async () => {
    if (pendingRef.current) return;   // our own change has not gone up yet
    try {
      const remote = await sbGet('workspace');
      if (remote && remote.months && remote.current) {
        // Never replace newer work with an older shared copy. Writes failed
        // silently for five days in July and the reload was pulling a stale
        // copy over the top of what had just been done.
        const localAt = Number(localStorage.getItem('v3-workspace-at') || 0);
        const remoteAt = Date.parse(remote._savedAt || '') || 0;
        if (localAt && remoteAt && localAt > remoteAt) {
          setSync('ok');
          return;   // ours is newer; the next change pushes it up
        }
        setWsRaw(remote);
        lsSet('v3-workspace', remote);
      }
      setSync('ok');
    } catch (e) { setSync('offline'); }
  }, []);

  // Load shared state on open, and again when the tab is looked at, so
  // someone else's saved plan turns up without a refresh.
  useEffect(() => {
    if (sbCatchSession()) setSync('loading');
    pull();
    const onFocus = () => pull();
    window.addEventListener('focus', onFocus);
    return () => window.removeEventListener('focus', onFocus);
  }, [pull]);

  const setWs = (updater) => {
    setWsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      lsSet('v3-workspace', next);
      // Local first so typing stays instant, shared a moment later.
      pendingRef.current = true;
      next._savedAt = new Date().toISOString();
      try { localStorage.setItem('v3-workspace-at', String(Date.now())); } catch (e) {}
      clearTimeout(pushRef.current);
      pushRef.current = setTimeout(() => {
        setSync('saving');
        const attempt = (n) => sbSet('workspace', next)
          .then(() => { pendingRef.current = false; setSync('ok'); })
          .catch(() => {
            setSync('offline');
            if (n < 4) setTimeout(() => attempt(n + 1), 2000 * (n + 1));
            else pendingRef.current = false;
          });
        attempt(0);
      }, 800);
      return next;
    });
  };

  // Presence lives here rather than in Root, because the header that shows it
  // is in this component. It was declared a level up and the header could not
  // see it, which blanked the page.
  const [present, setPresent] = useState([]);
  useEffect(() => {
    let live = true;
    const beat = async () => {
      await sbPresencePing(null);
      if (!live) return;
      const who = await sbPresenceList();
      if (live) setPresent(who);
    };
    beat();
    const id = setInterval(beat, PRESENCE_EVERY);
    const onVis = () => { if (!document.hidden) beat(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      live = false;
      clearInterval(id);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  const [tool, setTool] = useState(() => (routeFromHash() || {}).tool || 'planner');
  // One role selector for the whole planner. Plan, Platforms and Benchmarks
  // each used to keep their own, all defaulting to SMR, so setting a benchmark
  // window on one tab and exporting from another silently applied it to the
  // wrong role. The benchmark is stored per role, so the plan came out built
  // on all time data with no sign anything was wrong.
  const [roleView, setRoleView] = useState('SMR');
  const [tab, setTab] = useState(() => (routeFromHash() || {}).tab || 'setup');
  const [comparing, setComparing] = useState(false);

  const month = ws.current;
  const container = ws.months[month] || newMonth(ws, month);

  const patchMonth = (patch) => setWs(w => ({
    ...w,
    months: { ...w.months, [month]: { ...(w.months[month] || newMonth(w, month)), ...patch } },
  }));

  const chooseMonth = (m) => setWs(w => ({
    ...w,
    current: m,
    months: w.months[m] ? w.months : { ...w.months, [m]: newMonth(w, m) },
  }));

  // The planner works on `working`. Saving takes a copy of it.
  const setPlanner = (updater) => patchMonth({
    working: typeof updater === 'function' ? updater(container.working) : updater,
  });

  const plannerState = useMemo(() => composePlannerState(month, container), [month, container]);
  // The planner writes back its own fields only. Demand, live locations and
  // the application target are derived, so they are stripped on the way in.
  const setPlannerState = (updater) => setPlanner(w => {
    const composed = composePlannerState(month, { ...container, working: w });
    const next = typeof updater === 'function' ? updater(composed) : updater;
    const out = { ...next };
    delete out.vacancies; delete out.liveRegions; delete out.appTarget; delete out.planMonth;
    return out;
  });

  const loadedVersion = (container.versions || []).find(v => v.id === container.loaded) || null;
  const dirty = loadedVersion
    ? JSON.stringify(loadedVersion.planner) !== JSON.stringify(container.working)
    : (container.versions || []).length > 0;

  const saveVersion = () => {
    const versions = container.versions || [];
    const id = 'v' + Date.now();
    const monthName = (DATA.month_labels && DATA.month_labels[month]) || month;
    const name = 'RAC Media Budgets - ' + monthName + ' v' + (versions.length + 1);
    // Freeze the open-role counts too. A plan is a statement made on a day,
    // and pacing against one whose demand keeps moving would mean the plan
    // quietly follows reality and can never be missed.
    const entry = { id, name, note: '', saved: new Date().toISOString(),
      planner: JSON.parse(JSON.stringify(container.working)),
      demand: JSON.parse(JSON.stringify((container.working && container.working.demandOverride) || container.demand || {})),
      bench: JSON.parse(JSON.stringify((container.working && container.working.bench) || {})),
      demandDate: (container.working && container.working.demandDate) || null };
    patchMonth({ versions: [...versions, entry], loaded: id });
  };

  const renameVersion = (id) => {
    const v = (container.versions || []).find(x => x.id === id);
    if (!v) return;
    const name = window.prompt('Name for this plan', v.name);
    if (!name || !name.trim()) return;
    const note = window.prompt('A short note on what this plan is (optional)', v.note || '');
    patchMonth({ versions: container.versions.map(x =>
      x.id === id ? { ...x, name: name.trim(), note: note == null ? (x.note || '') : note } : x) });
  };

  const deleteVersion = (id) => {
    const v = (container.versions || []).find(x => x.id === id);
    if (!v) return;
    const ok = window.confirm('Delete "' + v.name + '"?\n\nThis cannot be undone. Any pacing measured against it will need a different plan.');
    if (!ok) return;
    patchMonth({
      versions: container.versions.filter(x => x.id !== id),
      loaded: container.loaded === id ? null : container.loaded,
    });
  };

  // Loading a plan restores everything it was built on, not just the numbers
  // typed into it: the benchmark window it used and the open roles as they
  // stood at the time. Otherwise an old plan is re-costed on today's data and
  // stops being the plan that was issued.
  const loadVersion = (id) => {
    const v = (container.versions || []).find(x => x.id === id);
    if (!v) { patchMonth({ loaded: null }); return; }
    const planner = JSON.parse(JSON.stringify(v.planner));
    if (v.demand && Object.keys(v.demand).length) {
      planner.demandOverride = JSON.parse(JSON.stringify(v.demand));
    }
    planner.demandDate = v.demandDate || null;
    // The window is part of the plan, so it comes back with it.
    if (v.bench) planner.bench = JSON.parse(JSON.stringify(v.bench));
    setWs(w => ({
      ...w,
      months: { ...w.months, [month]: { ...(w.months[month] || newMonth(w, month)), working: planner, loaded: id } },
    }));
  };

  // Address bar follows the view, so refreshing lands you back where you were
  // and a link points at something specific. Setting the hash pushes a history
  // entry, which is what makes the back button walk through the tabs.
  useEffect(() => {
    const want = '#' + tool + (tool === 'planner' ? '/' + tab : '');
    if (window.location.hash !== want) window.location.hash = want;
  }, [tool, tab]);

  // And the view follows the address bar, for back, forward and pasted links.
  useEffect(() => {
    const onHash = () => {
      const r = routeFromHash();
      if (!r) return;
      setTool(r.tool);
      if (r.tab) setTab(r.tab);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const tabs = [
    { id: 'setup', label: 'Setup' },
    { id: 'plan', label: 'Plan' },
    { id: 'platforms', label: 'Platforms' },
    { id: 'benchmarks', label: 'Benchmarks' },
    { id: 'method', label: 'Method' },
  ];

  const monthLabel = (DATA.month_labels && DATA.month_labels[month]) || month;
  const versions = container.versions || [];

  return (
    <div className="app">
      <div className="app-header">
        <img className="logo-mark" alt="RAC"

        <div>
          <h1>RAC Tool Suite</h1>
          <div className="sub">
            Enhance Media &middot; {monthLabel}
            {' '}&middot; SMR {benchLabel(benchFor(plannerState, 'SMR'))}
            {' '}&middot; Patrol {benchLabel(benchFor(plannerState, 'Patrol'))}
          </div>
        </div>
        <div className="spacer" />
        {present.length > 0 && (
          <div className="presence" title="Signed in right now">
            {present.map(w => (
              <div key={w.email}
                className={'who' + (w.email === sbEmail() ? ' me' : '')}
                title={w.email + (w.where ? ' \u00B7 ' + w.where : '')}>
                {initialsFor(w.email)}
              </div>
            ))}
          </div>
        )}
        <a href="#" className="link-inline" style={{ marginRight: 12, fontSize: 12 }}
          title="Download everything in this browser as a file"
          onClick={e => {
            e.preventDefault();
            const blob = new Blob([JSON.stringify(ws, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rac-tools-backup-' + todayISO() + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
          }}>Back up</a>
        <span className={'sync sync-' + sync} title={
          sync === 'ok' ? 'Saved for everyone'
            : sync === 'saving' ? 'Saving'
            : sync === 'offline' ? 'Could not reach the server. Retrying.'
            : 'Loading'}>
          {sync === 'ok' ? 'Saved' : sync === 'saving' ? 'Saving'
            : sync === 'offline' ? 'Reconnecting' : 'Loading'}
        </span>

        {tool === 'planner' && (
          <>
            <div className="role-switch" style={{ marginRight: 10 }}>
              {ROLES.map(r => (
                <button key={r} className={r === roleView ? 'active' : ''}
                  onClick={() => setExportRole(r)}>{r}</button>
              ))}
            </div>
            <button className="btn btn-sm" style={{ marginRight: 8 }}
              onClick={() => exportWorkings(plannerState, roleView)}>
              Workings
            </button>
            <button className="btn btn-sm" style={{ marginRight: 8 }}
              title="The same document without the notes pages"
              onClick={() => exportPDF(plannerState, roleView, { notes: false })}>
              PDF, no notes
            </button>
            <button className="btn btn-sm btn-primary"
              title="The full document, including both commentary sections"
              onClick={() => exportPDF(plannerState, roleView)}>
              PDF
            </button>
          </>
        )}
      </div>

      <div className="shell">
        <div className="tool-rail">
          <div className="rail-label">Tools</div>
          <button className={tool === 'planner' ? 'active' : ''}
            onClick={() => { setTool('planner'); setComparing(false); }}>Monthly Budget Planner</button>
          <button className={tool === 'priorities' ? 'active' : ''}
            onClick={() => setTool('priorities')}>Location priorities</button>
          <button className={tool === 'pacing' ? 'active' : ''}
            onClick={() => setTool('pacing')}>Performance Pacing</button>
          <div style={{ flex: 1 }} />
          <div className="rail-label">Admin</div>
          <button className={tool === 'data' ? 'active' : ''}
            onClick={() => setTool('data')}>Data</button>
          <button className={tool === 'changelog' ? 'active' : ''}
            onClick={() => setTool('changelog')}>Changelog</button>
        </div>

        <div className="shell-body">
          <div className="month-bar">
            <div className="mb-group">
              <label>Month</label>
              <select value={month} onChange={e => chooseMonth(e.target.value)}>
                {(DATA.month_options || []).map(mo => (
                  <option key={mo} value={mo}>
                    {(DATA.month_labels && DATA.month_labels[mo]) || mo}
                    {ws.months[mo] ? '' : '  (new)'}
                  </option>
                ))}
              </select>
            </div>

            {tool === 'planner' && (
              <>
                <div className="mb-group">
                  <label>Plan</label>
                  <select value={container.loaded || ''} onChange={e => loadVersion(e.target.value)}>
                    <option value="">Working plan</option>
                    {versions.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                  {dirty && <span className="dirty-dot" title="Unsaved changes" />}
                </div>
                <button className="btn btn-sm" onClick={saveVersion}>Save as new plan</button>
                {loadedVersion && (
                  <>
                    <button className="btn btn-sm" onClick={() => renameVersion(loadedVersion.id)}>Rename</button>
                    <button className="btn btn-sm" onClick={() => deleteVersion(loadedVersion.id)}>Delete</button>
                  </>
                )}
                <button className="btn btn-sm" onClick={() => setComparing(c => !c)}
                  disabled={versions.length < 2}>
                  {comparing ? 'Close comparison' : 'Compare plans'}
                </button>
                {loadedVersion && loadedVersion.demandDate && (
                  <span className="version-note">roles as at {fmtDay(loadedVersion.demandDate)}</span>
                )}
                {loadedVersion && (
                  <span className="version-note">
                    SMR {benchLabel((loadedVersion.bench || {}).SMR || null)},
                    {' '}Patrol {benchLabel((loadedVersion.bench || {}).Patrol || null)}
                  </span>
                )}
                <span className="version-note">
                  {versions.length === 0
                    ? 'Nothing saved for this month yet'
                    : loadedVersion
                      ? (dirty ? 'Edited since ' + loadedVersion.name + ' was saved' : 'Showing ' + loadedVersion.name)
                      : versions.length + ' saved plan' + (versions.length === 1 ? '' : 's') + ' for this month'}
                </span>
              </>
            )}
          </div>

          {tool === 'planner' && !comparing && (
            <div className="tab-bar">
              {tabs.map(t => (
                <button key={t.id} className={'tab-btn' + (t.id === tab ? ' active' : '')}
                  onClick={() => setTab(t.id)}>{t.label}</button>
              ))}
            </div>
          )}

          <div className="main">
            {tool === 'planner' && comparing && (
              <CompareView month={month} container={container} onClose={() => setComparing(false)} />
            )}
            {tool === 'planner' && !comparing && (
              <>
                {tab === 'setup' && <SetupTab state={plannerState} setState={setPlannerState} container={container}
                  onOpenPriorities={() => setTool('priorities')} />}
                {tab === 'plan' && <PlanTab state={plannerState} setState={setPlannerState} role={roleView} setRole={setRoleView} />}
                {tab === 'platforms' && <PlatformsTab state={plannerState} role={roleView} setRole={setRoleView} />}
                {tab === 'benchmarks' && <BenchmarksTab state={plannerState} setState={setPlannerState} role={roleView} setRole={setRoleView} />}
                {tab === 'method' && <MethodTab state={plannerState} />}
              </>
            )}
            {tool === 'priorities' && (
              <PrioritiesTool container={container} patchMonth={patchMonth} month={month} ws={ws} />
            )}
            {tool === 'pacing' && <PacingTool month={month} container={container} patchMonth={patchMonth} />}
            {tool === 'data' && <DataTool />}
            {tool === 'changelog' && <ChangelogTool />}
          </div>
        </div>
      </div>

    </div>
  );
}

function Root() {
  const [inSession, setInSession] = useState(() => { sbCatchSession(); return sbSignedIn(); });
  // Folded-in months live on the server so everyone gets them without anyone
  // republishing a file. They are applied as soon as they arrive rather than
  // held in front of the app: a slow or failed request should never leave the
  // whole tool sat on a loading screen.
  const [benchStamp, setBenchStamp] = useState(0);
  useEffect(() => {
    if (!inSession) return;
    let live = true;
    (async () => {
      try {
        const [b, h] = await Promise.all([sbGet('benchmarks'), sbGet('hire_rates')]);
        if (!live) return;
        let moved = false;
        if (b && b.cells && b.months) {
          window.__RAC_BENCH__ = b;
          applyMonths(b.months, b.cells, b.lastDate);
          moved = true;
        }
        if (h && h.rates) {
          window.__RAC_HIRE__ = h;
          setHireOverride(h);
          moved = true;
        }
        if (moved) setBenchStamp(x => x + 1);
      } catch (e) { /* carry on with the numbers the file ships with */ }
    })();
    return () => { live = false; };
  }, [inSession]);

  if (!inSession) return <SignIn onIn={() => setInSession(true)} />;
  return <App key={benchStamp} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
