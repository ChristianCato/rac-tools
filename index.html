// TAB 4 - BENCHMARKS: how much past performance data backs each prediction
// ====================================================================
// For every region × platform (for the selected role) this shows the months
// of application history, total historic applications, the CPA the tool
// plans against, and the prediction band width. The operator can see at a
// glance which cells are well-evidenced and which are running on thin data.
function dataQuality(months, apps) {
  // Combined judgement of how trustworthy a cell's CPA is.
  if (months >= 6 && apps >= 60) return { label: 'Strong', kind: 'good' };
  if (months >= 3 && apps >= 20) return { label: 'Usable', kind: 'warn' };
  if (apps >= 1) return { label: 'Thin', kind: 'bad' };
  return { label: 'None', kind: 'none' };
}

function BenchmarksTab({ state }) {
  const [roleView, setRoleView] = useState('SMR');
  const role = roleView;

  // Build the full region × platform matrix for this role.
  const rows = DATA.regions_ordered.map(region => {
    const cells = PLATFORMS.map(p => {
      const monthly = getMonthly(p, region, role);
      const months = Object.values(monthly).filter(m => m && (m.completes || 0) >= 1).length;
      const stats = getStats(p, region, role);
      const apps = stats?.completes || 0;
      const spend = stats?.spend || 0;
      const band = predictionBand(p, region, role);
      const eff = effectiveCPA(p, region, role);
      const q = dataQuality(months, apps);
      return { platform: p, months, apps, spend, band, eff, q };
    });
    return { region, cells };
  });

  // Headline coverage stats across the matrix.
  const allCells = rows.flatMap(r => r.cells);
  const strong = allCells.filter(c => c.q.kind === 'good').length;
  const usable = allCells.filter(c => c.q.kind === 'warn').length;
  const thin = allCells.filter(c => c.q.kind === 'bad').length;

      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>

          location and platform, how many months of application data exist and how many applications that
          covers. <strong>Strong</strong> cells give tight, reliable ranges; <strong>thin</strong> cells fall
          back to a wide default band, so treat their predictions as indicative, not precise.

        <div className="kpi kpi-accent-good">
          <div className="kpi-label">Strong coverage</div>
          <div className="kpi-value mono">{strong}</div>
          <div className="kpi-sub">of {allCells.length} region-platform cells</div>
        </div>
        <div className="kpi kpi-accent-orange">

          <div className="kpi-sub">enough to plan against</div>

        <div className="kpi kpi-accent-navy">

      </div>

      {/* Per-platform breakdown */}
      {PLATFORMS.map(platform => {

// ====================================================================
// TAB 5 - METHOD: plain-English explanation of how the tool works
// ====================================================================
function MethodTab() {
  return (
    <div>
      <div className="card">
        <div className="card-head"><div className="card-title">How this planner works</div></div>
        <div className="card-body">
          <div className="help-text" style={{ fontSize: 13, lineHeight: 1.7 }}>
            <p style={{ marginBottom: 12 }}>
              <strong>The hire target is the input.</strong> You enter the number of hires RAC needs for the
              month. I work back from that to an application target, through the blended hire rate for the
              locations live that month. The rate is blended rather than flat, because a hire costs a very
              different number of applications in London than it does in the North West, and a single flat
              rate across every location quietly builds the wrong target.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>After that, the plan runs on applications.</strong> The job is to give RAC confidence
              that the budget will hit the application target that produces their hires. Application data is
              plentiful and updates weekly, so the tool can predict next month against a real, recent track
              record. Hires are the wider business goal, but they are thin and lag by weeks, so applications
              stay the working currency once the target is set.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Open roles come from Location priorities.</strong> How many roles are open in each
              location is kept in one place and read by the planner, rather than typed into it. That number
              decides which locations get funded and how much each one gets, so it needs one home.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Hold-backs come off the top.</strong> Two costs are taken out before anything is
              distributed: Indeed Premium (campaigns multiplied by days in the month at &pound;44 a day) and
              the Combined Activity reserve. What is left is the deployable budget, the money the
              plan actually distributes across locations.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>A coverage reserve protects every location.</strong> A set share of the deployable
              budget (10% by default) is taken off and split equally across every live location. This
              guarantees that even a location with one open role has a visible, funded presence. Without it,
              distributing purely by demand would leave the smallest locations with almost nothing.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>The rest follows demand.</strong> The remaining budget is split by open roles: a
              location with 22 of 79 open roles takes 22/79 of it. So most of the money tracks where the
              hiring need actually is, which is the logic RAC will recognise. Each location&rsquo;s spend is
              its equal coverage slice plus its demand share.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Predicted applications, by location and in total.</strong> Each location&rsquo;s
              predicted applications are its spend divided by its blended cost-per-application. RAC&rsquo;s
              total application target is split across locations by the same demand weighting, so every
              location has its own sub-target to plan against, and the headline figure is the total
              predicted against the total target.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Budget can be worked back from a target.</strong> Predicted applications scale
              directly with the deployable budget, so the tool also reports the budget needed to land the
              central estimate on RAC&rsquo;s target. That figure includes the hold-backs and the coverage
              reserve, and the &ldquo;use this budget&rdquo; button applies it in one step.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Thin data is treated with caution.</strong> Some locations show a very low
              cost-per-application earned on only a few hundred pounds of historic spend. A bargain rate at
              low volume rarely holds when spend scales up, so for thin locations the planning CPA is pulled
              toward the role benchmark. This keeps the predictions grounded rather than optimistic.
            </p>
            <p style={{ marginBottom: 12 }}>
              <strong>Predictions come with a range.</strong> Each location&rsquo;s range is built from the
              month-to-month movement in its own historic cost-per-application: a wide range means volatile
              history, a narrow one means steady. A range that turns out right builds more confidence than a
              single number that turns out wrong.
            </p>
            <p>
              <strong>Data window.</strong> Blended source covering applications reported by the ad
              platforms plus applications recorded in Eploy, RAC&rsquo;s ATS. Indeed runs October 2025 to
              May 2026; the other platforms run July 2025 to May 2026. Google and Meta spend tagged only to
              &ldquo;UK&rdquo; is redistributed across regions by each platform&rsquo;s attributed-spend
              share.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

function exportPDF(state) {
  // RAC asked for SMR and Patrol as separate PDFs, so export one per role.
  exportPlanPDF(state, ['SMR']);
  exportPlanPDF(state, ['Patrol']);
}

function exportPlanPDF(state, roleFilter) {
  const ROLES_ALL = ['SMR', 'Patrol'];
  const roles = (roleFilter && roleFilter.length ? roleFilter : ROLES_ALL)
    .filter(r => ROLES_ALL.includes(r));
  const ROLES = roles; // shadow the global so the body loops over just these
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('l', 'mm', 'a4'); // landscape
    const pageW = pdf.internal.pageSize.getWidth();  // 297
    const pageH = pdf.internal.pageSize.getHeight(); // 210
    const margin = 14;
    const NAVY = [21, 35, 59], ORANGE = [255, 102, 0], BLUE = [37, 99, 235],
          INK = [50, 60, 78], MID = [110, 122, 140], MUTED = [154, 163, 178],
          LIGHT = [245, 247, 250], LINE = [220, 226, 234],
          GREEN = [22, 134, 78], AMBER = [195, 132, 17], RED = [185, 28, 28];
    const days = (DATA.days_in_month && DATA.days_in_month[state.planMonth]) || 30;
    const monthLabel = (DATA.month_labels && DATA.month_labels[state.planMonth]) || state.planMonth;
    const cov = state.coveragePct;
    const PLATLABEL = { indeed: 'Indeed', meta: 'Meta', google: 'Google', appcast: 'Appcast' };

    // ---- helpers ----------------------------------------------------------
    function setColor(c) { pdf.setTextColor(c[0], c[1], c[2]); }
    function setFill(c) { pdf.setFillColor(c[0], c[1], c[2]); }

    function header(title, subtitle) {
      setFill(NAVY); pdf.rect(0, 0, pageW, 22, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14);
      pdf.text(title, margin, 11);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
      pdf.setTextColor(180, 195, 220);
      if (subtitle) pdf.text(subtitle, margin, 17);
      pdf.text('Prepared by Enhance Media  \u00B7  ' + monthLabel, pageW - margin, 17, { align: 'right' });
    }

    function footer(pageNum, pageTotal) {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5);
      setColor(MUTED);
      pdf.text('RAC ' + monthLabel + ' Plan  \u00B7  Enhance Media  \u00B7  Page ' + pageNum + ' of ' + pageTotal,
        margin, pageH - 6);
    }

    // ---- build plans for both roles up front -----------------------------
    const plans = {};
    ROLES.forEach(role => {
      plans[role] = buildFundingPlan(role, {
        budget: state.budget[role] || 0,
        appTarget: state.appTarget[role] || 0,
        liveRegions: state.liveRegions[role] || [],
        vacancies: (state.vacancies && state.vacancies[role]) || {},
        coveragePct: cov,
        premiumCampaigns: (state.premiumCampaigns && state.premiumCampaigns[role]) || 0,
        acReserve: (state.acReserve && state.acReserve[role]) || 0,
        platMin: (state.platMin && state.platMin[role]) || {},
        platMax: (state.platMax && state.platMax[role]) || {},
        coverage: (state.coverage && state.coverage[role]) || {},
        regionMin: (state.regionMin && state.regionMin[role]) || {},
        regionMax: (state.regionMax && state.regionMax[role]) || {},
        daysInMonth: days,
      });
    });
    // Pages: SMR, Patrol, By channel, then region x channel pages
    // (one table per page, 2 roles x 4 platforms = 8 pages), then Glossary
    // (1 or 2 pages depending on how the terms flow).
    const REGION_CHANNEL_PAGES = roles.length * 4; // roles x 4 platforms, one table per page

    // Glossary terms (defined here so we can pre-measure how many pages they need)
    const terms = [
      ['Application', 'A completed application from a candidate. We use a blended count: applications recorded by the ad platform plus applications recorded in RAC\u2019s Eploy ATS, so credit is captured wherever it lands.'],
      ['Open roles', 'The vacancies RAC has live for this role in each location, this month. Demand drives how the budget is shared between locations.'],
      ['Monthly budget', 'The total monthly spend RAC has set for this role.'],
      ['Indeed Premium', 'A fixed daily cost for Indeed\u2019s premium campaigns, held back off the top. Calculated as campaigns \u00D7 days in the month \u00D7 \u00A344 per day per campaign.'],
      ['Combined Activity', 'A flat amount held back for brand-level activity not tied to a specific location.'],
      ['Deployable budget', 'What is left after the two hold-backs. This is the money actually distributed across locations.'],
      ['Coverage reserve (10%)', 'A small share of the deployable budget, split equally across every live location. It guarantees that even a one-role location has a visible, funded presence.'],
      ['Demand pool (90%)', 'The remainder of the deployable budget. Split between locations by their share of open roles: bigger demand means a bigger share.'],
      ['App target', 'RAC\u2019s application goal for the role; the number the plan is judged against. In the table, each row\u2019s App target is that location\u2019s share, allocated by demand: a location with 22 of 79 open roles is responsible for 22/79 of the total.'],
      ['Predicted applications', 'How many applications we expect from each location\u2019s budget. Calculated as the location\u2019s budget divided by its blended cost-per-application from history.'],
      ['Cost-per-application', 'What it has cost on average to generate one application in that location, blended across all four platforms. For locations with thin data, the figure is pulled toward the role-wide average so predictions stay grounded.'],
      ['Likely range', 'A high-low range around the predicted number, built from how that location\u2019s cost-per-application has moved month-to-month. Wide range means volatile history, narrow means steady.'],
      ['Hire CVR', 'The share of applications that go on to be hired, using the SMR historical rates from the May plan. It is fixed per region and platform, not recalculated from the plan. Patrol is assumed to convert at 0.933 of the SMR rate. Three regions (North East, Wales, Northern Ireland) have no data and show as such.'],
      ['Predicted hires', 'Predicted applications multiplied by the Hire CVR. Hire numbers are small in many regions, so single-figure predictions are indicative rather than precise.'],
      ['Cost per hire', 'Spend divided by predicted hires, using the SMR historical hire rates from the May plan. Shown as n/a where there is no hire data for the region.'],
      ['Budget to hit target', 'The total spend it would take for the central prediction to land on the application target. Includes the two hold-backs and the coverage reserve.'],
      ['Platforms', 'The four conversion channels the plan distributes across: Indeed, Meta, Google (Search) and Appcast. Each location\u2019s budget is split between them in proportion to how it has been spent there historically.'],
      ['On track / Close / Short', 'A traffic-light judgement. On track: predicted apps meet or exceed target. Close: target sits inside the likely range, just not the central estimate. Short: even the top of the likely range is below target.'],
    ];
    const gColW = (pageW - margin * 2 - 6) / 2;
    // Pre-measure glossary: walk the same column/page flow used to render it,
    // counting how many pages the terms occupy.
    function countGlossaryPages() {
      let pages = 1, col = 0, y = 30;
      terms.forEach(t => {
        const split = pdf.splitTextToSize(t[1], gColW - 4);
        const blockH = 5 + split.length * 3.6 + 4;
        if (y + blockH > pageH - 14) {
          if (col === 0) { col = 1; y = 30; }
          else { pages++; col = 0; y = 30; }
        }
        y += blockH + 1;
      });
      return pages;
    }
    const GLOSSARY_PAGES = countGlossaryPages();
    const TOTAL_PAGES = roles.length + 1 + REGION_CHANNEL_PAGES + GLOSSARY_PAGES; // role pages + By channel + region x channel + glossary

    // ---- one page per role -----------------------------------------------
    ROLES.forEach((role, roleIdx) => {
      if (roleIdx > 0) pdf.addPage();
      header('RAC ' + monthLabel + ' Plan, ' + role + ': ' + ROLE_FULL[role],
        'Your budget, where it goes, and how many applications it is predicted to deliver');

      const plan = plans[role];
      const pct = Math.round(plan.pctOfTarget * 100);
      const premiumCamp = (state.premiumCampaigns && state.premiumCampaigns[role]) || 0;

      // === Verdict banner ===
      const tier = plan.appTarget <= 0 ? 'none'
        : plan.onTarget ? 'good'
        : (plan.predHigh >= plan.appTarget ? 'close' : 'short');
      const tierColor = tier === 'good' ? GREEN : tier === 'close' ? AMBER
        : tier === 'short' ? RED : BLUE;
      const tierTitle = tier === 'good' ? 'On track to hit your application target'
        : tier === 'close' ? 'Close to your target, just short of centred on it'
        : tier === 'short' ? 'Predicted to fall short of your application target'
        : 'No application target set';
      let y = 28;
      setFill(tierColor); pdf.rect(margin, y, pageW - margin * 2, 16, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
      pdf.text(tierTitle, margin + 5, y + 6.5);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5);
      let line2 = 'Predicted ' + fmtInt(plan.predictedApps) + ' applications (likely between '
        + fmtInt(plan.predLow) + ' and ' + fmtInt(plan.predHigh) + ')';
      if (plan.appTarget > 0) line2 += '  \u00B7  Target ' + fmtInt(plan.appTarget) + '  \u00B7  ' + pct + '% of target';
      if (tier === 'short' && plan.budgetForTarget > 0)
        line2 += '  \u00B7  Budget to hit target: ' + fmtGBP(plan.budgetForTarget);
      pdf.text(line2, margin + 5, y + 12);
      y += 20;

      // === Two columns: budget flow + KPI tiles ===
      const colGap = 6;
      const colW = (pageW - margin * 2 - colGap) / 2;
      const leftX = margin;
      const rightX = margin + colW + colGap;
      const blockTop = y;
      const blockH = 64;

      // -- Budget flow card (left) --
      pdf.setDrawColor(LINE[0], LINE[1], LINE[2]); pdf.setLineWidth(0.3);
      setFill(LIGHT); pdf.rect(leftX, y, colW, blockH, 'FD');
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
      pdf.text('How your budget breaks down', leftX + 5, y + 6.5);
      setColor(MID); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
      pdf.text('Hold-backs come off the top, then we split what is left', leftX + 5, y + 10.5);

      function row(label, math, value, opts) {
        opts = opts || {};
        const rx = leftX + 5;
        const vx = leftX + colW - 5;
        pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal'); pdf.setFontSize(9);
        setColor(opts.bold ? NAVY : INK);
        pdf.text(label, rx, by);
        if (math) {
          pdf.setFont('helvetica', 'italic'); pdf.setFontSize(7.3);
          setColor(MID);
          pdf.text(math, rx, by + 3.4);
        }
        pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal'); pdf.setFontSize(opts.bold ? 10 : 9);
        setColor(opts.bold ? NAVY : INK);
        pdf.text(value, vx, by, { align: 'right' });
      }

      let by = y + 16;
      const lineGap = 8;
      row('Monthly budget', null, fmtGBP(plan.budget), { bold: true }); by += 6;
      row('Indeed Premium', premiumCamp + ' campaigns \u00D7 ' + days + ' days \u00D7 \u00A344/day',
        fmtGBP(plan.premiumHoldback)); by += lineGap;
      row('Combined Activity', 'Held back for brand-level activity',
        fmtGBP(plan.acHoldback)); by += lineGap;
      pdf.setDrawColor(LINE[0], LINE[1], LINE[2]);
      pdf.line(leftX + 5, by - 2.5, leftX + colW - 5, by - 2.5);
      row('Deployable budget', 'What we actually distribute across locations',
        fmtGBP(plan.deployable), { bold: true }); by += lineGap;
      const perLoc = plan.totalCount > 0 ? plan.coverageReserve / plan.totalCount : 0;
      row('Coverage reserve (' + cov + '%)',
        fmtGBP(plan.coverageReserve) + ' \u00F7 ' + plan.totalCount + ' locations = ' + fmtGBP(perLoc) + ' each',
        fmtGBP(plan.coverageReserve)); by += lineGap;
      row('Demand pool (' + (100 - cov) + '%)',
        'Split between locations by their share of open roles',
        fmtGBP(plan.demandPool));

      // -- KPI tiles (right) --
      const tileW = (colW - colGap) / 2;
      const tileH = (blockH - colGap) / 2;
      function tile(x, y2, label, value, sub, accent) {
        setFill(accent); pdf.rect(x, y2, 2.5, tileH, 'F');
        setFill([255, 255, 255]); pdf.setDrawColor(LINE[0], LINE[1], LINE[2]);
        pdf.rect(x + 2.5, y2, tileW - 2.5, tileH, 'FD');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7);
        setColor(MID);
        pdf.text(label.toUpperCase(), x + 6, y2 + 6);
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16);
        setColor(NAVY);
        pdf.text(value, x + 6, y2 + 17);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
        setColor(INK);
        pdf.text(sub, x + 6, y2 + 25);
      }
      tile(rightX, blockTop, 'Predicted applications', fmtInt(plan.predictedApps),
        'likely ' + fmtInt(plan.predLow) + '\u2013' + fmtInt(plan.predHigh), ORANGE);
      tile(rightX + tileW + colGap, blockTop, 'Application target',
        plan.appTarget > 0 ? fmtInt(plan.appTarget) : 'Not set',
        plan.appTarget > 0 ? 'plan delivers ' + pct + '%' : 'not set', NAVY);
      tile(rightX, blockTop + tileH + colGap, 'Predicted hires', plan.predictedHires.toFixed(1),
        plan.predictedHires > 0 ? fmtGBP(plan.deployable / plan.predictedHires) + ' per hire' : 'from RAC hire rates', BLUE);
      const gap = plan.budgetForTarget - plan.budget;
      tile(rightX + tileW + colGap, blockTop + tileH + colGap, 'Budget to hit target',
        plan.budgetForTarget > 0 ? fmtGBP(plan.budgetForTarget) : '-',
        plan.budgetForTarget <= 0 ? '' :
          gap > 50 ? fmtGBP(gap) + ' more than now' :
          gap < -50 ? fmtGBP(-gap) + ' less than now' : 'matches your budget',
        GREEN);

      y = blockTop + blockH + 6;

      // === Per-location table with platform splits ===
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
      pdf.text('Where the budget goes: by location and platform', margin, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
      setColor(MID);
      pdf.text('Budget split is based on each location\u2019s historic platform mix. We put money where it has been working.',
        margin, y + 4);
      y += 7;

      // Column positions for a 10-column table across 269mm
      const cx = {
        loc:   margin + 2,
        roles: margin + 50,
        indeed: margin + 75,
        meta:   margin + 100,
        google: margin + 125,
        appcast: margin + 150,
        total: margin + 178,
        tgt:   margin + 203,
        pred:  margin + 226,
        range: margin + 248,
      };
      // Header
      setFill(NAVY); pdf.rect(margin, y, pageW - margin * 2, 7, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
      pdf.text('Location', cx.loc, y + 4.7);
      pdf.text('Open roles', cx.roles, y + 4.7);
      pdf.text('Indeed', cx.indeed, y + 4.7);
      pdf.text('Meta', cx.meta, y + 4.7);
      pdf.text('Google', cx.google, y + 4.7);
      pdf.text('Appcast', cx.appcast, y + 4.7);
      pdf.text('Budget', cx.total, y + 4.7);
      pdf.text('App target', cx.tgt, y + 4.7);
      pdf.text('Predicted', cx.pred, y + 4.7);
      pdf.text('Likely range', cx.range, y + 4.7);
      y += 7;

      pdf.setFont('helvetica', 'normal'); setColor(INK);
      const rows = plan.locations.slice().sort((a, b) => (b.vacancies - a.vacancies) || (b.predApps - a.predApps));
      const ROWH = 6;
      rows.forEach((r, i) => {
        if (i % 2 === 1) {
          setFill(LIGHT); pdf.rect(margin, y, pageW - margin * 2, ROWH, 'F');
        }
        pdf.setFontSize(8.5); setColor(INK);
        pdf.text(r.region, cx.loc, y + 4.1);
        pdf.text(String(r.vacancies), cx.roles, y + 4.1);
        pdf.text(fmtGBP(r.platSpend.indeed),  cx.indeed,  y + 4.1);
        pdf.text(fmtGBP(r.platSpend.meta),    cx.meta,    y + 4.1);
        pdf.text(fmtGBP(r.platSpend.google),  cx.google,  y + 4.1);
        pdf.text(fmtGBP(r.platSpend.appcast), cx.appcast, y + 4.1);
        pdf.setFont('helvetica', 'bold');
        pdf.text(fmtGBP(r.spend), cx.total, y + 4.1);
        pdf.setFont('helvetica', 'normal');
        pdf.text(fmtInt(r.appSubTarget), cx.tgt, y + 4.1);
        pdf.text(fmtInt(r.predApps),     cx.pred, y + 4.1);
        pdf.text(fmtInt(r.predLow) + '\u2013' + fmtInt(r.predHigh), cx.range, y + 4.1);
        y += ROWH;
      });
      // Total row
      setFill(NAVY); pdf.rect(margin, y, pageW - margin * 2, 7, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', cx.loc, y + 4.7);
      pdf.text(String(plan.totalVac), cx.roles, y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.indeed),  cx.indeed,  y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.meta),    cx.meta,    y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.google),  cx.google,  y + 4.7);
      pdf.text(fmtGBP(plan.platformTotals.appcast), cx.appcast, y + 4.7);
      pdf.text(fmtGBP(rows.reduce((s, r) => s + r.spend, 0)), cx.total, y + 4.7);
      pdf.text(fmtInt(plan.appTarget), cx.tgt, y + 4.7);
      pdf.text(fmtInt(plan.predictedApps), cx.pred, y + 4.7);
      pdf.text(fmtInt(plan.predLow) + '\u2013' + fmtInt(plan.predHigh), cx.range, y + 4.7);
      y += 7;

      // Helpful note under the table. If it won't fit above the footer,
      // shrink it; if even that doesn't fit, drop it (the table itself is the
      // important content; the note is supporting prose).
      pdf.setFont('helvetica', 'italic'); pdf.setFontSize(7.8);
      setColor(MID);
      const note = 'Each location\u2019s app target is RAC\u2019s total split by demand (open roles). '
        + 'Predicted applications = location budget \u00F7 the blended cost-per-application from that '
        + 'location\u2019s history. The likely range reflects how that cost has moved month-to-month.';
      const noteLines = pdf.splitTextToSize(note, pageW - margin * 2);
      const noteH = noteLines.length * 3.2 + 4;
      if (y + noteH <= pageH - 12) {
        pdf.text(noteLines, margin, y + 4);
      }
      // If the note doesn't fit, it's dropped silently - the table is what
      // matters and the glossary on the final page explains the same logic.

      footer(roleIdx + 1, TOTAL_PAGES);
    });

    // ---- By channel page -------------------------------------------------
    // Per-role channel summary the client can copy straight into their tracker.
    // Each role gets a small table: Platform, Spend, Share, Predicted apps, CPA, Range.
    pdf.addPage();
    header('By channel', null);
    let cy = 30;
    ROLES.forEach((role, idx) => {
      const plan = plans[role];
      // Role heading
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
      pdf.text(role + ': ' + ROLE_FULL[role], margin, cy);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); setColor(MID);
      pdf.text('Spend across the four conversion platforms, with predicted applications and cost-per-application using each platform\u2019s historic rate for this role.',
        margin, cy + 4.5);
      cy += 9;

      // Column positions (landscape page, eight columns including hire metrics)
      const cc = {
        plat:   margin + 2,
        spend:  margin + 42,
        share:  margin + 78,
        apps:   margin + 104,
        cpa:    margin + 134,
        hcvr:   margin + 170,
        hires:  margin + 200,
        cph:    margin + 226,
      };
      // Header row
      setFill(NAVY); pdf.rect(margin, cy, pageW - margin * 2, 7, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
      pdf.text('Platform',        cc.plat,  cy + 4.7);
      pdf.text('Spend',           cc.spend, cy + 4.7);
      pdf.text('Apply CVR',       cc.share, cy + 4.7);
      pdf.text('Apps',            cc.apps,  cy + 4.7);
      pdf.text('Cost / app',      cc.cpa,   cy + 4.7);
      pdf.text('Hire CVR',        cc.hcvr,  cy + 4.7);
      pdf.text('Hires',           cc.hires, cy + 4.7);
      pdf.text('Cost / hire',     cc.cph,   cy + 4.7);
      cy += 7;

      // Rows
      pdf.setFont('helvetica', 'normal'); setColor(INK);
      let totalApps = 0, totalHires = 0;
      const CHROW = 10; // taller rows to fit the range sub-line
      (plan.channelSummary || []).forEach((ch, i) => {
        if (i % 2 === 1) {
          setFill(LIGHT); pdf.rect(margin, cy, pageW - margin * 2, CHROW, 'F');
        }
        setColor(INK); pdf.setFontSize(8.5);
        pdf.text(PLATFORM_LABELS[ch.platform], cc.plat, cy + 4.4);
        pdf.setFont('helvetica', 'bold');
        pdf.text(fmtGBP(ch.spend), cc.spend, cy + 4.4);
        pdf.setFont('helvetica', 'normal');
        pdf.text(ch.cvr > 0 ? (ch.cvr * 100).toFixed(1) + '%' : 'n/a', cc.share, cy + 4.4);
        pdf.text(fmtInt(ch.predApps), cc.apps, cy + 4.4);
        pdf.text(fmtGBP(ch.cpa), cc.cpa, cy + 4.4);
        pdf.text(ch.hireCvr > 0 ? (ch.hireCvr * 100).toFixed(2) + '%' : 'n/a', cc.hcvr, cy + 4.4);
        pdf.text(ch.predHires >= 0 ? ch.predHires.toFixed(1) : '0', cc.hires, cy + 4.4);
        pdf.text(ch.cph ? fmtGBP(ch.cph) : 'n/a', cc.cph, cy + 4.4);
        // Range sub-lines (apply CVR, apps, cost per app) in muted grey
        pdf.setFontSize(6.6); setColor(MUTED);
        if (ch.cvr > 0) pdf.text((ch.cvrLow * 100).toFixed(1) + '\u2013' + (ch.cvrHigh * 100).toFixed(1) + '%', cc.share, cy + 8.4);
        if (ch.predApps > 0) pdf.text(fmtInt(ch.predLow) + '\u2013' + fmtInt(ch.predHigh), cc.apps, cy + 8.4);
        if (ch.cpa > 0) pdf.text(fmtGBP(ch.cpaLow) + '\u2013' + fmtGBP(ch.cpaHigh), cc.cpa, cy + 8.4);
        setColor(INK); pdf.setFontSize(8.5);
        totalApps += ch.predApps; totalHires += ch.predHires;
        cy += CHROW;
      });
      // Total row
      setFill(NAVY); pdf.rect(margin, cy, pageW - margin * 2, 11, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', cc.plat, cy + 4.7);
      pdf.text(fmtGBP(plan.deployable), cc.spend, cy + 4.7);
      // Spend-weighted blended apply CVR across the role's platforms
      let cvrW = 0, cvrWsum = 0;
      (plan.channelSummary || []).forEach(ch => {
        if (ch.cvr > 0 && ch.spend > 0) { cvrWsum += ch.cvr * ch.spend; cvrW += ch.spend; }
      });
      const blendedCvr = cvrW > 0 ? cvrWsum / cvrW : 0;
      pdf.text(blendedCvr > 0 ? (blendedCvr * 100).toFixed(1) + '%' : 'n/a', cc.share, cy + 4.7);
      pdf.text(fmtInt(totalApps), cc.apps, cy + 4.7);
      const blendedCpa = totalApps > 0 ? plan.deployable / totalApps : 0;
      pdf.text(fmtGBP(blendedCpa), cc.cpa, cy + 4.7);
      // Blended hire CVR and CPH from totals
      pdf.text(totalApps > 0 ? (totalHires / totalApps * 100).toFixed(2) + '%' : 'n/a', cc.hcvr, cy + 4.7);
      pdf.text(totalHires.toFixed(1), cc.hires, cy + 4.7);
      pdf.text(totalHires > 0 ? fmtGBP(plan.deployable / totalHires) : 'n/a', cc.cph, cy + 4.7);
      // Total range sub-lines
      const abp = plan.aggBandPct || 35;
      pdf.setFontSize(6.6); pdf.setTextColor(200, 208, 220);
      if (blendedCvr > 0) pdf.text((blendedCvr * (1 - abp / 100) * 100).toFixed(1) + '\u2013' + (blendedCvr * (1 + abp / 100) * 100).toFixed(1) + '%', cc.share, cy + 8.4);
      if (totalApps > 0) pdf.text(fmtInt(totalApps * (1 - abp / 100)) + '\u2013' + fmtInt(totalApps * (1 + abp / 100)), cc.apps, cy + 8.4);
      if (blendedCpa > 0) pdf.text(fmtGBP(blendedCpa * (1 - abp / 100)) + '\u2013' + fmtGBP(blendedCpa * (1 + abp / 100)), cc.cpa, cy + 8.4);
      cy += 14;
    });

    footer(roles.length + 1, TOTAL_PAGES);

    // ---- Region x channel pages -----------------------------------------
    // For each role and platform, a table of all 12 regions with spend,
    // predicted apps, apply CVR, CPA, hire CVR, hires, cost per hire and the
    // likely apps range. Regions with no live vacancy show zeros; the three
    // regions RAC has no hire data for show "no data" in the hire columns.
    const rcCols = {
      region: margin + 2,
      spend:  margin + 44,
      apps:   margin + 76,
      cvr:    margin + 100,
      cpa:    margin + 124,
      hcvr:   margin + 150,
      hires:  margin + 178,
      cph:    margin + 200,
      range:  margin + 228,
    };
    function drawRegionChannelTable(role, plat, startY) {
      let ry = startY;
      const plan = plans[role];
      const rows = (plan.regionChannel && plan.regionChannel[plat]) || [];
      const RH = 11; // row height (taller to fit the range sub-line)
      // Sub-heading
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12);
      pdf.text(role + ' \u00B7 ' + PLATFORM_LABELS[plat], margin, ry);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); setColor(MID);
      pdf.text('Every region for this role and platform. Regions with no live vacancy show zero spend but keep their historic rates. Three regions have no hire data.',
        margin, ry + 5);
      ry += 10;
      // Header
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, 8, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Region',        rcCols.region, ry + 5.4);
      pdf.text('Spend',         rcCols.spend,  ry + 5.4);
      pdf.text('Apps',          rcCols.apps,   ry + 5.4);
      pdf.text('Apply CVR',     rcCols.cvr,    ry + 5.4);
      pdf.text('Cost / app',    rcCols.cpa,    ry + 5.4);
      pdf.text('Hire CVR',      rcCols.hcvr,   ry + 5.4);
      pdf.text('Hires',         rcCols.hires,  ry + 5.4);
      pdf.text('Cost / hire',   rcCols.cph,    ry + 5.4);
      pdf.text('Apps range',    rcCols.range,  ry + 5.4);
      ry += 8;
      // Rows
      pdf.setFont('helvetica', 'normal');
      let tSpend = 0, tApps = 0, tHires = 0;
      rows.forEach((r, i) => {
        if (i % 2 === 1) { setFill(LIGHT); pdf.rect(margin, ry, pageW - margin * 2, RH, 'F'); }
        // Dim regions with no live vacancy so the eye skips to the funded ones
        setColor(r.live ? INK : MID);
        pdf.setFontSize(8.5);
        pdf.text(r.region, rcCols.region, ry + 5.6);
        pdf.text(fmtGBP(r.spend), rcCols.spend, ry + 5.6);
        pdf.text(fmtInt(r.predApps), rcCols.apps, ry + 5.6);
        pdf.text(r.cvr > 0 ? (r.cvr * 100).toFixed(1) + '%' : 'n/a', rcCols.cvr, ry + 5.6);
        pdf.text(r.cpa > 0 ? fmtGBP(r.cpa) : '\u2013', rcCols.cpa, ry + 5.6);
        // Hire columns: "no data" where RAC has no hire rate for the region
        if (r.hireCvr == null) {
          pdf.text('no data', rcCols.hcvr, ry + 5.6);
          pdf.text('\u2013', rcCols.hires, ry + 5.6);
          pdf.text('\u2013', rcCols.cph, ry + 5.6);
        } else {
          pdf.text((r.hireCvr * 100).toFixed(2) + '%', rcCols.hcvr, ry + 5.6);
          pdf.text(r.predHires.toFixed(1), rcCols.hires, ry + 5.6);
          pdf.text(r.cph ? fmtGBP(r.cph) : '\u2013', rcCols.cph, ry + 5.6);
        }
        pdf.text(r.predApps > 0 ? fmtInt(r.predLow) + '\u2013' + fmtInt(r.predHigh) : '\u2013', rcCols.range, ry + 5.6);
        // Range sub-lines for apply CVR and cost per app on live rows
        if (r.spend > 0) {
          pdf.setFontSize(6.4); setColor(MUTED);
          if (r.cvr > 0) pdf.text((r.cvrLow * 100).toFixed(1) + '\u2013' + (r.cvrHigh * 100).toFixed(1) + '%', rcCols.cvr, ry + 9.2);
          if (r.cpa > 0) pdf.text(fmtGBP(r.cpaLow) + '\u2013' + fmtGBP(r.cpaHigh), rcCols.cpa, ry + 9.2);
          pdf.setFontSize(8.5);
        }
        tSpend += r.spend; tApps += r.predApps; tHires += r.predHires;
        ry += RH;
      });
      // Total
      setFill(NAVY); pdf.rect(margin, ry, pageW - margin * 2, 8, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
      pdf.text('Total', rcCols.region, ry + 5.4);
      pdf.text(fmtGBP(tSpend), rcCols.spend, ry + 5.4);
      pdf.text(fmtInt(tApps), rcCols.apps, ry + 5.4);
      pdf.text('', rcCols.cvr, ry + 5.4);
      pdf.text(tApps > 0 ? fmtGBP(tSpend / tApps) : '\u2013', rcCols.cpa, ry + 5.4);
      pdf.text(tApps > 0 ? (tHires / tApps * 100).toFixed(2) + '%' : '\u2013', rcCols.hcvr, ry + 5.4);
      pdf.text(tHires.toFixed(1), rcCols.hires, ry + 5.4);
      pdf.text(tHires > 0 ? fmtGBP(tSpend / tHires) : '\u2013', rcCols.cph, ry + 5.4);
      pdf.text('', rcCols.range, ry + 5.4);
      ry += 8;
      return ry;
    }

    // Build the list of (role, platform) tables, one per page (each table is
    // 12 regions + header + total, which fills the vertical space cleanly).
    const rcTables = [];
    ROLES.forEach(role => {
      PLATFORMS.forEach(plat => { rcTables.push({ role, plat }); });
    });
    let rcPageNum = 4;
    rcTables.forEach(tbl => {
      pdf.addPage();
      header('By region and channel', null);
      drawRegionChannelTable(tbl.role, tbl.plat, 30);
      footer(rcPageNum, TOTAL_PAGES);
      rcPageNum++;
    });

    // ---- Glossary page ---------------------------------------------------
    pdf.addPage();
    header('Glossary', null);

    const gColA = margin, gColB = margin + gColW + 6;
    let gy = 30, gCol = 0, gPageNum = roles.length + 1 + REGION_CHANNEL_PAGES + 1;
    terms.forEach(t => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      const split = pdf.splitTextToSize(t[1], gColW - 4);
      const blockH = 5 + split.length * 3.6 + 4;
      // wrap to next column / page
      if (gy + blockH > pageH - 14) {
        if (gCol === 0) { gCol = 1; gy = 30; }
        else { footer(gPageNum, TOTAL_PAGES); gPageNum++; pdf.addPage(); header('Glossary (continued)', null); gCol = 0; gy = 30; }
      }
      const gx = gCol === 0 ? gColA : gColB;
      setColor(NAVY); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5);
      pdf.text(t[0], gx, gy);
      setColor(INK); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      pdf.text(split, gx, gy + 4.5);
      gy += blockH + 1;
    });
    footer(gPageNum, TOTAL_PAGES);

    const roleTag = roles.length === 1 ? '_' + roles[0] : '';
    pdf.save('RAC_' + monthLabel.replace(' ', '_') + roleTag + '_Plan.pdf');
  } catch (e) {
    alert('PDF export failed: ' + e.message);
  }

// ====================================================================
// WORKSPACE - months, plan versions, and the shared demand numbers.
//
// A month is a container. It holds the open-role counts for that month
// (owned by Location priorities), the plan you are currently working on,
// and any plans you have saved. Saved plans are compared against each
// other, not against other months.
//
// Demand sits at month level, not inside each saved plan. That is on
// purpose: comparing two saved plans should show what changed in the
// planning, not muddle it with a change in how many roles were open.
// ====================================================================

function defaultPlannerState() {
  return {
    budget: { SMR: 35000, Patrol: 28000 },
    hireTarget: { SMR: 26, Patrol: 26 },
    coverageFloor: 1000,
    coveragePct: COVERAGE_RESERVE_DEFAULT,
    premiumCampaigns: { SMR: 3, Patrol: 3 },
    acReserve: { SMR: AC_RESERVE_DEFAULT, Patrol: AC_RESERVE_DEFAULT },
    platMin: {
      SMR: { indeed: 0, meta: 0, google: 0, appcast: 0 },
      Patrol: { indeed: 0, meta: 0, google: 0, appcast: 0 },
    },
    platMax: {
      SMR: { indeed: 0, meta: 0, google: 0, appcast: 0 },
      Patrol: { indeed: 0, meta: 0, google: 0, appcast: 0 },
    },
    coverage: { SMR: defaultCoverage('SMR'), Patrol: defaultCoverage('Patrol') },
    regionMin: { SMR: {}, Patrol: {} },
    regionMax: { SMR: {}, Patrol: {} },
  };
}

// A fresh month starts from the real snapshot for that month if there is
// one, then from whatever the previous month held, then from the dataset's
// own baseline.
function defaultDemand(ws, month) {
  const snap = DATA.demand_snapshots && DATA.demand_snapshots[month];
  if (snap) {
    const out = {};
    ROLES.forEach(role => {
      out[role] = {};
      DATA.regions_ordered.forEach(r => { out[role][r] = (snap[role] && snap[role][r]) || 0; });
    });
    return out;
  }
  const earlier = Object.keys(ws.months || {}).filter(m => m < month).sort();
  if (earlier.length) {
    const prev = ws.months[earlier[earlier.length - 1]];
    if (prev && prev.demand) return JSON.parse(JSON.stringify(prev.demand));
  }
  const out = {};
  ROLES.forEach(role => {
    out[role] = {};
    DATA.regions_ordered.forEach(r => {
      out[role][r] = (DATA.default_vacancies && DATA.default_vacancies[role] && DATA.default_vacancies[role][r]) || 0;
    });
  });
  return out;
}

function newMonth(ws, month) {
  return { demand: defaultDemand(ws, month), working: defaultPlannerState(), versions: [], loaded: null };
}

function defaultWorkspace() {
  const snaps = Object.keys(DATA.demand_snapshots || {}).sort();
  const month = snaps.length ? snaps[snaps.length - 1] : DATA.default_month;
  const ws = { current: month, months: {} };
  ws.months[month] = newMonth(ws, month);
  return ws;
}

// Everything the planner needs, assembled from the month container. The
// open-role counts and the live locations are read from demand, and the
// application target is derived from the hire target. Nothing downstream
// has to know where any of it came from.
function composePlannerState(month, container) {
  const s = { ...container.working, planMonth: month };
  s.vacancies = {};
  s.liveRegions = {};
  ROLES.forEach(role => {
    const d = (container.demand && container.demand[role]) || {};
    const vac = {};
    DATA.regions_ordered.forEach(r => { vac[r] = Math.max(0, Math.round(d[r] || 0)); });
    s.vacancies[role] = vac;
    s.liveRegions[role] = DATA.regions_ordered.filter(r => vac[r] > 0);
  });
  s.appTarget = {};
  ROLES.forEach(role => {
    s.appTarget[role] = deriveAppTarget(role, (s.hireTarget && s.hireTarget[role]) || 0, s);
  });
  return s;
}

// ====================================================================
// COMPARE - two saved plans for the same month, side by side.
// ====================================================================
function CompareView({ month, container, onClose }) {
  const versions = container.versions || [];
  const [leftId, setLeftId] = useState(versions.length > 1 ? versions[versions.length - 2].id : (versions[0] || {}).id);
  const [rightId, setRightId] = useState((versions[versions.length - 1] || {}).id);

  const runOf = (id) => {
    const v = versions.find(x => x.id === id);
    if (!v) return null;
    const s = composePlannerState(month, { ...container, working: v.planner });
    const out = { version: v, state: s, roles: {} };
    ROLES.forEach(role => {
      const plan = buildFundingPlan(role, { ...planParams(role, s), appTarget: s.appTarget[role] || 0 });
      out.roles[role] = plan;
    });
    return out;
  };
  const L = useMemo(() => runOf(leftId), [leftId, container, month]);
  const R = useMemo(() => runOf(rightId), [rightId, container, month]);

  if (versions.length < 2) {
    return (
      <div className="card">
        <div className="card-head">
          <div className="card-title">Nothing to compare yet</div>
          <div className="card-sub">Save at least two plans for this month</div>
        </div>
        <div className="card-body">
          <div className="help-text" style={{ marginBottom: 12 }}>
            Comparison puts two saved plans for the same month side by side, so you can see what a change
            of budget or hire target actually did. There
            {' '}{versions.length === 1 ? 'is one saved plan' : 'are no saved plans'} for
            {' '}{(DATA.month_labels && DATA.month_labels[month]) || month} so far.
          </div>
          <button className="btn btn-sm" onClick={onClose}>Back to the plan</button>
        </div>
      </div>
    );
  }

  const rows = [];
  ROLES.forEach(role => {
    const l = L && L.roles[role], r = R && R.roles[role];
    if (!l || !r) return;
    rows.push({ head: role + ' - ' + ROLE_FULL[role] });
    rows.push({ k: 'Budget', l: fmtGBP(l.budget), r: fmtGBP(r.budget), d: r.budget - l.budget, money: true });
    rows.push({ k: 'Hire target', l: fmtInt(L.state.hireTarget[role] || 0), r: fmtInt(R.state.hireTarget[role] || 0), d: (R.state.hireTarget[role] || 0) - (L.state.hireTarget[role] || 0) });
    rows.push({ k: 'Application target', l: fmtInt(l.appTarget), r: fmtInt(r.appTarget), d: r.appTarget - l.appTarget });
    rows.push({ k: 'Predicted applications', l: fmtInt(l.predictedApps), r: fmtInt(r.predictedApps), d: r.predictedApps - l.predictedApps });
    rows.push({ k: 'Predicted hires', l: l.predictedHires.toFixed(1), r: r.predictedHires.toFixed(1), d: r.predictedHires - l.predictedHires });
    rows.push({
      k: 'Blended cost per application',
      l: fmtGBP(l.predictedApps > 0 ? l.deployable / l.predictedApps : 0),
      r: fmtGBP(r.predictedApps > 0 ? r.deployable / r.predictedApps : 0),
      d: (r.predictedApps > 0 ? r.deployable / r.predictedApps : 0) - (l.predictedApps > 0 ? l.deployable / l.predictedApps : 0),
      money: true, lowerBetter: true,
    });
    rows.push({ k: 'Locations funded', l: fmtInt(l.totalCount), r: fmtInt(r.totalCount), d: r.totalCount - l.totalCount });
    rows.push({ k: 'Deployable after hold-backs', l: fmtGBP(l.deployable), r: fmtGBP(r.deployable), d: r.deployable - l.deployable, money: true });
  });

  const picker = (value, onChange) => (
    <select value={value} onChange={e => onChange(e.target.value)}>
      {versions.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
    </select>
  );

  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          <strong>Two saved plans, side by side.</strong> Both are for
          {' '}{(DATA.month_labels && DATA.month_labels[month]) || month}, so they share the same open-role
          counts. Anything that differs here is a planning choice, not a change in demand.
        </div>
      </div>
      <div className="card">
        <div className="card-head">
          <div className="card-title">Compare saved plans</div>
          <div className="spacer" style={{ flex: 1 }} />
          <button className="btn btn-sm" onClick={onClose}>Back to the plan</button>
        </div>
        <div className="card-body" style={{ padding: 0 }}>
          <div className="cmp-grid">
            <div className="cmp-head">&nbsp;</div>
            <div className="cmp-head">{picker(leftId, setLeftId)}</div>
            <div className="cmp-head">{picker(rightId, setRightId)}</div>
            {rows.map((row, i) => row.head ? (
              <React.Fragment key={i}>
                <div className="cmp-head">{row.head}</div>
                <div className="cmp-head">&nbsp;</div>
                <div className="cmp-head">&nbsp;</div>
              </React.Fragment>
            ) : (
              <React.Fragment key={i}>
                <div className="cmp-key">{row.k}</div>
                <div className="mono">{row.l}</div>
                <div className="mono">
                  {row.r}
                  {Math.abs(row.d) > 0.05 && (
                    <span className="cmp-diff" style={{
                      color: (row.lowerBetter ? row.d < 0 : row.d > 0) ? 'var(--good)' : 'var(--bad)',
                    }}>
                      {row.d > 0 ? '+' : '-'}{row.money ? fmtGBP(Math.abs(row.d)) : fmtInt(Math.abs(row.d))}
                    </span>
                  )}
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>
      {L && R && (L.version.note || R.version.note) && (
        <div className="card">
          <div className="card-head"><div className="card-title">Notes</div></div>
          <div className="card-body">
            <div className="help-text" style={{ marginBottom: 8 }}>
              <strong>{L.version.name}.</strong> {L.version.note || 'No note.'}
            </div>
            <div className="help-text">
              <strong>{R.version.name}.</strong> {R.version.note || 'No note.'}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [ws, setWsRaw] = useState(() => {
    const saved = lsGet('v3-workspace', null);
    if (saved && saved.months && saved.current && saved.months[saved.current]) return saved;
    return defaultWorkspace();
  });
  const setWs = (updater) => {
    setWsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      lsSet('v3-workspace', next);
      return next;
    });
  };

  const [tool, setTool] = useState('planner');
  const [tab, setTab] = useState('setup');
  const [comparing, setComparing] = useState(false);

  const month = ws.current;
  const container = ws.months[month] || newMonth(ws, month);

  const patchMonth = (patch) => setWs(w => ({
    ...w,
    months: { ...w.months, [month]: { ...(w.months[month] || newMonth(w, month)), ...patch } },
  }));

  const chooseMonth = (m) => setWs(w => ({
    ...w,
    current: m,
    months: w.months[m] ? w.months : { ...w.months, [m]: newMonth(w, m) },
  }));

  const setDemand = (updater) => patchMonth({
    demand: typeof updater === 'function' ? updater(container.demand) : updater,
  });

  // The planner works on `working`. Saving takes a copy of it.
  const setPlanner = (updater) => patchMonth({
    working: typeof updater === 'function' ? updater(container.working) : updater,
  });

  const plannerState = useMemo(() => composePlannerState(month, container), [month, container]);
  // The planner writes back its own fields only. Demand, live locations and
  // the application target are derived, so they are stripped on the way in.
  const setPlannerState = (updater) => setPlanner(w => {
    const composed = composePlannerState(month, { ...container, working: w });
    const next = typeof updater === 'function' ? updater(composed) : updater;
    const out = { ...next };
    delete out.vacancies; delete out.liveRegions; delete out.appTarget; delete out.planMonth;
    return out;
  });

  const loadedVersion = (container.versions || []).find(v => v.id === container.loaded) || null;
  const dirty = loadedVersion
    ? JSON.stringify(loadedVersion.planner) !== JSON.stringify(container.working)
    : (container.versions || []).length > 0;

  const saveVersion = () => {
    const note = window.prompt('A short note on what this plan is (optional)') || '';
    const versions = container.versions || [];
    const id = 'v' + Date.now();
    const name = 'v' + (versions.length + 1);
    const entry = { id, name, note, saved: new Date().toISOString(), planner: JSON.parse(JSON.stringify(container.working)) };
    patchMonth({ versions: [...versions, entry], loaded: id });
  };

  const loadVersion = (id) => {
    const v = (container.versions || []).find(x => x.id === id);
    if (!v) { patchMonth({ loaded: null }); return; }
    patchMonth({ working: JSON.parse(JSON.stringify(v.planner)), loaded: id });
  };

  const tabs = [
    { id: 'setup', label: 'Setup' },
    { id: 'plan', label: 'Plan' },
    { id: 'platforms', label: 'Platforms' },
    { id: 'benchmarks', label: 'Benchmarks' },
    { id: 'method', label: 'Method' },
  ];

  const monthLabel = (DATA.month_labels && DATA.month_labels[month]) || month;
  const versions = container.versions || [];

  return (
    <div className="app">
      <div className="app-header">
        <div className="logo-mark">R</div>
        <div>
          <h1>RAC Planning Tools</h1>
          <div className="sub">Enhance Media &middot; {monthLabel}</div>
        </div>
        <div className="spacer" />
        {tool === 'planner' && (
          <button className="btn btn-sm btn-primary" onClick={() => exportPDF(plannerState)}>
            Export PDF
          </button>
        )}
      </div>

      <div className="shell">
        <div className="tool-rail">
          <div className="rail-label">Tools</div>
          <button className={tool === 'planner' ? 'active' : ''}
            onClick={() => { setTool('planner'); setComparing(false); }}>Planner</button>
          <button className={tool === 'priorities' ? 'active' : ''}
            onClick={() => setTool('priorities')}>Location priorities</button>
          <button className={tool === 'pacing' ? 'active' : ''}
            onClick={() => setTool('pacing')}>
            Pacing<span className="soon">not built yet</span>
          </button>
          <div className="rail-label">About</div>
          <button className={tool === 'changelog' ? 'active' : ''}
            onClick={() => setTool('changelog')}>Changelog</button>
        </div>

        <div className="shell-body">
          <div className="month-bar">
            <div className="mb-group">
              <label>Month</label>
              <select value={month} onChange={e => chooseMonth(e.target.value)}>
                {(DATA.month_options || []).map(mo => (
                  <option key={mo} value={mo}>
                    {(DATA.month_labels && DATA.month_labels[mo]) || mo}
                    {ws.months[mo] ? '' : '  (new)'}
                  </option>
                ))}
              </select>
            </div>

            {tool === 'planner' && (
              <>
                <div className="mb-group">
                  <label>Plan</label>
                  <select value={container.loaded || ''} onChange={e => loadVersion(e.target.value)}>
                    <option value="">Working plan</option>
                    {versions.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                  {dirty && <span className="dirty-dot" title="Unsaved changes" />}
                </div>
                <button className="btn btn-sm" onClick={saveVersion}>Save as new plan</button>
                <button className="btn btn-sm" onClick={() => setComparing(c => !c)}
                  disabled={versions.length < 2}>
                  {comparing ? 'Close comparison' : 'Compare plans'}
                </button>
                <span className="version-note">
                  {versions.length === 0
                    ? 'Nothing saved for this month yet'
                    : loadedVersion
                      ? (dirty ? 'Edited since ' + loadedVersion.name + ' was saved' : 'Showing ' + loadedVersion.name)
                      : versions.length + ' saved plan' + (versions.length === 1 ? '' : 's') + ' for this month'}
                </span>
              </>
            )}
          </div>

          {tool === 'planner' && !comparing && (
            <div className="tab-bar">
              {tabs.map(t => (
                <button key={t.id} className={'tab-btn' + (t.id === tab ? ' active' : '')}
                  onClick={() => setTab(t.id)}>{t.label}</button>
              ))}
            </div>
          )}

          <div className="main">
            {tool === 'planner' && comparing && (
              <CompareView month={month} container={container} onClose={() => setComparing(false)} />
            )}
            {tool === 'planner' && !comparing && (
              <>
                {tab === 'setup' && <SetupTab state={plannerState} setState={setPlannerState}
                  onOpenPriorities={() => setTool('priorities')} />}
                {tab === 'plan' && <PlanTab state={plannerState} setState={setPlannerState} />}
                {tab === 'platforms' && <PlatformsTab state={plannerState} />}
                {tab === 'benchmarks' && <BenchmarksTab state={plannerState} />}
                {tab === 'method' && <MethodTab />}
              </>
            )}
            {tool === 'priorities' && (
              <PrioritiesTool demand={container.demand} setDemand={setDemand} month={month} />
            )}
            {tool === 'pacing' && <PacingTool month={month} container={container} />}
            {tool === 'changelog' && <ChangelogTool />}
          </div>
        </div>
      </div>

      <div className="app-footer">
        Delivered by Enhance Media &middot; Hire target sets the application target; the plan runs on applications
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
