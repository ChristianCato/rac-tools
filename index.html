// PERSISTENCE
// ====================================================================
// ponytail: PostgREST over plain fetch. The Supabase SDK is a lot of
// JavaScript for two HTTP calls. Swap it in if auth or realtime is ever
// needed; neither is today.
const SB_PROJECT = 'https://xtyqmqjgvsynoeswtkpv.supabase.co';
const SB_URL = SB_PROJECT + '/rest/v1/rac_state';
const SB_KEY = 'sb_publishable_lcxts4vXscQ6UIP4saTplA_OwlnG-c6';
let SB_TOKEN = null;
try { SB_TOKEN = JSON.parse(localStorage.getItem('rac-session') || 'null'); } catch (e) {}
const ALLOWED_DOMAIN = '@enhancemedia.co.uk';

let onSignedOut = () => {};
const sbSignedIn = () => !!(SB_TOKEN && SB_TOKEN.access_token);
function sbClear() { SB_TOKEN = null; localStorage.removeItem('rac-session'); }
function sbStore(tok) {
  // Note when the token runs out so it can be renewed early rather than on a
  // failed request.
  try {
    const body = JSON.parse(atob(tok.access_token.split('.')[1]));
    if (body && body.exp) tok.expires_at = body.exp * 1000;
  } catch (e) { /* not a readable token, fall back to renewing on failure */ }
  SB_TOKEN = tok;
  localStorage.setItem('rac-session', JSON.stringify(tok));
}

// Renew a couple of minutes before it expires, so a request never has to fail
// first.
async function sbFresh() {
  if (!SB_TOKEN || !SB_TOKEN.expires_at) return;
  if (Date.now() > SB_TOKEN.expires_at - 120000) await sbRefresh();
}

// Access tokens last about an hour. Refresh tokens are single use, so two
// requests refreshing at the same time means one of them burns a token that
// the other has already spent, and every request after that fails. Only one
// refresh is ever in flight; anything else waits for it and uses the result.
let _refreshing = null;
function sbRefresh() {
  if (_refreshing) return _refreshing;
  if (!SB_TOKEN || !SB_TOKEN.refresh_token) return Promise.resolve(false);
  const using = SB_TOKEN.refresh_token;
  _refreshing = (async () => {
    try {
      const r = await fetch(SB_PROJECT + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: using }),
      });
      if (!r.ok) return false;
      const j = await r.json();
      if (!j.access_token) return false;
      sbStore({ access_token: j.access_token, refresh_token: j.refresh_token || using });
      return true;
    } catch (e) { return false; }
    finally { setTimeout(() => { _refreshing = null; }, 0); }
  })();
  return _refreshing;
}

const sbHead = () => ({
  apikey: SB_KEY,
  Authorization: 'Bearer ' + ((SB_TOKEN && SB_TOKEN.access_token) || SB_KEY),
  'Content-Type': 'application/json',
});

// One place every request goes through, so the refresh only has to exist once.
async function sbFetch(url, opts, retry) {
  if (!retry) await sbFresh();
  const o = { ...(opts || {}) };
  o.headers = { ...sbHead(), ...((opts || {}).headers || {}) };
  const r = await fetch(url, o);
  if (r.status === 401 || r.status === 403) {
    if (!retry && await sbRefresh()) return sbFetch(url, opts, true);
    // Still refused after a fresh token, so the session is genuinely gone.
    // Say so rather than retrying forever behind a Reconnecting label.
    sbClear();
    onSignedOut();
    throw new Error('Signed out');
  }
  return r;
}

// Read and write the shared state. Both go through sbFetch, so the session is
// renewed before the request rather than after it has already been refused.
async function sbGet(key) {
  const r = await sbFetch(SB_URL + '?k=eq.' + encodeURIComponent(key) + '&select=v');
  if (!r.ok) throw new Error('Could not read ' + key + ': ' + r.status);
  const rows = await r.json();
  return rows && rows.length ? rows[0].v : null;
}

async function sbSet(key, value) {
  const r = await sbFetch(SB_URL + '?on_conflict=k', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ k: key, v: value, updated_at: new Date().toISOString() }),
  });
  if (!r.ok) {
    let detail = '';
    try { detail = ' ' + (await r.text()).slice(0, 200); } catch (e) {}
    throw new Error('Could not save ' + key + ': ' + r.status + detail);
  }
  return true;
}

// The signed-in address, read out of the access token.
function sbEmail() {
  try {
    const b = JSON.parse(atob(SB_TOKEN.access_token.split('.')[1]));
    return (b && b.email) || null;
  } catch (e) { return null; }
}

// Initials for the header. christian.cato@ becomes CC, biraag.shah@ becomes
// BS, a single-word address falls back to its first two letters.
function initialsFor(email) {
  const name = String(email || '').split('@')[0];
  const parts = name.split(/[._-]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

// Presence without a realtime client. Everyone writes their own row and reads
// everyone else's, so two people can never overwrite each other the way the
// single workspace row lets them.
const PRESENCE_EVERY = 25000;   // how often to say I am still here
const PRESENCE_STALE = 75000;   // how long before a quiet tab is dropped

async function sbPresencePing(where) {
  const email = sbEmail();
  if (!email) return;
  try {
    await sbSet('presence:' + email, { email, where: where || null, at: Date.now() });
  } catch (e) { /* presence is decoration, never let it interrupt anything */ }
}

async function sbPresenceList() {
  try {
    const r = await sbFetch(SB_URL + '?k=like.presence:*&select=k,v');
    if (!r.ok) return [];
    const rows = await r.json();
    const now = Date.now();
    return rows
      .map(x => x.v)
      .filter(v => v && v.email && now - (v.at || 0) < PRESENCE_STALE)
      .sort((a, b) => a.email.localeCompare(b.email));
  } catch (e) { return []; }
}

async function sbSendLink(email) {
  const r = await fetch(SB_PROJECT + '/auth/v1/otp', {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, create_user: true,
      options: { email_redirect_to: window.location.origin + window.location.pathname } }),
  });
  if (!r.ok) {
    let msg = 'Could not send the link.';
    try { msg = (await r.json()).msg || msg; } catch (e) {}
    throw new Error(msg);
  }
}

// Which tool and tab the address bar is pointing at.
//
// #planner/benchmarks, #priorities, #pacing, #data, #changelog. The month is
// deliberately not in here: it lives in the shared workspace, so a link that
// set it would move everyone else's month too.
const ROUTE_TOOLS = ['planner', 'priorities', 'pacing', 'data', 'changelog'];
const ROUTE_TABS = ['setup', 'plan', 'platforms', 'benchmarks', 'method'];

function routeFromHash() {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  // The sign-in link comes back with a token in the hash. Not a route.
  if (!h || h.indexOf('access_token') !== -1) return null;
  const bits = h.split('/');
  if (ROUTE_TOOLS.indexOf(bits[0]) === -1) return null;
  const tab = (bits[0] === 'planner' && ROUTE_TABS.indexOf(bits[1]) !== -1) ? bits[1] : null;
  return { tool: bits[0], tab };
}

function sbCatchSession() {
  const h = window.location.hash || '';
  if (!h.includes('access_token')) return false;
  const p = new URLSearchParams(h.slice(1));
  const tok = { access_token: p.get('access_token'), refresh_token: p.get('refresh_token') };
  if (!tok.access_token) return false;
  sbStore(tok);
  history.replaceState(null, '', window.location.pathname);
  return true;
}

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem('avp-' + key);
    return v == null ? fallback : JSON.parse(v);
  } catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem('avp-' + key, JSON.stringify(val)); } catch {}
}

// Default live regions: any region with at least one vacancy in default_vacancies.
function defaultLiveRegions(role) {
  const vac = DATA.default_vacancies?.[role] || {};
  return DATA.regions_ordered.filter(r => (vac[r] || 0) > 0);
}

// Default vacancy counts per role: a full {region: count} map for every
// region, seeded from the demand snapshot. This is the editable month
// baseline: the operator adjusts it to match what RAC has live this month.
function defaultVacancies(role) {
  const src = DATA.default_vacancies?.[role] || {};
  const out = {};
  DATA.regions_ordered.forEach(r => { out[r] = src[r] || 0; });
  return out;
}

// Default coverage: every region on for every platform, so the plan behaves
// exactly as before until the operator switches cells off. Shape is
// { region: { indeed, meta, google, appcast } } of booleans.
function defaultCoverage(role) {
  const out = {};
  DATA.regions_ordered.forEach(r => {
    out[r] = { indeed: true, meta: true, google: true, appcast: true };
  });
  return out;
}

function Pill({ kind, children }) {

function ConfDot({ conf }) {

// ====================================================================
// Coverage matrix: which platforms may run in which regions, for a role.
// Collapsed by default. Every cell on = the plan behaves as normal. Switching
// cells off is how, for example, a plan runs South East on Meta and Google only
// while other regions carry Indeed and Appcast.
// ====================================================================
function CoverageMatrix({ role, state, setState }) {
  const [open, setOpen] = useState(false);
  const cov = (state.coverage && state.coverage[role]) || {};
  const isOn = (region, plat) => {
    const c = cov[region];
    return c ? c[plat] !== false : true;
  };
  // Count off cells across the live regions only (off cells in dead regions
  // don't matter). Live = has a vacancy this month.
  const liveRegions = DATA.regions_ordered.filter(r =>
    (state.vacancies && state.vacancies[role] && state.vacancies[role][r]) > 0);
  let offCount = 0;
  liveRegions.forEach(r => PLATFORMS.forEach(p => { if (!isOn(r, p)) offCount++; }));

  const setCell = (region, plat, val) => {
    setState(prev => {
      const roleCov = { ...((prev.coverage && prev.coverage[role]) || {}) };
      const existing = roleCov[region] || { indeed: true, meta: true, google: true, appcast: true };
      roleCov[region] = { ...existing, [plat]: val };
      return { ...prev, coverage: { ...prev.coverage, [role]: roleCov } };
    });
  };
  const setColumn = (plat, val) => {
    setState(prev => {
      const roleCov = { ...((prev.coverage && prev.coverage[role]) || {}) };
      DATA.regions_ordered.forEach(region => {
        const existing = roleCov[region] || { indeed: true, meta: true, google: true, appcast: true };
        roleCov[region] = { ...existing, [plat]: val };
      });
      return { ...prev, coverage: { ...prev.coverage, [role]: roleCov } };
    });
  };
  const setRow = (region, val) => {
    setState(prev => {
      const roleCov = { ...((prev.coverage && prev.coverage[role]) || {}) };
      roleCov[region] = { indeed: val, meta: val, google: val, appcast: val };
      return { ...prev, coverage: { ...prev.coverage, [role]: roleCov } };
    });
  };
  const resetAll = () => {
    setState(prev => ({
      ...prev,
      coverage: { ...prev.coverage, [role]: defaultCoverage(role) },
      regionMin: { ...prev.regionMin, [role]: {} },
      regionMax: { ...prev.regionMax, [role]: {} },
    }));
  };
  const colOnCount = (plat) => liveRegions.filter(r => isOn(r, plat)).length;
  // Per-region budget limits (GBP). 0 means no limit.
  const minOf = (region) => (state.regionMin && state.regionMin[role] && state.regionMin[role][region]) || 0;
  const maxOf = (region) => (state.regionMax && state.regionMax[role] && state.regionMax[role][region]) || 0;
  const setLimit = (kind, region, value) => {
    setState(prev => ({
      ...prev,
      [kind]: { ...prev[kind], [role]: { ...((prev[kind] && prev[kind][role]) || {}), [region]: value } },
    }));
  };
  const limitCount = liveRegions.filter(r => minOf(r) > 0 || maxOf(r) > 0).length;

  return (
    <div style={{ marginTop: 14 }}>
      <div className="section-label" style={{ cursor: 'pointer', userSelect: 'none' }} onClick={() => setOpen(o => !o)}>
        <span style={{ display: 'inline-block', width: 14, color: 'var(--rac-orange)' }}>{open ? '\u25BE' : '\u25B8'}</span>
        Platform coverage &amp; budget limits by region
        <span className="text-muted" style={{ fontWeight: 400 }}>
          {' '}&middot; {offCount === 0 ? 'all platforms on' : offCount + ' cell' + (offCount === 1 ? '' : 's') + ' off'}
          {limitCount > 0 ? ', ' + limitCount + ' region' + (limitCount === 1 ? '' : 's') + ' capped' : ''}
        </span>
      </div>
      {open && (
        <div>
          <div className="help-text" style={{ marginBottom: 10 }}>
            Every platform is on by default and every region uncapped, which runs the plan as normal. Switch a cell
            off to keep that platform out of that region. Click a platform heading to clear or fill the column, or a
            region name to toggle the row. Set a max budget to stop a region taking more than that, the money moves
            to the other regions; set a min to guarantee a region gets at least that much. Leave a limit at &pound;0
            for no limit. Only live locations are shown.
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ borderCollapse: 'collapse', fontSize: 13, minWidth: 360 }}>
              <thead>
                <tr>
                  <th style={{ textAlign: 'left', padding: '6px 10px', borderBottom: '1px solid var(--line-c)', color: 'var(--ink-55)', fontWeight: 600 }}>Region</th>
                  {PLATFORMS.map(plat => (
                    <th key={plat} onClick={() => setColumn(plat, colOnCount(plat) === liveRegions.length ? false : true)}
                      title="Click to clear or fill this platform"
                      style={{ padding: '6px 10px', borderBottom: '1px solid var(--line-c)', color: 'var(--rac-navy)', fontWeight: 600, cursor: 'pointer', textAlign: 'center' }}>
                      {PLATFORM_LABELS[plat]}
                    </th>
                  ))}
                  <th style={{ padding: '6px 10px', borderBottom: '1px solid var(--line-c)', color: 'var(--ink-55)', fontWeight: 600, textAlign: 'center' }}>Min budget</th>
                  <th style={{ padding: '6px 10px', borderBottom: '1px solid var(--line-c)', color: 'var(--ink-55)', fontWeight: 600, textAlign: 'center' }}>Max budget</th>
                </tr>
              </thead>
              <tbody>
                {liveRegions.length === 0 && (
                  <tr><td colSpan={7} style={{ padding: 10, color: "var(--ink-35)" }}>No live locations yet. Set vacancies above first.</td></tr>
                )}
                {liveRegions.map(region => (
                  <tr key={region}>
                    <td onClick={() => { const anyOn = PLATFORMS.some(p => isOn(region, p)); setRow(region, !anyOn); }}
                      title="Click to toggle the whole region"
                      style={{ padding: '5px 10px', borderBottom: '1px solid var(--ink-04)', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                      {region}
                    </td>
                    {PLATFORMS.map(plat => {
                      const on = isOn(region, plat);
                      return (
                        <td key={plat} style={{ padding: '5px 10px', borderBottom: '1px solid var(--ink-04)', textAlign: 'center' }}>
                          <span onClick={() => setCell(region, plat, !on)}
                            title={on ? 'On' : 'Off'}
                            style={{
                              display: 'inline-block', width: 20, height: 20, lineHeight: '20px',
                              borderRadius: 5, cursor: 'pointer', fontSize: 13, fontWeight: 700,
                              background: on ? 'var(--good-lt)' : 'var(--ink-04)',
                              color: on ? 'var(--good)' : 'var(--ink-35)',
                              border: '1px solid ' + (on ? 'var(--good)' : 'var(--line-c)'),
                            }}>
                            {on ? '\u2713' : ''}
                          </span>
                        </td>
                      );
                    })}
                    <td style={{ padding: '4px 6px', borderBottom: '1px solid var(--ink-04)', textAlign: 'center' }}>
                      <input className="text-input" style={{ width: 88, padding: '4px 6px', fontSize: 12, textAlign: 'right' }}
                        value={'\u00A3' + (minOf(region)).toLocaleString('en-GB')}
                        onChange={e => setLimit('regionMin', region, parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
                    </td>
                    <td style={{ padding: '4px 6px', borderBottom: '1px solid var(--ink-04)', textAlign: 'center' }}>
                      <input className="text-input" style={{ width: 88, padding: '4px 6px', fontSize: 12, textAlign: 'right' }}
                        value={capToText(maxOf(region))}
                        title="A number caps the spend here. N funds it at nothing but keeps it in the plan."
                        onChange={e => setLimit('regionMax', region, capFromText(e.target.value))} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button className="btn btn-ghost" style={{ marginTop: 10, fontSize: 12 }} onClick={resetAll}>
            Reset {role} coverage and limits
          </button>
        </div>
      )}
    </div>
  );
}

// ====================================================================

function SetupTab({ state, setState, onOpenPriorities, container }) {
  const update = (patch) => setState(s => ({ ...s, ...patch }));
  const pinned = !!state.demandOverride;
  // Pinning starts from whatever is on screen, so nothing jumps.
  const pinCounts = () => update({ demandOverride: JSON.parse(JSON.stringify(state.vacancies || {})) });
  // RAC's own plan column for this month, where their file carried one.
  const racPlan = (() => {
    try {
      const pri = priorityFor(state.planMonth, container);
      const out = {};
      ROLES.forEach(r => { out[r] = planDemandFrom(pri, r); });
      return (out.SMR || out.Patrol) ? out : null;
    } catch (e) { return null; }
  })();
  const useRacPlan = () => update({
    demandOverride: JSON.parse(JSON.stringify(racPlan[role] || state.vacancies || {})),
  });
  const usePriorities = () => update({ demandOverride: null });
  const setPinned = (role, region, n) => setState(s => ({
    ...s,
    demandOverride: {
      ...(s.demandOverride || s.vacancies || {}),
      [role]: { ...(((s.demandOverride || s.vacancies || {})[role]) || {}), [region]: n },
    },
  }));
  const setRoleField = (role, field, value) => {
    update({ [field]: { ...state[field], [role]: value } });
  };
  const days = (DATA.days_in_month && DATA.days_in_month[state.planMonth]) || 30;

  return (
    <div>
      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          Set the budget, hold-backs and hire target. The application target comes off the hire target.
          Open roles come from Location priorities.
        </div>
      </div>

      {/* Global funding assumptions */}
      <div className="card">
        <div className="card-head">
          <div className="card-title">Funding assumptions</div>
          
        </div>
        <div className="card-body">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 16 }}>
            <div>
              <label className="field-label">Planning month</label>
              <div className="text-input" style={{ background: 'var(--ink-04)', color: 'var(--ink-70)' }}>
                {(DATA.month_labels && DATA.month_labels[state.planMonth]) || state.planMonth}
              </div>
              <div className="help-text" style={{ marginTop: 4 }}>{days} days</div>
            </div>
          </div>
        </div>
      </div>

      {ROLES.map(role => (
        <div className="card" key={role}>
          <div className="card-head">
            <div className={'role-badge'} style={{
              background: role === 'SMR' ? 'var(--rac-orange)' : 'var(--em-blue)',
              color: '#fff', fontWeight: 700, fontSize: 12, padding: '4px 10px', borderRadius: 6
            }}>{role}</div>
            <div>
              <div className="card-title">{role}: {ROLE_FULL[role]}</div>
              
            </div>
          </div>
          <div className="card-body">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 18 }}>
              <div>
                <label className="field-label">Monthly budget</label>
                <input className="text-input"
                  value={'\u00A3' + (state.budget[role] || 0).toLocaleString('en-GB')}
                  onChange={e => setRoleField(role, 'budget', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
              </div>
              <div>
                <label className="field-label">Indeed Premium campaigns</label>
                <input className="text-input"
                  value={(state.premiumCampaigns && state.premiumCampaigns[role]) || 0}
                  onChange={e => setRoleField(role, 'premiumCampaigns', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
                <div className="help-text" style={{ marginTop: 4 }}>
                  Held back: {fmtGBP(((state.premiumCampaigns && state.premiumCampaigns[role]) || 0) * days * INDEED_PREMIUM_RATE)}
                  {' '}({((state.premiumCampaigns && state.premiumCampaigns[role]) || 0)} &times; {days}d &times; &pound;44)
                </div>
              </div>
              <div>
                <label className="field-label">Combined Activity reserve</label>
                <input className="text-input"
                  value={'\u00A3' + (((state.acReserve && state.acReserve[role]) || 0)).toLocaleString('en-GB')}
                  onChange={e => setRoleField(role, 'acReserve', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
                
              </div>
              <div>
                <label className="field-label">Hire target <span style={{ fontWeight: 400, textTransform: 'none' }}>&middot; from RAC</span></label>
                <input className="text-input"
                  value={((state.hireTarget && state.hireTarget[role]) || 0).toLocaleString('en-GB')}
                  onChange={e => setRoleField(role, 'hireTarget', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
                <div className="help-text" style={{ marginTop: 4 }}>
                  Works out to <strong>{fmtInt(state.appTarget[role] || 0)} applications</strong> at a
                  {' '}{(blendedHireRate(role, state) * 100).toFixed(2)}% blended hire rate.
                </div>
              </div>
            </div>

            <div className="section-label" style={{ marginTop: 4 }}>
              Platform limits
              <span className="text-muted" style={{ fontWeight: 400 }}>
                {' '}&middot; optional minimum and maximum role-wide spend per platform
              </span>
            </div>
            <div className="help-text" style={{ marginBottom: 10 }}>
              Leave at &pound;0 for no limit. If a limit is hit, the plan rebalances spend between platforms within each location to honour it; the per-location budget totals stay the same.
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 18 }}>
              {PLATFORMS.map(plat => {
                const minV = (state.platMin && state.platMin[role] && state.platMin[role][plat]) || 0;
                const maxV = (state.platMax && state.platMax[role] && state.platMax[role][plat]) || 0;
                const setLimit = (kind, value) => {
                  setState(prev => ({
                    ...prev,
                    [kind]: {
                      ...prev[kind],
                      [role]: { ...((prev[kind] && prev[kind][role]) || {}), [plat]: value }
                    }
                  }));
                };
                return (
                  <div key={plat} style={{ background: 'var(--bg-soft)', borderRadius: 6, padding: 10 }}>
                    <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 8 }}>{PLATFORM_LABELS[plat]}</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                      <div>
                        <label className="field-label" style={{ fontSize: 10 }}>Min</label>
                        <input className="text-input"

                          onChange={e => setLimit('platMin', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />

                      <div>
                        <label className="field-label" style={{ fontSize: 10 }}>Max</label>
                        <input className="text-input"
                          value={'\u00A3' + maxV.toLocaleString('en-GB')}
                          onChange={e => setLimit('platMax', parseInt(e.target.value.replace(/[^0-9]/g, '')) || 0)} />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {(() => {
              const pl = buildFundingPlan(role, { ...planParams(role, state), appTarget: state.appTarget[role] || 0 });
              if (!(pl.beyondProven > 1)) return null;
              const pct = pl.deployable > 0 ? (pl.beyondProven / pl.deployable) * 100 : 0;
              return (
                <div className="banner banner-warn" style={{ marginBottom: 14 }}>
                  <div className="banner-icon">!</div>
                  <div>
                    <strong>{fmtGBP(pl.beyondProven)} ({pct.toFixed(0)}%) is above spend levels already
                    run.</strong> It is in the plan. That part is an estimate rather than something measured.
                  </div>
                </div>
              );
            })()}
            <div className="section-label">Commentary for the plan document</div>
            <div className="help-text" style={{ marginBottom: 6 }}>
              One point per line. It appears as its own page in the PDF, after the legacy notes below, and saves with the plan.
            </div>
            <CommentaryBox
              value={(state.commentary && state.commentary[role]) || ''}
              onCommit={v => update({ commentary: { ...(state.commentary || {}), [role]: v } })} />

            <div className="section-label">Commentary relating to legacy plan</div>
            <div className="help-text" style={{ marginBottom: 6 }}>
              One point per line. It appears as its own page in the PDF, before the notes above, and saves with the plan.
            </div>
            <CommentaryBox
              value={(state.commentaryLegacy && state.commentaryLegacy[role]) || ''}
              onCommit={v => update({ commentaryLegacy: { ...(state.commentaryLegacy || {}), [role]: v } })} />

            <div className="section-label">How the budget splits across platforms</div>
            <div className="help-text" style={{ marginBottom: 10 }}>
              Each location's budget goes to the platforms where hires cost the least.
            </div>
            <div className="dial-row" style={{ marginBottom: 8 }}>
              <label className="field-label" style={{ flex: 'none' }}>Spend ceiling</label>
              <input className="text-input" style={{ width: 90, flex: 'none' }}
                value={((state.capMultiple || 1) * 100).toFixed(0) + '%'}
                onChange={e => {
                  const n = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10);
                  update({ capMultiple: isFinite(n) ? Math.min(3, Math.max(1, n / 100)) : 1 });
                }} />
              <span className="help-text" style={{ flex: 1 }}>
                Of the biggest month each location and platform has already spent.
              </span>
            </div>

            {(container && container.demand && container.demand._carriedFrom && !pinned) && (
              <div className="banner banner-warn" style={{ marginBottom: 12 }}>
                <div className="banner-icon">!</div>
                <div>
                  These open roles are {(DATA.month_labels && DATA.month_labels[container.demand._carriedFrom]) || container.demand._carriedFrom}'s,
                  carried forward because no list has been pasted for this month yet. Paste this month's tab in
                  Location priorities to replace them.
                </div>
              </div>
            )}
            <div className="section-label">
              {pinned ? 'Open roles set for this plan' : 'Live locations & open roles this month'}
              <span className="text-muted" style={{ fontWeight: 400 }}>
                {' '}&middot; {(state.liveRegions[role] || []).length} of {DATA.regions_ordered.length} live
              </span>
            </div>
            <div className="help-text" style={{ marginBottom: 10 }}>
              {pinned ? (
                <>
                  This plan is using its own open-role counts rather than the live ones. Use this to rebuild a
                  plan on the demand it was written against, when Location priorities has moved on since.{' '}
                  <a href="#" className="link-inline" onClick={e => { e.preventDefault(); usePriorities(); }}>
                    Go back to the live counts
                  </a>.
                </>
              ) : (
                <>
                  These come from Location priorities, which is where the open-role count for the month is kept.
                  Only live locations are funded, and the number of open roles drives each location's share of
                  the budget.{' '}
                  <a href="#" className="link-inline"
                    onClick={e => { e.preventDefault(); if (onOpenPriorities) onOpenPriorities(); }}>
                    Edit them in Location priorities
                  </a>, or{' '}
                  <a href="#" className="link-inline" onClick={e => { e.preventDefault(); pinCounts(); }}>
                    set them by hand for this plan
                  </a>.
                  {(() => {
                    let dates = [];
                    try { dates = (priorityFor(state.planMonth, container).dates || []).slice().reverse(); }
                    catch (e) { dates = []; }
                    if (dates.length < 2) return null;
                    return (
                      <div className="dial-row" style={{ marginTop: 10, marginBottom: 2 }}>
                        <label className="field-label" style={{ flex: 'none' }}>Open roles as at</label>
                        <select className="text-input" style={{ width: 150, flex: 'none' }}
                          value={state.demandDate || ''}
                          onChange={e => update({ demandDate: e.target.value || null, demandOverride: null })}>
                          <option value="">Latest ({fmtDay(dates[0])})</option>
                          {dates.map(d => <option key={d} value={d}>{fmtDay(d)}</option>)}
                        </select>
                        <span className="help-text" style={{ flex: 1 }}>
                          Any day RAC have sent. The date is kept with the plan, so it stays true to
                          their file, and saving a version freezes the counts as they stood.
                        </span>
                      </div>
                    );
                  })()}
                  {racPlan && racPlan[role] && (
                    <>
                      {' '}RAC's file carries a plan column for this month.{' '}
                      <a href="#" className="link-inline" onClick={e => { e.preventDefault(); useRacPlan(); }}>
                        Use those counts instead
                      </a>
                      {' '}({Object.values(racPlan[role]).reduce((a, b) => a + b, 0)} roles).
                    </>
                  )}
                </>
              )}
            </div>
            <div className="loc-toggle-grid">
              {DATA.regions_ordered.map(region => {
                const vacCount = (state.vacancies && state.vacancies[role] && state.vacancies[role][region]) || 0;
                const live = vacCount > 0;
                return (
                  <div key={region} className={(pinned ? 'loc-toggle' : 'loc-toggle read-only') + (live ? ' live' : '')}>
                    <span className="dot" />
                    <span className="lt-name" style={{ flex: 1 }}>{region}</span>
                    {pinned
                      ? <input type="text" className="vac-input" value={vacCount}
                          onChange={e => setPinned(role, region, parseInt(e.target.value.replace(/[^0-9]/g, ''), 10) || 0)} />
                      : <span className="vac-read mono">{vacCount}</span>}
                    <span className="lt-roles" style={{ marginLeft: 4 }}>{vacCount === 1 ? 'role' : 'roles'}</span>
                  </div>
                );
              })}
            </div>

            <CoverageMatrix role={role} state={state} setState={setState} />
          </div>
        </div>
      ))}
    </div>
  );
}

// ====================================================================
// TAB 2 - PLAN: the allocation, headline verdict
// ====================================================================
function PlanTab({ state, setState, role: roleView, setRole: setRoleView }) {
  const role = roleView;
  const days = (DATA.days_in_month && DATA.days_in_month[state.planMonth]) || 30;

  // One builder, so the data period and the spend ceiling cannot be left off.
  const plan = useMemo(() => buildFundingPlan(role, {
    ...planParams(role, state),
    appTarget: state.appTarget[role] || 0,
  }), [role, state]);

  const budget = state.budget[role] || 0;
  const liveCount = plan.totalCount;
  const covPct = Math.round(plan.coverageRate * 100);
  const pct = Math.round(plan.pctOfTarget * 100);
  const budgetGap = plan.budgetForTarget - budget;
  const rows = plan.locations.slice().sort((a, b) => (b.vacancies - a.vacancies) || (b.predApps - a.predApps));

  const applyBudget = () => setState(s => ({ ...s, budget: { ...s.budget, [role]: plan.budgetForTarget } }));

  // Verdict tier: on target / close (range reaches it) / short.
  const tier = plan.appTarget <= 0 ? 'none'
    : plan.onTarget ? 'good'
    : (plan.predHigh >= plan.appTarget ? 'close' : 'short');
  const bannerClass = tier === 'good' ? 'banner-good'
    : tier === 'close' ? 'banner-warn'
    : tier === 'short' ? 'banner-bad' : 'banner-info';

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <div className="role-switch">
          {ROLES.map(r => (
            <button key={r} className={r === roleView ? 'active' : ''}
              onClick={() => setRoleView(r)}>{r}</button>
          ))}
        </div>
        <span className="help-text">{ROLE_FULL[role]} &middot; {liveCount} live locations &middot; {plan.totalVac} open roles</span>
      </div>

      {liveCount === 0 && (
        <div className="banner banner-warn">
          <div className="banner-icon">!</div>
          <div>No open roles for {role}. Set them in Location priorities.</div>
        </div>
      )}

      {/* Confidence verdict -- applications vs the client's target */}
      {liveCount > 0 && (
        <div className={'banner ' + bannerClass}>
          <div className="banner-icon">{tier === 'good' ? '\u2713' : tier === 'none' ? 'i' : '!'}</div>
          <div>
            {tier === 'none' && (
              <>
                <strong>No application target set for {role} yet.</strong> This budget is predicted to deliver
                {' '}<strong>~{fmtInt(plan.predictedApps)} applications</strong> (likely range
                {' '}{fmtInt(plan.predLow)}&ndash;{fmtInt(plan.predHigh)}). Add RAC&rsquo;s target on the Setup
                tab to see confidence against it.
              </>
            )}
            {tier === 'good' && (
              <>
                <strong>On track to hit your application target.</strong> The plan is predicted to deliver
                {' '}<strong>~{fmtInt(plan.predictedApps)} applications</strong> against RAC&rsquo;s target of
                {' '}{fmtInt(plan.appTarget)} ({pct}%), with every one of the {liveCount} locations funded.
                Likely range {fmtInt(plan.predLow)}&ndash;{fmtInt(plan.predHigh)}.
              </>
            )}
            {tier === 'close' && (
              <>
                <strong>Close to target, just not centred on it yet.</strong> Central estimate is
                {' '}<strong>~{fmtInt(plan.predictedApps)} applications</strong> vs the {fmtInt(plan.appTarget)}
                {' '}target ({pct}%). The likely range ({fmtInt(plan.predLow)}&ndash;{fmtInt(plan.predHigh)})
                reaches the target but doesn&rsquo;t centre on it. About
                {' '}<strong>{fmtGBP(Math.max(0, budgetGap))}</strong> more budget would put the plan firmly on target.
              </>
            )}
            {tier === 'short' && (
              <>
                <strong>The budget is set to fall short of your target.</strong> Predicted
                {' '}<strong>~{fmtInt(plan.predictedApps)} applications</strong> against {fmtInt(plan.appTarget)}
                {' '}({pct}%). Even the top of the likely range ({fmtInt(plan.predHigh)}) is below target.
                Hitting it needs about <strong>{fmtGBP(plan.budgetForTarget)}</strong>.
              </>
            )}
          </div>
        </div>
      )}

      {/* Region limit warnings: money that could not be placed, or floors that
          overspend the deployable budget. Both are silent otherwise. */}
      {liveCount > 0 && (plan.unplacedBudget > 1 ||
        plan.locations.reduce((s, l) => s + l.spend, 0) > plan.deployable + 1) && (
        <div className="banner banner-warn">
          <div className="banner-icon">!</div>
          <div>
            {plan.unplacedBudget > 1 && (
              <>
                <strong>{fmtGBP(plan.unplacedBudget)} could not be placed.</strong> Every location has hit its
                maximum budget, so this money has nowhere to go. Raise a cap, or lower the budget to
                {' '}{fmtGBP(plan.deployable - plan.unplacedBudget + plan.premiumHoldback + plan.acHoldback)}.
              </>
            )}
            {plan.locations.reduce((s, l) => s + l.spend, 0) > plan.deployable + 1 && (
              <>
                <strong>Minimum budgets exceed the deployable budget.</strong> The location minimums add up to
                {' '}{fmtGBP(plan.locations.reduce((s, l) => s + l.spend, 0))} against a deployable budget of
                {' '}{fmtGBP(plan.deployable)}. The plan is honouring the minimums, so it is overspending. Lower
                the minimums or raise the budget.
              </>
            )}
          </div>
        </div>
      )}

      {/* Four headline numbers */}
      {liveCount > 0 && (
        <div className="kpi-row" style={{ marginBottom: 18 }}>
          <div className="kpi kpi-accent-orange">
            <div className="kpi-label">Predicted applications</div>
            <div className="kpi-value mono">{fmtInt(plan.predictedApps)}</div>
            <div className="kpi-sub">likely {fmtInt(plan.predLow)}&ndash;{fmtInt(plan.predHigh)}</div>
          </div>
          <div className="kpi kpi-accent-blue">
            <div className="kpi-label">Predicted hires</div>
            <div className="kpi-value mono">{plan.predictedHires.toFixed(1)}</div>
            <div className="kpi-sub">
              likely {plan.predictedHiresLow.toFixed(1)}&ndash;{plan.predictedHiresHigh.toFixed(1)}
              {plan.aggBandMonths ? ' \u00B7 from ' + plan.aggBandMonths + ' months' : ''}
              {plan.predictedHires > 0 ? ' \u00B7 ' + fmtGBP(plan.deployable / plan.predictedHires) + ' per hire' : ''}
            </div>
          </div>
          <div className="kpi kpi-accent-navy">
            <div className="kpi-label">Application target</div>
            <div className="kpi-value mono">{fmtInt(plan.appTarget)}</div>
            <div className="kpi-sub">{plan.appTarget > 0 ? '' : 'set this on the Setup tab'}</div>
          </div>
          <div className="kpi kpi-accent-blue">
            <div className="kpi-label">Total open roles</div>
            <div className="kpi-value mono">{fmtInt(plan.totalVac)}</div>
            <div className="kpi-sub">across {liveCount} live locations</div>
          </div>
          <div className="kpi kpi-accent-good">
            <div className="kpi-label">{plan.budgetPinned ? 'Budget your caps require' : 'Budget to hit target'}</div>
            <div className="kpi-value mono">{plan.budgetForTarget > 0 ? fmtGBP(plan.budgetForTarget)
              : plan.targetUnreachable ? 'Capped' : '-'}</div>
            <div className="kpi-sub">
              {plan.budgetPinned ? 'every location is set to a minimum, so this is the sum of them plus hold-backs'
                : plan.targetUnreachable ? 'the caps stop this being reachable at any budget'
                : plan.budgetForTarget <= 0 ? 'no target set'
                : plan.capsBinding && Math.abs(budgetGap) <= 50 ? 'every location is at its cap, so more budget would not be spent'
                : budgetGap > 50 ? fmtGBP(budgetGap) + ' more than now'
                : budgetGap < -50 ? fmtGBP(-budgetGap) + ' less than now'
                : 'matches your budget'}
            </div>
          </div>
        </div>
      )}

      {/* Apply-budget nudge */}
      {liveCount > 0 && !plan.budgetPinned && plan.budgetForTarget > 0 && budgetGap > 50 && (
        <div className="help-text" style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18, flexWrap: 'wrap' }}>
          <button className="btn btn-primary btn-sm" onClick={applyBudget}>
            Use {fmtGBP(plan.budgetForTarget)} as the {role} budget
          </button>
          <span style={{ flex: 1, minWidth: 240 }}>
            Predicted applications scale with the deployable budget, so this is the spend that puts the central
            estimate on RAC&rsquo;s target, with hold-backs included.
          </span>
        </div>
      )}

      {/* Budget breakdown */}
      {liveCount > 0 && (
        <div className="card">
          <div className="card-head">
            <div className="card-title">Where the budget goes</div>
            
          </div>
          <div className="card-body" style={{ padding: 0 }}>
            <table className="alloc-table">
              <tbody>
                <tr><td>Monthly budget</td><td style={{ textAlign: 'right' }}>{fmtGBP(budget)}</td></tr>
                <tr>
                  <td>&minus; Indeed Premium ({(state.premiumCampaigns && state.premiumCampaigns[role]) || 0} campaigns &times; {days}d &times; &pound;44)</td>
                  <td style={{ textAlign: 'right' }}>&minus;{fmtGBP(plan.premiumHoldback)}</td>
                </tr>
                <tr>
                  <td>&minus; Combined Activity reserve</td>
                  <td style={{ textAlign: 'right' }}>&minus;{fmtGBP(plan.acHoldback)}</td>
                </tr>
                <tr className="total-row">
                  <td>Deployable budget</td>
                  <td style={{ textAlign: 'right' }}>{fmtGBP(plan.deployable)}</td>
                </tr>
                <tr>
                  <td>Split across {liveCount} locations by open roles</td>
                  <td style={{ textAlign: 'right' }}>{fmtGBP(plan.demandPool)}</td>
                </tr>
                {plan.beyondProven > 1 && (
                  <tr>
                    <td>Of which above spend levels already run</td>
                    <td style={{ textAlign: 'right', color: 'var(--warn)' }}>{fmtGBP(plan.beyondProven)}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Per-location plan */}
      {liveCount > 0 && (
        <div className="card">
          <div className="card-head">
            <div className="card-title">Applications by location</div>
            <div className="card-sub">Each location’s share of the target and what the plan is set to deliver</div>
          </div>
          <div className="card-body" style={{ padding: 0 }}>
            <table className="alloc-table">
              <thead>
                <tr>
                  <th>Location</th><th>Open roles</th><th>Budget</th>
                  <th>App target</th><th>Predicted apps</th><th>Likely range</th>
                  <th>Hire CVR</th><th>Predicted hires</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(l => {
                  const hit = l.appSubTarget > 0 && l.predApps >= l.appSubTarget;
                  return (
                    <tr key={l.region}>
                      <td>{l.region}</td>
                      <td>{l.vacancies}</td>
                      <td>{fmtGBP(l.spend)}</td>
                      <td>{fmtInt(l.appSubTarget)}</td>
                      <td style={{ color: l.appSubTarget > 0 ? (hit ? 'var(--good)' : 'var(--warn)') : 'inherit', fontWeight: 600 }}
                        title={'Blended CPA \u00A3' + Math.round(l.cpa) +
                          (l.cpaSource === 'shrunk' ? ' (thin data, adjusted toward the benchmark)' :
                           l.cpaSource === 'benchmark' ? ' (no historic data, benchmark used)' : '')}>
                        {fmtInt(l.predApps)}
                        {l.cpaSource === 'shrunk' && <span style={{ color: 'var(--warn)' }}> *</span>}
                        {l.cpaSource === 'benchmark' && <span style={{ color: 'var(--ink-35)' }}> &dagger;</span>}
                      </td>
                      <td className="band-text">{fmtInt(l.predLow)}&ndash;{fmtInt(l.predHigh)}
                        {' '}<span style={{ opacity: 0.7 }}>(&plusmn;{l.bandPct}%)</span></td>
                      <td>{l.predApps > 0 ? (l.hireCvr * 100).toFixed(2) + '%' : '\u2013'}</td>
                      <td style={{ fontWeight: 600 }}>{l.predHires > 0 ? l.predHires.toFixed(1) : '0'}</td>
                    </tr>
                  );
                })}
                <tr className="total-row">
                  <td>Total</td>
                  <td>{plan.totalVac}</td>
                  <td>{fmtGBP(rows.reduce((s, l) => s + l.spend, 0))}</td>
                  <td>{fmtInt(plan.appTarget)}</td>
                  <td>{fmtInt(plan.predictedApps)}</td>
                  <td className="band-text">{fmtInt(plan.predLow)}&ndash;{fmtInt(plan.predHigh)}</td>
                  <td>{plan.predictedApps > 0 ? (plan.predictedHires / plan.predictedApps * 100).toFixed(2) + '%' : '\u2013'}</td>
                  <td style={{ fontWeight: 600 }}>{plan.predictedHires.toFixed(1)}</td>
                </tr>
              </tbody>
            </table>
            <div className="help-text" style={{ padding: '12px 16px' }}>
              Each location gets a share of the budget in proportion to its open roles, and the same share
              of the application target. Predicted apps = budget &divide; the location&rsquo;s
              blended cost-per-application; the range reflects its historic month-to-month volatility.
              {' '}<span style={{ color: 'var(--warn)' }}>*</span> thin data, CPA adjusted toward the
              benchmark; <span style={{ color: 'var(--ink-35)' }}>&dagger;</span> no historic data.
              {' '}<span style={{ color: 'var(--ink-55)' }}>Implied hires across the plan: about {plan.predictedHires.toFixed(0)},
              {' '}a guardrail only; this plan is measured in applications.</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ====================================================================
// TAB 4 - BENCHMARKS: how much past performance data backs each prediction
// ====================================================================
// For every region × platform (for the selected role) this shows the months
// of application history, total historic applications, the CPA the tool
// plans against, and the prediction band width. The operator can see at a
// glance which cells are well-evidenced and which are running on thin data.
function dataQuality(months, apps) {
  // Combined judgement of how trustworthy a cell's CPA is.
  if (months >= 6 && apps >= 60) return { label: 'Strong', kind: 'good' };
  if (months >= 3 && apps >= 20) return { label: 'Usable', kind: 'warn' };
  if (apps >= 1) return { label: 'Thin', kind: 'bad' };
  return { label: 'None', kind: 'none' };
}

// Every month the dataset holds, oldest first.
let _monthsCache = null;
function dataMonths() {
  if (_monthsCache) return _monthsCache;
  const set = new Set();
  PLATFORMS.forEach(p => Object.keys(DATA[p] || {}).forEach(k => {
    if (k === 'OVERALL') return;
    Object.keys((DATA[p][k] || {}).monthly || {}).forEach(m => set.add(m));
  }));
  _monthsCache = [...set].sort();
  return _monthsCache;
}

// Spend, applications and clicks for one cell over a month range. All-time
// when no range is given.
// The same figures as windowStats, but using whatever weighting is set.
function weightedStats(plat, region, role) {
  const cell = (DATA[plat] || {})[region + '__' + role];
  if (!cell) return { spend: 0, completes: 0, clicks: 0, months: 0, cpa: null, cvr: null, first: null, last: null };
  const m = cell.monthly || {};
  let spend = 0, completes = 0, clicks = 0, months = 0, first = null, last = null;
  Object.keys(m).sort().forEach(mo => {
    const w = benchWeight(mo);
    if (!w) return;
    const x = m[mo]; if (!x) return;
    spend += w * (x.spend || 0);
    completes += w * (x.completes || 0);
    clicks += w * (x.clicks || 0);
    if ((x.completes || 0) >= 1) { months += 1; if (!first) first = mo; last = mo; }
  });
  const at = cell.all_time || {};
  // Weights multiply the volumes, so a x3 month would count three times its
  // real spend. Scale back to the true size of the period: the ratios are
  // unaffected, and spend and applications read as the actual figures.
  const wsum = Object.keys(m).reduce((a, mo) => a + benchWeight(mo), 0);
  const k = wsum > 0 ? benchMonthCount() / wsum : 1;
  return { spend: spend * k, completes: completes * k, clicks: clicks * k,
    months, first, last,
    cpa: completes > 0 ? spend / completes : null,
    cvr: clicks > 0 ? completes / clicks : (at.cvr || null),
    cvrWindowed: clicks > 0, weighted: true };
}

function windowStats(plat, region, role, from, to) {
  const cell = (DATA[plat] || {})[region + '__' + role];
  if (!cell) return { spend: 0, completes: 0, clicks: 0, months: 0, cpa: null, cvr: null, first: null, last: null };
  const m = cell.monthly || {};
  let spend = 0, completes = 0, clicks = 0, months = 0, first = null, last = null;
  Object.keys(m).sort().forEach(mo => {
    if (from && mo < from) return;
    if (to && mo > to) return;
    const x = m[mo]; if (!x) return;
    spend += x.spend || 0; completes += x.completes || 0; clicks += x.clicks || 0;
    if ((x.completes || 0) >= 1) {
      months += 1;
      if (!first) first = mo;
      last = mo;
    }
  });
  const at = cell.all_time || {};
  return { spend, completes, clicks, months, first, last,
    cpa: completes > 0 ? spend / completes : null,
    cvr: clicks > 0 ? completes / clicks : (at.cvr || null),
    cvrWindowed: clicks > 0 };
}



function BenchmarksTab({ state, setState, role: roleView, setRole: setRoleView }) {
  const role = roleView;
  const months = useMemo(() => dataMonths(), []);
  // Everything read below goes through the module window, so point it at the
  // role being looked at before anything is worked out.
  setBenchWindow(benchFor(state, roleView));
  const w = benchNorm(benchFor(state, roleView)) || { mode: 'all' };
  const mode = w.mode || 'all';
  const setBench = (b) => setState(st => ({ ...st, bench: { ...(st.bench || {}), [roleView]: b } }));
  const from = w.from || months[0];
  const to = w.to || months[months.length - 1];
  const setFrom = (v) => setBench({ mode: 'custom', from: v > to ? to : v, to });
  const setTo = (v) => setBench({ mode: 'custom', from, to: v < from ? from : v });
  const [open, setOpen] = useState({ byLocation: true, byPlatform: true });
  const [openPlat, setOpenPlat] = useState({});
  const spanLen = months.filter(m => benchWeight(m) > 0).length;
  const isAll = mode === 'all';

  // A location's hire rate, blended across the platforms that have one, and
  // weighted by applications the same way platHireRate is.
  //
  // This used to read cvr_benchmarks, the coarse three-band set built in April
  // from the 2026 proposal. That disagreed with the per-platform rates the
  // plan itself runs on, most of all in London, where the band says 1.70% and
  // Scott's file says under 1%. Two screens in the same tool were quoting
  // costs per hire that were thousands of pounds apart for the same location.
  // Both now come off Scott's file.
  // A location's cost per application, built from the very same per-cell rates
  // the plan runs on and weighted by the spend each cell has historically
  // taken. It will not equal the figure on the plan's By region page, because
  // that one is weighted by where next month's budget actually goes.
  const locPlanCPA = (region) => {
    let w = 0, apps = 0;
    PLATFORMS.forEach(pl => {
      const st = weightedStats(pl, region, role);
      const b = regionPlatformCPA(pl, region, role);
      if (st.spend > 0 && b && b.cpa > 0) { w += st.spend; apps += st.spend / b.cpa; }
    });
    return apps > 0 ? w / apps : null;
  };

  const locHireRate = (region) => {
    let w = 0, n = 0;
    PLATFORMS.forEach(pl => {
      const h = regionPlatformHireCVR(pl, region, role);
      const st = weightedStats(pl, region, role);
      if (h > 0 && st.completes > 0) { w += h * st.completes; n += st.completes; }
    });
    return n > 0 ? w / n : null;
  };

  // Hire rates stay on the whole history whatever window is chosen: hires lag
  // by weeks and there is never enough of them in a short window to mean
  // anything. So cost per hire is the windowed cost per application divided
  // by the all-time hire rate.
  // Cost per hire is the cost per application the plan uses, divided by the
  // hire rate. Same arithmetic as the PDF, on the same two figures shown in
  // the row.
  const cph = (region) => {
    const c = locPlanCPA(region);
    const r = locHireRate(region);
    return (c > 0 && r > 0) ? c / r : null;
  };

  // The same figure for a single platform in a single location, so the drill-
  // down's cost per hire is worked out from the very rate shown beside it.
  const cellCph = (plat, region) => {
    const b = regionPlatformCPA(plat, region, role);
    const r = regionPlatformHireCVR(plat, region, role);
    return (b && b.cpa > 0 && r > 0) ? b.cpa / r : null;
  };

  // Apply rate and hire rate come from the whole history: clicks are not
  // stored per month, and hires lag too far to mean anything in a window.
  // Applications over clicks across the window. Falls back to the all-time
  // rate for any cell with no clicks on record.
  const applyRate = (region) => {
    let cl = 0, ap = 0, w = 0, n = 0;
    PLATFORMS.forEach(p => {
      const st = weightedStats(p, region, role);
      if (st.clicks > 0) { cl += st.clicks; ap += st.completes; }
      else if (st.cvr > 0 && st.completes > 0) { w += st.cvr * st.completes; n += st.completes; }
    });
    if (cl > 0) return ap / cl;
    return n > 0 ? w / n : null;
  };
  const platApplyRate = (pl) => {
    let cl = 0, ap = 0;
    DATA.regions_ordered.forEach(r => {
      const st = weightedStats(pl, r, role);
      cl += st.clicks; ap += st.completes;
    });
    return cl > 0 ? ap / cl : null;
  };
  const platHireRate = (pl) => {
    let w = 0, n = 0;
    DATA.regions_ordered.forEach(r => {
      const h = regionPlatformHireCVR(pl, r, role);
      const st = weightedStats(pl, r, role);
      if (h > 0 && st.completes > 0) { w += h * st.completes; n += st.completes; }
    });
    return n > 0 ? w / n : null;
  };
  const platCph = (pl) => {
    const b = rolePlatformCPA(pl, role);
    const h = platHireRate(pl);
    return (b && b.cpa > 0 && h > 0) ? b.cpa / h : null;
  };

  const grid = DATA.regions_ordered.map(region => ({
    region,
    cells: PLATFORMS.map(p => {
      const w = weightedStats(p, region, role);
      return { platform: p, ...w, q: dataQuality(w.months, w.completes) };
    }),
  }));
  const allCells = grid.flatMap(r => r.cells);
  const strong = allCells.filter(c => c.q.kind === 'good').length;
  const usable = allCells.filter(c => c.q.kind === 'warn').length;
  const thin = allCells.filter(c => c.q.kind === 'bad').length;
  const none = allCells.filter(c => c.q.kind === 'none').length;
  const totalApps = allCells.reduce((s, c) => s + c.completes, 0);
  const totalSpend = allCells.reduce((s, c) => s + c.spend, 0);
  const blendedAll = totalApps > 0 ? totalSpend / totalApps : null;

  // Same figures on the whole history, so the window can be judged against it.
  const allTime = DATA.regions_ordered.flatMap(region =>
    PLATFORMS.map(p => windowStats(p, region, role, null, null)));
  const atSpend = allTime.reduce((s, c) => s + c.spend, 0);
  const atApps = allTime.reduce((s, c) => s + c.completes, 0);
  const blendedAllTime = atApps > 0 ? atSpend / atApps : null;

  const rangeLabel = benchLabel(w) + ', ' + spanLen + ' month' + (spanLen === 1 ? '' : 's');

  const Section = ({ id, title, sub, children }) => (
    <div className="card">
      <div className="card-head fold-head" onClick={() => setOpen(o => ({ ...o, [id]: !o[id] }))}>
        <span className={'fold-chev' + (open[id] ? ' open' : '')}>{'\u203A'}</span>
        <div>
          <div className="card-title">{title}</div>
          <div className="card-sub">{sub}</div>
        </div>
      </div>
      {open[id] && <div className="card-body" style={{ padding: 0 }}>{children}</div>}
    </div>
  );

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14, flexWrap: 'wrap' }}>
        <div className="role-switch role-switch-lead">
          {ROLES.map(r => (
            <button key={r} className={r === roleView ? 'active' : ''} onClick={() => setRoleView(r)}>{r}</button>
          ))}
        </div>
        <div className="role-switch">
          {[['all', 'All time'], ['ytd', 'Year to date'], ['last3', 'Last 3 months'],
            ['last3up', 'Year to date, recent weighted'], ['custom', 'Custom range']].map(([id, label]) => (
            <button key={id} className={mode === id ? 'active' : ''}
              onClick={() => setBench(id === 'all' ? null
                : id === 'custom' ? { mode: 'custom', from, to }
                : id === 'last3up' ? { mode: 'last3up', mult: w.mult || 3 }
                : { mode: id })}>{label}</button>
          ))}
        </div>
        {mode === 'last3up' && (
          <div className="mb-group">
            <label>Last 3 months count</label>
            <select value={w.mult || 3}
              onChange={e => setBench({ mode: 'last3up', mult: Number(e.target.value) })}>
              {[1, 1.5, 2, 3, 4, 5, 6, 8, 10].map(x => <option key={x} value={x}>{x}x</option>)}
            </select>
          </div>
        )}
        {mode === 'custom' && (
          <div className="mb-group">
            <label>From</label>
            <select value={from} onChange={e => setFrom(e.target.value)}>
              {months.map(m => <option key={m} value={m}>{monthShort(m)}</option>)}
            </select>
            <label>to</label>
            <select value={to} onChange={e => setTo(e.target.value)}>
              {months.map(m => <option key={m} value={m}>{monthShort(m)}</option>)}
            </select>
          </div>
        )}
      </div>

      <div className="banner banner-info">
        <div className="banner-icon">i</div>
        <div>
          {mode === 'last3up'
            ? 'Every month this year counts, with the last three counting ' + (w.mult || 3) + ' times as much as the rest. On the current data that gives the last three months about ' + Math.round((3 * (w.mult || 3)) / (3 * (w.mult || 3) + Math.max(0, spanLen - 3)) * 100) + '% of the weight.'
            : mode === 'last3'
              ? 'Only the last three months count. Earlier months are excluded entirely.'
              : mode === 'ytd'
                ? 'January to the last full month, every month counting the same.'
                : mode === 'custom'
                  ? 'The months you have chosen, every one counting the same.'
                  : 'Every month on record, counting the same.'}
          {' '}Hire rate and apply rate are always taken from the whole history, because hires lag by
          weeks and clicks are not stored month by month.
        </div>
      </div>

      <div className="kpi-row" style={{ marginBottom: 18 }}>
        <div className="kpi kpi-accent-blue">
          <div className="kpi-label">Cost per application</div>
          <div className="kpi-value mono">{blendedAll ? fmtGBP(blendedAll) : '-'}</div>
          <div className="kpi-sub">{fmtInt(totalApps)} applications on {fmtGBP(totalSpend)}</div>
        </div>
        <div className="kpi kpi-accent-good">
          <div className="kpi-label">Strong coverage</div>
          <div className="kpi-value mono">{strong}</div>
          <div className="kpi-sub">of {allCells.length} location and platform cells</div>
        </div>
        <div className="kpi kpi-accent-orange">
          <div className="kpi-label">Usable</div>
          <div className="kpi-value mono">{usable}</div>
          <div className="kpi-sub">enough to plan against</div>
        </div>
        <div className="kpi kpi-accent-navy">
          <div className="kpi-label">Thin or none</div>
          <div className="kpi-value mono">{thin + none}</div>
          <div className="kpi-sub">{thin} thin, {none} with nothing</div>
        </div>
      </div>

      <Section id="byLocation" title="By location, across all platforms"
        sub={'Every platform blended together. ' + rangeLabel + ' Cost per application is the rate the plan uses, blended across this location\u2019s platforms. The figure on a plan\u2019s By region page will differ a little, because that one is weighted by where next month\u2019s budget goes rather than by where spend has gone historically.'}>
        <table className="alloc-table">
          <thead>
            <tr>
              <th>Location</th><th>Cost per application</th><th>Cost per hire</th>
              <th>Hire rate</th><th>Apply rate</th><th>Months of data</th>
              <th>Applications</th><th>Spend</th>
            </tr>
          </thead>
          <tbody>
            {grid.map(({ region, cells }) => {
              const sp = cells.reduce((a, c) => a + c.spend, 0);
              const ap = cells.reduce((a, c) => a + c.completes, 0);
              const cpa = ap > 0 ? sp / ap : null;
              const mFirst = cells.map(c => c.first).filter(Boolean).sort()[0];
              const mLast = cells.map(c => c.last).filter(Boolean).sort().pop();
              const nMonths = mFirst ? months.filter(m => m >= mFirst && m <= mLast && m >= from && m <= to).length : 0;
              const hr = locHireRate(region) || 0;
              return (
                <tr key={region}>
                  <td>{region}</td>
                  <td className="mono">{locPlanCPA(region) ? fmtGBP(locPlanCPA(region)) : (cpa ? fmtGBP(cpa) : '-')}</td>
                  <td className="mono">{cph(region) ? fmtGBP(cph(region)) : '-'}</td>
                  <td className="mono">{hr ? (hr * 100).toFixed(2) + '%' : 'no data'}</td>
                  <td className="mono">{applyRate(region) ? (applyRate(region) * 100).toFixed(2) + '%' : '-'}</td>
                  <td>{nMonths ? nMonths + ', ' + monthShort(mFirst) + ' to ' + monthShort(mLast) : '-'}</td>
                  <td className="mono">{fmtInt(ap)}</td>
                  <td className="mono">{fmtGBP(sp)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Section>

      <Section id="byPlatform" title="By platform, across all locations"
        sub={'Every location blended together. ' + rangeLabel + ' Cost per application is the rate the plan uses.'}>
        <table className="alloc-table">
          <thead>
            <tr>
              <th>Platform</th><th>Cost per application</th><th>Cost per hire</th>
              <th>Hire rate</th><th>Apply rate</th><th>Locations with data</th>
              <th>Applications</th><th>Spend</th>
            </tr>
          </thead>
          <tbody>
            {PLATFORMS.map(pl => {
              const cs = grid.map(g => g.cells.find(c => c.platform === pl));
              const sp = cs.reduce((a, c) => a + c.spend, 0);
              const ap = cs.reduce((a, c) => a + c.completes, 0);
              const live = cs.filter(c => c.completes >= 1).length;
              return (
                <tr key={pl}>
                  <td>{PLATFORM_LABELS[pl]}</td>
                  <td className="mono">{(() => {
                    const b = rolePlatformCPA(pl, role);
                    return (b && b.cpa > 0) ? fmtGBP(b.cpa) : (ap > 0 ? fmtGBP(sp / ap) : '-');
                  })()}</td>
                  <td className="mono">{platCph(pl) ? fmtGBP(platCph(pl)) : '-'}</td>
                  <td className="mono">{platHireRate(pl) ? (platHireRate(pl) * 100).toFixed(2) + '%' : '-'}</td>
                  <td className="mono">{platApplyRate(pl) ? (platApplyRate(pl) * 100).toFixed(2) + '%' : '-'}</td>
                  <td className="mono">{live} of {DATA.regions_ordered.length}</td>
                  <td className="mono">{fmtInt(ap)}</td>
                  <td className="mono">{fmtGBP(sp)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Section>

      {PLATFORMS.map(platform => {
        const platRows = grid.map(g => ({ region: g.region, cell: g.cells.find(c => c.platform === platform) }));
        const platApps = platRows.reduce((s, r) => s + r.cell.completes, 0);
        const platSpend = platRows.reduce((s, r) => s + r.cell.spend, 0);
        const isOpen = !!openPlat[platform];
        return (
          <div className="card" key={platform}>
            <div className="card-head fold-head" onClick={() => setOpenPlat(o => ({ ...o, [platform]: !o[platform] }))}>
              <span className={'fold-chev' + (isOpen ? ' open' : '')}>{'\u203A'}</span>
              <div>
                <div className="card-title">{PLATFORM_LABELS[platform]} by location</div>
                <div className="card-sub">
                  {fmtInt(platApps)} applications on {fmtGBP(platSpend)}
                  {platApps > 0 ? ', ' + fmtGBP(platSpend / platApps) + ' each' : ''} &middot; {rangeLabel}
                </div>
              </div>
            </div>
            {isOpen && (
              <div className="card-body" style={{ padding: 0 }}>
                <table className="alloc-table">
                  <thead>
                    <tr>
                      <th>Location</th><th>Cost per application</th><th>Cost per hire</th>
                      <th>Hire rate</th><th>Apply rate</th><th>Months of data</th>
                      <th>Applications</th><th>Spend</th><th>Data quality</th>
                    </tr>
                  </thead>
                  <tbody>
                    {platRows.map(({ region, cell }) => (
                      <tr key={region}>
                        <td>{region}</td>
                        <td className="mono">{(() => {
                          const b = regionPlatformCPA(platform, region, role);
                          return (b && b.cpa > 0) ? fmtGBP(b.cpa) : (cell.cpa ? fmtGBP(cell.cpa) : '-');
                        })()}</td>
                        <td className="mono">{cellCph(platform, region) ? fmtGBP(cellCph(platform, region)) : '-'}</td>
                        <td className="mono">{(() => { const h = regionPlatformHireCVR(platform, region, role); return h ? (h * 100).toFixed(2) + '%' : '-'; })()}</td>
                        <td className="mono">{cell.cvr ? (cell.cvr * 100).toFixed(2) + '%' + (cell.cvrWindowed ? '' : '*') : '-'}</td>
                        <td>{cell.months ? cell.months + ', ' + monthShort(cell.first) + ' to ' + monthShort(cell.last) : '-'}</td>
                        <td className="mono">{fmtInt(cell.completes)}</td>
                        <td className="mono">{fmtGBP(cell.spend)}</td>
                        <td>
                          <span className={'pill pill-' + (cell.q.kind === 'none' ? '' : cell.q.kind)}>{cell.q.label}</span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
// ====================================================================
// WORKINGS EXPORT
// The whole plan as a spreadsheet, built from the same plan object the PDF
// is drawn from, so the two cannot disagree. Every figure is traceable to
// the month of raw data behind it.
// ====================================================================
const XL_NAVY = 'FF1B2A4A', XL_HEAD = 'FFEFF2F7', XL_LINE = 'FFD8DEE8', XL_MUTED = 'FF6B7A90';

function xlSheet(wb, name) {
  const ws = wb.addWorksheet(name, { views: [{ state: 'frozen', ySplit: 1 }] });
  return ws;
}
function xlTitle(ws, text, sub) {
  const r = ws.addRow([text]);
  r.font = { bold: true, size: 13, color: { argb: XL_NAVY } };
  r.height = 20;
  if (sub) {
    const r2 = ws.addRow([sub]);
    r2.font = { size: 10, color: { argb: XL_MUTED } };
  }
  ws.addRow([]);
}
function xlHeader(ws, cols) {
  const r = ws.addRow(cols.map(c => c.h));
  r.height = 26;
  r.eachCell(cell => {
    cell.font = { bold: true, size: 10, color: { argb: 'FFFFFFFF' } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL_NAVY } };
    cell.alignment = { vertical: 'middle', wrapText: true, horizontal: 'left' };
    cell.border = { bottom: { style: 'thin', color: { argb: XL_LINE } } };
  });
  ws.columns.forEach((c, i) => { if (cols[i]) c.width = cols[i].w || 16; });
  return r.number;
}
function xlBody(ws, cols, rows, opts) {
  const o = opts || {};
  rows.forEach((row, i) => {
    const r = ws.addRow(row);
    r.height = 16;
    r.eachCell((cell, n) => {
      const c = cols[n - 1] || {};
      cell.font = { size: 10 };
      cell.alignment = { vertical: 'middle', horizontal: c.a || 'left' };
      if (c.f) cell.numFmt = c.f;
      cell.border = { bottom: { style: 'hair', color: { argb: XL_LINE } } };
      if (i % 2 === 1) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFBFD' } };
    });
    if (o.totalRow && i === rows.length - 1) {
      r.eachCell(cell => {
        cell.font = { size: 10, bold: true };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL_HEAD } };
        cell.border = { top: { style: 'thin', color: { argb: XL_NAVY } },
                        bottom: { style: 'thin', color: { argb: XL_NAVY } } };
      });
    }
  });
}

function todayISO() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function fmtDay(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
const GBP = '£#,##0', GBP2 = '£#,##0.00', PCT2 = '0.00%', N1 = '#,##0.0', N0 = '#,##0';

// The working behind column I of the Workings sheet, written out with the
// numbers the engine actually used. It is prose rather than an Excel formula
// on purpose: the cell holds the plan's own figure, and this says how that
// figure was reached. Anything that recalculated it here could disagree with
// the plan, which is what it used to do.
//
// sheetApps is what column E adds up to. Where the engine blended on a
// different count, that is said rather than left as a contradiction for
// someone to find.
function cpaWorkingText(l, plat, role, sheetApps) {
  const used = l.platCpa ? l.platCpa[plat] : null;
  if (!(used > 0)) return '';
  const pl = PLATFORM_LABELS[plat] || plat;
  const money = v => '\u00A3' + Number(v || 0).toFixed(2);
  const src = l.platCpaSource ? l.platCpaSource[plat] : null;
  const prior = rolePlatformCPA(plat, role);
  if (src === 'benchmark') {
    return 'No applications recorded here in the period used, so the plan takes the '
      + pl + ' figure across every location, ' + money(prior.cpa) + '.';
  }
  const s = getStats(plat, l.region, role);
  if (!s || !(s.completes > 0)) return 'Taken from the ' + pl + ' figure across every location, ' + money(prior.cpa) + '.';
  const n = s.completes, raw = s.spend / s.completes;
  const nTxt = n.toFixed(1);
  const levelled = Math.abs(n - sheetApps) > 0.05
    ? ' (column E, ' + sheetApps.toFixed(1) + ', levelled to the length of the period used)'
    : '';
  return 'Measured ' + money(raw) + ' pulled toward the ' + pl + ' figure across every location, '
    + money(prior.cpa) + ', weighted by the ' + nTxt + ' applications behind this cell'
    + levelled + ' against a prior of ' + CPA_PRIOR_K + ': ('
    + nTxt + ' x ' + raw.toFixed(2) + ' + ' + CPA_PRIOR_K + ' x ' + prior.cpa.toFixed(2)
    + ') / (' + nTxt + ' + ' + CPA_PRIOR_K + ') = ' + money(used) + '.';
}

async function exportWorkings(state, role) {
  if (!window.ExcelJS) { alert('The spreadsheet writer did not load. Check the connection and reload.'); return; }
  const wb = new window.ExcelJS.Workbook();
  wb.creator = 'Enhance Media';
  wb.created = new Date();

  const params = { ...planParams(role, state), appTarget: state.appTarget[role] || 0 };
  const plan = buildFundingPlan(role, params);   // sets the window for this role
  const monthLabel = (DATA.month_labels && DATA.month_labels[state.planMonth]) || state.planMonth;
  const win = benchFor(state, role);
  const winLabel = benchLabel(win);
  setBenchWindow(win);
  const FX = f => ({ formula: f });
  const style = (row, cols, opts) => {
    const o = opts || {};
    row.height = o.h || 16;
    row.eachCell((cell, k) => {
      const c = cols[k - 1] || {};
      cell.font = { size: o.bold ? 10 : 10, bold: !!o.bold,
        color: { argb: o.white ? 'FFFFFFFF' : (o.muted ? XL_MUTED : 'FF000000') } };
      cell.alignment = { vertical: 'middle', horizontal: c.a || 'left' };
      if (c.f) cell.numFmt = c.f;
      if (o.fill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: o.fill } };
      cell.border = o.strong
        ? { top: { style: 'thin', color: { argb: XL_LINE } }, bottom: { style: 'thin', color: { argb: XL_LINE } } }
        : { bottom: { style: 'hair', color: { argb: XL_LINE } } };
    });
  };

  // Raw monthly data first, so the sheets above it can point at its rows.
  const rawRows = [];
  const wsRaw = xlSheet(wb, 'Raw monthly data');
  {
    xlTitle(wsRaw, 'Raw monthly data',
      'Every month on record for ' + role + '. Everything else in this workbook is built from this sheet. '
      + 'Weight in this plan is how much each month counts towards the figures: 0 means it is left out, '
      + '1 is a normal month, and anything higher is an upweighted one. Window: ' + winLabel + '.');
    const cols = [{ h: 'Month', w: 12 }, { h: 'Location', w: 20 }, { h: 'Platform', w: 13 },
      { h: 'Spend', w: 14, a: 'right', f: GBP2 }, { h: 'Applications', w: 13, a: 'right', f: N1 },
      { h: 'Clicks', w: 14, a: 'right', f: N0 }, { h: 'Cost per application', w: 18, a: 'right', f: GBP2 },
      { h: 'Apply rate', w: 12, a: 'right', f: PCT2 },
      { h: 'Weight in this plan', w: 18, a: 'right', f: N1 }];
    const hr = xlHeader(wsRaw, cols);
    let n = hr;
    DATA.regions_ordered.forEach(r => PLATFORMS.forEach(p => {
      const m = getMonthly(p, r, role);
      Object.keys(m).sort().forEach(mo => {
        const x = m[mo];
        if (!(x.spend > 0)) return;
        n += 1;
        // The weight this month actually carries, straight from the same
        // function the plan uses. A date range cannot describe an upweighted
        // window: on a "last 3 months x3" setting there is no from or to, so
        // the old check marked every month as out and the Workings sheet came
        // out with no formulas in it.
        const w = benchWeight(mo);
        const inWin = w > 0;
        const hasClicks = x.clicks !== undefined && x.clicks !== null;
        rawRows.push({ row: n, region: r, platform: p, inWin, hasClicks, w,
          spend: x.spend, completes: x.completes || 0 });
        style(wsRaw.addRow([mo, r, PLATFORM_LABELS[p], x.spend, x.completes,
          hasClicks ? x.clicks : 'not recorded',
          FX('IFERROR(D' + n + '/E' + n + ',"")'),
          hasClicks ? FX('IFERROR(E' + n + '/F' + n + ',"")') : '',
          w]), cols, { muted: !inWin });
      });
    }));
  }
  // Weighted sums, so the workbook adds up the same way the plan does. A month
  // at 3x contributes three times, and the multiplier is visible in the
  // formula rather than hidden in it.
  const term = (x, col) => {
    const ref = "'Raw monthly data'!" + col + x.row;
    return x.w === 1 ? ref : '(' + x.w + '*' + ref + ')';
  };
  const sumRef = (region, platform, col) => {
    const rs = rawRows.filter(x => x.region === region && x.platform === platform && x.inWin);
    if (!rs.length) return null;
    if (col === 'F' && rs.some(x => !x.hasClicks)) {
      const ok = rs.filter(x => x.hasClicks);
      if (!ok.length) return null;
      return ok.map(x => term(x, 'F')).join('+');
    }
    return rs.map(x => term(x, col)).join('+');
  };
  // The same weighted sum as sumRef, as a number rather than a formula. Used
  // only to check whether the count the engine blended on matches what column
  // E adds up to, so the working in column Q can say so when it does not.
  const sumVal = (region, platform, key) => rawRows
    .filter(x => x.region === region && x.platform === platform && x.inWin)
    .reduce((a, x) => a + x.w * (x[key] || 0), 0);

  // Workings.
  const wsW = xlSheet(wb, 'Workings');
  let totalRow = 0;
  {
    xlTitle(wsW, role + ' plan, ' + monthLabel,
      'One row per location and platform. Performance data: ' + winLabel + '. Columns D to F come from Raw monthly data, '
      + 'weighted as shown there. Column I is the cost per application the plan was built on, written in as the figure '
      + 'the plan used rather than worked out again here, so the workbook and the plan cannot disagree. It is the '
      + 'measured cost in column H pulled toward the platform figure, by how many applications sit behind the cell: '
      + 'one with hundreds barely moves, one with a handful moves a long way. Column Q shows that working row by row. '
      + 'Everything else on the sheet is a live formula.');
    const cols = [
      { h: 'A\nLocation', w: 20 }, { h: 'B\nPlatform', w: 13 }, { h: 'C\nOpen roles', w: 10, a: 'right', f: N0 },
      { h: 'D\nSpend in period', w: 15, a: 'right', f: GBP2 },
      { h: 'E\nApplications', w: 13, a: 'right', f: N1 },
